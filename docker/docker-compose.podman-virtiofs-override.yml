# Podman macOS virtiofs secrets :U override — applied by install.sh on macOS Podman ONLY
# Usage: podman compose \
#   -f docker/docker-compose.yml \
#   -f docker/docker-compose.podman-override.yml \
#   -f docker/docker-compose.podman-virtiofs-override.yml \
#   up -d
# Last updated: 2026-07-19T00:00:00+00:00 (fix(podman-mac): FINDING-V412-RESTART-007 —
#   gateway drops the /var/run/docker.sock bind-mount entirely on macOS Podman; see
#   "GATEWAY DOCKER.SOCK REMOVAL" section below for full rationale)
# Last updated: 2026-07-12T00:00:00+00:00 (fix(podman-mac): langflow OPENSSL_armcap=0x8fd — suppress SVE SIGILL on applehv VM; GHSA-537c-gmf6-5ccf was baked into gateway/backoffice Dockerfiles; third-party langflow image requires compose-layer fix)
#
# ─────────────────────────────────────────────────────────────────────────────
# GATEWAY DOCKER.SOCK REMOVAL (FINDING-V412-RESTART-007, 2026-07-18/19):
#
#   docker-compose.yml:602 unconditionally mounts host `/var/run/docker.sock`
#   into gateway (Pool Manager container-per-identity isolation). On macOS,
#   that path is Docker Desktop's socket — Podman CANNOT statfs it (it is a
#   non-standard grpc-fuse/VPNKit forward, not a plain AF_UNIX socket file).
#   The base file's own comment already says "macOS Podman: socket can't be
#   mounted from host — Pool Manager uses stub mode" — but the mount itself
#   was never actually removed, so a podman install only "worked" by the
#   ACCIDENT of no docker.sock file existing at all on that path (e.g. Docker
#   Desktop not running). The instant a real docker.sock exists (Docker
#   Desktop started for a parallel Docker-leg test, or any host that also has
#   Docker installed), `podman create` hard-fails with
#   `Error: statfs /Users/max/.docker/run/docker.sock: operation not
#   supported` and the gateway container is never created — install-blocking,
#   verified 2026-07-18/19 fork-wiring run (install.log line 4317).
#
#   FIX: gateway.volumes is fully replaced (`!override` — podman-compose-ysg's
#   supported compose-spec merge-control tag, see podman_compose.py
#   rec_merge_one()) with every base entry EXCEPT the docker.sock line, so the
#   mount never reaches `podman create` on macOS regardless of whether a
#   docker.sock happens to exist on the host. Pool Manager already falls back
#   to stub mode cleanly when no socket backend is reachable
#   (src/yashigani/pool/backend.py::_detect_backend, "STUB MODE" branch) — this
#   makes that the ALWAYS-true state on macOS Podman, matching the documented
#   design intent, instead of an accident of host state.
#
#   Why `!override` (full-list replace) instead of a plain merge entry:
#   podman-compose's list-merge for `volumes` only supports REPLACING an
#   inherited entry that shares the same in-container mount TARGET (see
#   rec_merge_one()'s "clean duplicate mount targets" dedup) — there is no
#   plain-merge primitive to DELETE an inherited entry outright. `!override`
#   is the only way to drop the docker.sock line entirely rather than swap in
#   a different (still-present) mount at that target.
#
#   MAINTENANCE / DRIFT GUARD: this is a full-list override — if
#   docker-compose.yml's base `gateway.volumes` list ever changes, this list
#   must be updated to match (same entries minus the docker.sock line).
#   tests/install/test_gateway_socket_override.bats enforces this via a
#   fixture-backed cross-file comparison; it fails loudly on drift instead of
#   silently dropping a future gateway volume mount from the macOS Podman path.
#
#   Linux Podman is UNCHANGED by this fix — docker-compose.podman-override.yml
#   (the ALL-podman file, not this one) still carries the base file's
#   docker.sock mount unmodified. Linux's own real-Pool-Manager wiring (rootful
#   podman socket resolution, install.sh:8265-8323, `CONTAINER_SOCKET` written
#   to .env) is pre-existing, separate, and — per code inspection during this
#   fix — appears to have its own dead-wiring gap (CONTAINER_SOCKET is computed
#   and written but never interpolated into any compose file's mount source).
#   NOT fixed here: that is a distinct Pool Manager / compose contract question
#   (also touches src/yashigani/pool/backend.py's own socket-path fallback
#   list, which references a DIFFERENT in-container target,
#   `/var/run/container.sock`, than the compose file's actual
#   `/var/run/docker.sock` target — a second, independent mismatch). Surfaced
#   as a follow-up finding, not bundled into this override fix, to avoid
#   shipping an unverified change to a cross-component (compose + Python)
#   contract under this dispatch's "static verification only, no live re-run"
#   constraint.
# ─────────────────────────────────────────────────────────────────────────────
#
# WHY THIS FILE EXISTS (LINUX-SHARED-MOUNT-UID-CLOBBER regression — PR #138):
#
#   PR #135 added :U to all secrets bind-mounts in docker-compose.podman-override.yml.
#   :U tells Podman to lchown the host-side mount source to the subuid-mapped UID of
#   the container user before mounting. This is REQUIRED on macOS because:
#     1. podman unshare is unavailable on the macOS remote client.
#     2. _pki_chown_client_keys() uses podman_run mode (ephemeral container) on macOS,
#        which cannot pre-set per-file UIDs via unshare.
#     3. Without :U the virtiofs layer returns statfs EPERM on secret file reads.
#
#   On Linux rootless, :U is NOT safe on a SHARED bind-mount directory:
#     - _pki_chown_client_keys() uses `podman unshare chown` to set per-file UIDs
#       (redis_client.key → UID 999, backoffice cert → UID 1001, etc.).
#     - When :U is applied to a shared dir mounted by multiple containers, Podman
#       lchowns the ENTIRE host-side source directory to the subuid-mapped UID of
#       whichever container it processes last. This clobbers the per-file UIDs that
#       `podman unshare chown` set, so services get the wrong ownership.
#     - Root cause: :U applies to the mount source, not the mount target. A shared
#       source dir mounted N times with :U gets clobbered N-1 times. Only the last
#       container's mapped UID survives.
#   Example: if backoffice (UID 1001) mounts last, its lchown maps the whole
#   docker/secrets/ dir to subuid_base+1001. Redis (UID 999) can no longer read
#   redis_client.key because the file's ownership changed from subuid_base+999 to
#   subuid_base+1001. Redis healthcheck fails → install hangs at `podman wait`.
#
#   FIX (Option α per brief — smallest scope, preserves macOS fix):
#     Split :U mounts into this file, loaded macOS-only in install.sh.
#     Linux rootless uses `podman unshare` pre-chown (correct) without :U (safe).
#     docker-compose.podman-override.yml retains security_opt and other overrides
#     and is always loaded on Podman (Linux + macOS).
#
# RUNTIME MATRIX:
#   macOS Podman:     podman-override.yml + this file  ← :U applied
#   Linux rootless:   podman-override.yml only          ← no :U; unshare pre-chown
#   Linux rootful:    podman-override.yml only          ← :U N/A (root)
#   Docker (any):     neither file                      ← not loaded
#   K8s:              neither file                      ← helm chart handles
#
# VERIFICATION:
#   Linux rootless: `grep -r ":U" docker/` must NOT match the override file that
#   is loaded. Confirmed: install.sh only loads this file when uname == Darwin.

services:
  gateway:
    # !override: full-list replace, not a merge — see "GATEWAY DOCKER.SOCK
    # REMOVAL" header comment above. This is the complete gateway.volumes list
    # from docker-compose.yml with :U added to the two virtiofs-affected
    # secrets mounts (unchanged from before this fix) AND the base file's
    # `/var/run/docker.sock:/var/run/docker.sock:ro` line DELETED
    # (FINDING-V412-RESTART-007 — Podman on macOS cannot statfs Docker
    # Desktop's socket at that host path; Pool Manager already handles no
    # socket present via its documented stub-mode fallback).
    volumes: !override
      - audit_data:/data/audit
      - bootstrap_data:/data/bootstrap
      - ./secrets:/run/secrets:ro,U
      # YSG-RISK-053: scoped single-file mount needs :U on macOS virtiofs too
      # (same statfs-EPERM rationale as the dir mount). No clobber risk: the
      # hmac file is shared only by gateway + backoffice, both UID 1001.
      - ./secrets-caddy/caddy_internal_hmac:/run/secrets/caddy_internal_hmac:ro,U
      # FINDING-V412-F1 (Captain, 2026-07-22): mask both CA private keys — see
      # docker-compose.yml gateway service comment + docker/pki-key-mask/README.md.
      # denied.mask never contains secret material, so no :U ownership concern.
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U
      - ./cloud-keys:/run/cloud-keys:rw
      - ./var/runtime/service_identities.yaml:/etc/yashigani/service_identities.yaml:ro
      # NO /var/run/docker.sock entry here — see header comment. Pool Manager
      # runs in stub mode on macOS Podman, unconditionally, regardless of
      # whether a docker.sock happens to exist on the host.

  backoffice:
    # FINDING-V412-RESTART-012 FIXED (Captain, 2026-07-21): this entry was
    # ":rw,U" — the ONLY service in this whole file whose /run/secrets is
    # anything but ro,U. Laura proved (laura-012-rogue-reattack.md) that a
    # compromised backoffice could use this to overwrite ca_root.crt and
    # forge the root-attestation pin, enabling full rogue-CA injection. This
    # override REPLACES (not merges) the base file's /run/secrets entry by
    # matching in-container target (podman-compose dedup-by-target — see
    # header comment), so ":rw,U" here was silently overriding the base
    # file's already-correct ":ro" — this is the ACTUAL live root cause on
    # macOS Podman (confirmed via `podman inspect` showing RW=true even
    # after the base docker-compose.yml's nested-mount fix). Fixed to
    # ro,U, matching every other service in this file. The 4 legitimately
    # writable secrets now live at /run/secrets-rw/<name> (base
    # docker-compose.yml) — plain file bind-mounts of already
    # correctly-owned host files, which (unlike the directory-level mount)
    # do not need :U on this virtiofs setup (verified live: unqualified
    # inherited entries work — see docker/docker-compose.yml).
    volumes:
      - ./secrets:/run/secrets:ro,U
      # YSG-RISK-053: see gateway note above.
      - ./secrets-caddy/caddy_internal_hmac:/run/secrets/caddy_internal_hmac:ro,U
      # FINDING-V412-F1 (Captain, 2026-07-22): mask ca_root.key ONLY — backoffice
      # keeps the real ca_intermediate.key (mint_agent_leaf onboarding signer).
      # See docker-compose.yml backoffice service comment.
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U

  policy:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  redis:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  prometheus:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  grafana:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  caddy:
    volumes:
      - ./secrets:/run/secrets:ro,U
      # YSG-RISK-053: Caddy-scoped secrets (docker/secrets-caddy/) — single-file
      # :U mounts; caddy is the ONLY consumer of the mesh leaf key/crt.
      # caddy_internal_hmac is deliberately NOT :U'd here: caddy (UID 0) would
      # lchown the shared source file away from subuid+1001 and clobber the
      # gateway/backoffice mapping (LINUX-SHARED-MOUNT-UID-CLOBBER pattern —
      # see header). Caddy reads the HMAC via the CADDY_INTERNAL_HMAC env var,
      # never the file, so the base ro mount is sufficient.
      - ./secrets-caddy/caddy_client.crt:/run/secrets/caddy_client.crt:ro,U
      - ./secrets-caddy/caddy_client.key:/run/secrets/caddy_client.key:ro,U
      # FINDING-V412-F1 (Captain, 2026-07-22): mask both CA private keys.
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  postgres:
    volumes:
      - ./secrets:/run/secrets:ro,U
      # FINDING-V412-RESTART-012: postgres-only root-attestation dir — same
      # :U rationale as /run/secrets above (directory-level bind mount needs
      # it on macOS virtiofs; no other service mounts this path at all).
      - ./secrets-pki-attest:/run/secrets-pki-attest:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  pgbouncer:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  alertmanager:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  loki:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  otel-collector:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  jaeger:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  vault:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  budget-redis:
    volumes:
      - ./secrets:/run/secrets:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_root.key:ro,U
      - ./pki-key-mask/denied.mask:/run/secrets/ca_intermediate.key:ro,U

  # langflow — third-party image, cannot bake OPENSSL_armcap into Dockerfile.
  # Root cause: cryptography >=46.0.0 ships a Rust/OpenSSL arm64 binary
  # (_rust.abi3.so) that calls `cntb x0` (SVE) inside OPENSSL_cpuid_setup based
  # on HWCAP2 SVE2 flag.  The podman applehv VM (Apple Hypervisor.framework) sets
  # the SVE2 HWCAP2 bit but SVE instructions fault with SIGILL at runtime —
  # the hypervisor advertises the feature but does not expose the SVE execution
  # context to the guest.
  # Fix: OPENSSL_armcap=0x8fd masks out all SVE/SVE2 bits (bits ≥10 unset)
  # while keeping AES/PMULL/SHA1/SHA256/SHA512/CPUID/RNG/SHA3 (bits 0-7+11).
  # Bit 14 = 0 so the `tbz w0, #0xe` guard in OPENSSL_cpuid_setup skips the
  # `bl _armv8_sve_get_vl_bytes` call entirely.  Same value baked into
  # gateway/backoffice Dockerfiles (GHSA-537c-gmf6-5ccf, 2026-07-11).
  # macOS-Podman ONLY: Linux Podman on aarch64 hardware has correct SVE support;
  # this override must NOT be applied on Linux (install.sh gates on uname Darwin).
  langflow:
    environment:
      OPENSSL_armcap: "0x8fd"
