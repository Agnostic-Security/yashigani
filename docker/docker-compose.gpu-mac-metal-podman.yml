# GPU overlay — Mac / Apple Metal — Podman runtime path.
# last-updated: 2026-07-12 (fix(gpu): podman-mac host-ollama routing via gvproxy)
#
# CONTEXT: identical intent to docker-compose.gpu-mac-metal.yml (Docker path).
# Apple Metal cannot be passed into a Linux VM container on macOS. Podman machine
# runs containers inside a Linux VM (qemu/virtiofs); there is no Metal passthrough.
# A host-native ollama (library=metal) must be running on the Mac. This overlay
# routes Caddy's ollama-front upstream to that host-native process.
#
# RUNTIME: Podman machine on macOS ONLY. DO NOT apply on Docker Desktop Mac
# (use docker-compose.gpu-mac-metal.yml) or on Linux (no Metal).
#
# MECHANISM — caddy service changes ONLY:
#   1. extra_hosts "ollama:192.168.127.254"
#      Caddyfile.ollama-front uses `reverse_proxy http://ollama:11434`.
#      /etc/hosts resolution takes precedence over aardvark-dns, so caddy's
#      TCP dial for "ollama" goes to gvproxy at 192.168.127.254, which relays
#      the connection to 127.0.0.1:11434 on the Mac host.
#      The Caddyfile is NOT modified — Helm ConfigMap parity preserved.
#   2. extra_hosts "host.containers.internal:192.168.127.254"
#      host.docker.internal:192.168.127.254 — Podman auto-injects both names
#      into every container /etc/hosts, but explicit entries here guarantee
#      that caddy-entrypoint.sh Step 6 (`getent ahosts`) resolves them to the
#      correct gvproxy IP even if auto-injection behaviour changes.
#   3. YASHIGANI_CADDY_EGRESS_ALLOWLIST=host.containers.internal:11434
#      caddy-entrypoint.sh Step 6 resolves host.containers.internal → 192.168.127.254,
#      then adds: iptables -A OUTPUT -p tcp --dport 11434 -d 192.168.127.254 -j ACCEPT
#      gvproxy translates the container→192.168.127.254:11434 connection to
#      127.0.0.1:11434 on the Mac. This is the ONLY host-egress port opened.
#
# GVPROXY RELAY (confirmed mechanism — 2026-07-12):
#   Podman machine on macOS uses gvproxy (github.com/containers/gvisor-tap-vsock).
#   From inside a container:
#     curl http://host.containers.internal:11434/api/version  →  {"version":"0.31.2"}
#   gvproxy relays to 127.0.0.1:11434 on the Mac host.
#   - 192.168.127.254 is gvproxy's canonical virtual host IP — stable across
#     Podman versions and machine init cycles (documented in gvproxy source).
#   - Binding host ollama to ONLY 127.0.0.1:11434 is sufficient AND correct
#     (same Laura C3 constraint as the Docker path — loopback-only, no LAN).
#   - Caddy reaches 127.0.0.1:11434 on the Mac via this relay.
#   Verified: Podman machine on macOS, host ollama 0.31.2 on 127.0.0.1:11434,
#   {"version":"0.31.2"} returned from inside the container.
#
# DIFFERENCE FROM docker-compose.gpu-mac-metal.yml (Docker path):
#   Docker:  extra_hosts[ollama:host-gateway] (Docker-resolved bridge IP +
#            VPNKit relay to host loopback). EGRESS uses host.docker.internal.
#   Podman:  extra_hosts[ollama:192.168.127.254] (gvproxy canonical IP,
#            no host-gateway token needed). EGRESS uses host.containers.internal.
#   Services changed (caddy, ollama, gateway, ollama-init): IDENTICAL behaviour.
#
# C4 — CONTAINER OLLAMA EXCLUDED (FIND-OLLAMA-MAC fix, 2026-08-03; same
# mechanism as the Docker path):
#   1. services.ollama: profiles: [mac-metal-host-ollama-only] — a profile
#      value never passed via --profile, so the service is entirely absent
#      from the merged compose model (not merely started-and-neutralised —
#      supersedes the earlier FINDING-V412-RESTART-005 `sleep infinity`
#      workaround; see the inline comment on the `ollama:` block below for
#      why this also resolves that finding's original podman-wait-hang
#      concern more cleanly, by removing the wait target instead of making
#      it trivially satisfiable).
#   2. services.gateway.depends_on.ollama: required: false added — the
#      dependency can never be satisfied once ollama is absent; the
#      podman-compose-ysg fork's AS-FIX-3 check_dep_conditions() explicitly
#      skips (no `podman wait` issued) for required:false + absent.
#   3. services.ollama-init: same sentinel profile (models are pre-pulled on
#      the host; never runs on Mac Metal regardless of agent bundle).
#   Frees ~4 GB VRAM / VM RAM AND removes the lingering running container
#   entirely.
#
# HOST-EGRESS SURFACE (mirrors LAURA-METAL-01 constraints):
#   Path opened:  caddy container → 192.168.127.254:11434 via gvproxy
#   Actual target: 127.0.0.1:11434 on the Mac (loopback, not LAN-routable)
#   Who can use:  caddy ONLY (extra_hosts + EGRESS_ALLOWLIST applied to caddy only)
#   iptables:     Step 6 adds ACCEPT for 192.168.127.254:11434.
#                 Rootless Podman without NET_ADMIN: entrypoint logs a warning
#                 and continues (Caddy starts without iptables restriction;
#                 primary isolation is loopback binding on the host ollama).
#   Other containers: cannot reach host:11434 (no extra_hosts, no iptables rule)
#   Internet reachability of host ollama: NONE (loopback binding blocks all LAN)
#   Auth gate:    all /ollama/* requests still pass Caddyfile.ollama-front
#                 require_and_verify mTLS gate (SPIFFE leaf + intermediate CA)
#                 before reaching host ollama — auth perimeter unchanged.
#   C7 preserved: X-SPIFFE-ID header_up forwarding unchanged in Caddyfile.
#
# OPERATOR REQUIREMENTS (before install.sh runs on Mac Metal + Podman):
#   1. Host ollama installed:
#        brew install ollama
#   2. Start host ollama with LOOPBACK binding (Laura C3 — required):
#        OLLAMA_HOST=127.0.0.1:11434 ollama serve
#        # Do NOT use 0.0.0.0 (LAN exposure).
#        # gvproxy relays container→192.168.127.254:11434 to 127.0.0.1 on the Mac.
#   3. Models pre-pulled on the host (ollama-init is disabled here):
#        ollama pull qwen2.5:3b
#        ollama pull qwen2.5:7b   # or whichever VRAM-tier model is selected
#   4. Verify Metal is in use:
#        curl -s http://127.0.0.1:11434/api/tags   # host must respond
#        # ollama logs show: library=metal
#   5. OLLAMA_ORIGINS must NOT be set to * — inference-only, no tool/fs extensions.
#
# INSTALL.SH AUTO-SELECTS THIS OVERLAY when:
#   YSG_GPU_TYPE=apple_metal AND uname==Darwin AND Podman runtime AND not K8s.
#   Preflight check: curl -fs http://127.0.0.1:11434/api/tags — aborts if unreachable.
#
# MANUAL APPLY (for testing without full reinstall):
#   cd /path/to/yashigani/docker && \
#   podman compose -f docker-compose.yml \
#     -f docker-compose.podman-override.yml \
#     -f docker-compose.podman-virtiofs-override.yml \
#     -f docker-compose.gpu-mac-metal-podman.yml \
#     up -d --force-recreate caddy ollama gateway
#
# NOT APPLICABLE TO:
#   - Linux (no Metal)
#   - Kubernetes (no host-gateway concept; use dedicated K8s inference service)
#   - Docker Desktop on Mac (use docker-compose.gpu-mac-metal.yml instead)

services:
  caddy:
    extra_hosts:
      # gvproxy canonical virtual host IP — Podman machine on macOS (stable).
      # Podman auto-injects host.containers.internal + host.docker.internal at
      # this address, but explicit entries guarantee Step 6 getent ahosts works.
      - "host.containers.internal:192.168.127.254"
      - "host.docker.internal:192.168.127.254"
      # Reroute Caddyfile.ollama-front's `reverse_proxy http://ollama:11434` to
      # gvproxy. /etc/hosts takes priority over aardvark-dns (Podman's embedded
      # DNS). gvproxy relays 192.168.127.254:11434 → 127.0.0.1:11434 on Mac.
      # header_up Host "localhost" in Caddyfile ensures ollama accepts request
      # regardless of the upstream IP (same fix as the Docker VPNKit path).
      - "ollama:192.168.127.254"
    environment:
      # Step 6: add host-ollama to caddy-entrypoint.sh iptables egress allowlist.
      # Resolved at container startup: host.containers.internal → 192.168.127.254
      # iptables rule: -A OUTPUT -p tcp --dport <PORT> -d 192.168.127.254 -j ACCEPT
      # gvproxy relays to 127.0.0.1 on Mac. ONLY host-egress TCP path opened.
      # Rootless Podman without NET_ADMIN: logged as warning; Caddy starts anyway
      # (loopback binding is the primary isolation; iptables is defence-in-depth).
      # Port is resolved by install.sh _resolve_host_ollama_port() (feat/v411-mac-ollama-port-detect-ask):
      #   probe 11434 → OLLAMA_HOST parse → lsof-detect → interactive prompt → abort.
      # ${YASHIGANI_HOST_OLLAMA_PORT:-11434}: export from install.sh or default 11434.
      YASHIGANI_CADDY_EGRESS_ALLOWLIST: "host.containers.internal:${YASHIGANI_HOST_OLLAMA_PORT:-11434}"
      # Pass resolved port into caddy container so Caddyfile.ollama-front expands
      # {$YASHIGANI_HOST_OLLAMA_PORT:11434} to the correct port at Caddy startup.
      YASHIGANI_HOST_OLLAMA_PORT: "${YASHIGANI_HOST_OLLAMA_PORT:-11434}"

  # FIND-OLLAMA-MAC fix (2026-08-03): genuinely EXCLUDE the container from
  # the active service set instead of neutralising its entrypoint.
  #
  # Prior behaviour (FINDING-V412-RESTART-005, `entrypoint: ["sleep",
  # "infinity"]`) chose to keep a no-op container genuinely RUNNING forever
  # (rather than exit-0-immediately) specifically so `podman wait
  # --condition=running` — which gateway's `depends_on: ollama: condition:
  # service_started` compiles to under the podman-compose-ysg fork — would
  # be satisfied without hanging. That fix WORKED for the hang, but it also
  # meant a real, permanently-running docker.io/ollama/ollama container
  # (CPU-only, no models) sat idle on every Mac/Podman install — exactly the
  # FIND-OLLAMA-MAC defect (install.sh:465 documents "Container ollama
  # bypassed", not "container ollama runs a permanent no-op sleep").
  #
  # This fix removes the target of the wait instead of making it trivially
  # satisfiable: `profiles: [mac-metal-host-ollama-only]` — a profile value
  # never passed via --profile anywhere in install.sh — drops the service
  # from the merged compose model entirely (confirmed empirically against
  # both `docker compose config --services`, list-field REPLACE semantics,
  # and the vendored podman-compose-ysg fork's own `_resolve_profiles()`).
  # With ollama absent from the model, the original RESTART-005 hang cannot
  # occur in the first place: gateway.depends_on.ollama is marked
  # required:false below, and the fork's check_dep_conditions()
  # (podman_compose.py:3254-3262, AS-FIX-3) explicitly skips — no
  # `podman wait` call is ever issued — for a required:false dependency
  # whose name is absent from container_names_by_service (the fork's own
  # documented mechanism for "excluded by --profile", already exercised
  # elsewhere for ollama-init/demo-mcp). container_to_args()'s --requires=
  # builder (podman_compose.py:1182) independently no-ops the same way
  # (`.get(dep_srv.name, [])` on an absent service yields nothing to add).
  ollama:
    profiles:
      - mac-metal-host-ollama-only

  # gateway.depends_on.ollama must be marked required:false — ollama is no
  # longer a defined service once excluded above, so the dependency can
  # never be satisfied. condition stays service_started (harmless, never
  # evaluated once required:false + absent — see rationale above).
  gateway:
    depends_on:
      ollama:
        condition: service_started
        required: false

  # ollama-init is already profile-gated in the base file to
  # [langflow, letta, openclaw] (SF-011). On Mac Metal, models are managed
  # on the host ollama, so ollama-init must never run regardless of which
  # agent bundle is active. `profiles:` here REPLACES the base list (same
  # mechanism as above), so the same sentinel unconditionally excludes
  # ollama-init from every Mac-Metal Podman install — agent bundle active
  # or not.
  ollama-init:
    profiles:
      - mac-metal-host-ollama-only
