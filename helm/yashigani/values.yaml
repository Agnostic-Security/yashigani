  # YSG-RISK-005 #3av: requests = 50% of limit.
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    metricsPort: 8889
    type: ClusterIP

# ---------------------------------------------------------------------------
# Caddy — TLS edge proxy (K8s front door, Option B parity with Docker/Podman)
# ---------------------------------------------------------------------------
# Caddy is the K8s front door for Yashigani. It terminates the public TLS
# session and speaks mTLS upstream to gateway/backoffice/policy — exact
# parity with Docker/Podman compose. Cluster operators MAY layer
# nginx-ingress + cert-manager (or any L7) in front of Caddy at the cluster
# edge for ACME automation, WAF, or multi-tenant routing — Caddy stays.
#
# Disabling caddy here will break the in-cluster mTLS plane: gateway and
# backoffice both terminate mTLS internally, so a plaintext upstream from
# any other reverse proxy will be refused at the TLS handshake. Use the
# layered-edge pattern instead.
# ---------------------------------------------------------------------------
caddy:
  enabled: true
  image:
    repository: caddy
    tag: "2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # YSG-RISK-005 #3av: requests = 50% of limit.
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  service:
    port: 443
    httpPort: 80
    type: LoadBalancer
  # v2.23.1 EX-231-08 — Caddy-centric SPIFFE URI ACL on /internal/metrics.
  # When enabled, Caddy terminates an additional internal-only listener on
  # :8444 that requires peer-cert auth, validates the URI SAN, and forwards
  # it as X-SPIFFE-ID to the gateway/backoffice upstream. Prometheus scrapes
  # go through this listener instead of hitting the pods directly.
  # Requires the mesh mTLS plane (caddy_client.{crt,key} + ca_intermediate.crt) to
  # be mounted into the caddy pod — Pattern B: intermediate only, not root.
  internalMetricsListener:
    enabled: true
    port: 8444
  # #81 fix parallel backoffice listener (Prom v3 rejects Host via http_headers).
  # Toggle in lockstep with internalMetricsListener.enabled.
  internalMetricsListenerBackoffice:
    enabled: true
    port: 8445
  # v4.1 SU-SEAM-1d-04 — mesh-mTLS caddy admin relay for the K8s MCP
  # approve-transaction route-registration path
  # (mcp_onboard._register_route_via_broker_relay, FINDING-V412-CADDYADMIN-002).
  # NOT the raw admin API (that stays unix-socket-only per MUST-4): an mTLS
  # require_and_verify site block admitting ONLY POST/DELETE /route from the
  # backoffice SPIFFE URI, proxied to the co-located caddy-config-broker
  # sidecar (never directly to the admin socket).
  # Requires mtls.enabled=true (templates gate on both). NetworkPolicy
  # restricts ingress on this port to backoffice pods.
  adminRelay:
    enabled: true
    port: 2019
  # FINDING-V412-CADDYADMIN-002 REWORK (Captain, 2026-07-21): the :2019
  # relay above (mTLS + SPIFFE-gated) used to proxy a raw POST /load body
  # (the FINDING-V412-CADDYADMIN-001 R1 fix, Su) — content-VALIDATED by this
  # sidecar against a startup-computed baseline before forwarding. Laura's
  # final re-attack proved the compose twin of that design FAILED live under
  # the real no-new-privileges security context (the broker's own
  # `caddy adapt` EPERM'd — every legitimate reload 502'd; see
  # docker/caddy/config_broker.py module docstring). This sidecar now
  # exposes POST/DELETE /route instead: backoffice sends narrow typed DATA
  # (tenant_id/server_id/mesh_port/shim_port), the sidecar independently
  # re-validates every field, renders the wrap from its OWN fixed template,
  # and writes it into the caddy-agents-dynamic pod-local emptyDir (see
  # caddy.yaml) — R1 (rogue /load body) is closed by construction, not by
  # content-filtering a body that no longer exists. Same image as compose's
  # caddy-config-broker service, BROKER_LISTEN_MODE=tcp. Loopback-only — no
  # Service/Ingress ever fronts this port; only reachable from the caddy
  # container in the SAME pod. R2 (compose's rogue docker/caddy/agents/
  # *.caddy filesystem vector) has NO K8s equivalent — audited 2026-07-21:
  # zero RBAC rules in this chart grant any workload ServiceAccount
  # "configmaps" access, so yashigani-caddy-config / yashigani-caddy-agents
  # are Helm/kubectl-managed only, never workload-writable.
  configBroker:
    enabled: true
    image:
      # Built locally by install.sh / your CI from
      # docker/caddy/Dockerfile.caddy-broker (same image compose uses).
      # For K8s deployments: push to your own private registry and update
      # the repository field accordingly. Pin your post-build digest with
      # `@sha256:<digest>` for supply-chain attestation (recommended).
      repository: yashigani-caddy-config-broker
      tag: "4.1.2"
      pullPolicy: IfNotPresent
    port: 8199
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  # YSG-RISK-061 (v2.24.1): operator ACME / external egress allowlist.
  # Comma-separated list of additional host:port pairs to allow in the
  # caddy-entrypoint.sh iptables OUTPUT rules. Default is empty (only the
  # built-in defaults — LE ACME + OCSP — are applied by the entrypoint).
  # Example: "acme.corp.example:443,ocsp.corp.example:80"
  egressAllowlist: ""

# ---------------------------------------------------------------------------
# v4.1 unified-sidecar Phase 2a — per-system egress forwarders
# (templates/egress-forwarders.yaml; design §2.2(c/d), §2.3, §2.6)
#
# Empty by default. Codegen emits a values-<system>-egress.yaml overlay per
# onboarded system that declares spec.egress.needs != []; apply it with -f.
# The map keys are unique camelCase per (system, tenant), so multiple
# overlays merge additively (same rationale as mcpSvid).
#
# openclaw (transitional, pin-AND-grant OVERLAP phase): the codegen-emitted
# overlay lives at helm/yashigani/values-openclaw-egress.yaml — apply with
#   helm upgrade yashigani ./helm/yashigani \
#     -f helm/yashigani/values-openclaw-egress.yaml
# alongside agentBundles.openclaw.enabled=true. The static :18790 caller/
# destination pins remain in force; pin deletion is a later, Laura-gated
# step (unified-sidecar synthesis must-fix #1).
# ---------------------------------------------------------------------------
egressForwarders: {}

# ---------------------------------------------------------------------------
# v4.1 unified-sidecar §2.5 — agent INGRESS fronts (bidirectional wrap)
#
# Empty by default. Codegen emits a values-<system>-ingress.yaml overlay per
# wrapped system with spec.ingress.surface in {openai-api, http-api}; apply
# with -f alongside the matching agentBundles.<system>.enabled=true. Map
# keys are unique camelCase per (system, tenant) — additive merges.
#
# Rendered by:
#   templates/caddy-agents-configmap.yaml — mesh-listener snippet into the
#     yashigani-caddy-agents ConfigMap (semantic parity with the compose
#     artifact docker/caddy/agents/<system>-ingress.caddy; documented K8s
#     hostname deltas only: yashigani-backoffice / yashigani-<system>).
#   templates/agent-ingress-fronts.yaml — yashigani-caddy-mesh ClusterIP
#     Service (mesh ports are NEVER on the public LoadBalancer Service —
#     admin-relay rationale) + additive NetworkPolicies
#     (gateway/backoffice → caddy:<meshPort>; caddy → system:<shimPort>).
#
# Gateway/backoffice dispatch to bundled agents rides these fronts — never a
# direct pod dial (§2.6: the ingress ringfence is strictly 2-member
# {system, caddy}; K8s analogue: agent ingress NP admits the caddy pod only).
#   helm upgrade yashigani ./helm/yashigani \
#     -f helm/yashigani/values-langflow-ingress.yaml
# ---------------------------------------------------------------------------
agentIngressFronts: {}

# ---------------------------------------------------------------------------
# Optional Agent Bundles (v0.8.0)
#
# All four agents are DISABLED by default.  Enable per-agent with:
#   helm upgrade yashigani ./helm/yashigani \
#     --set agentBundles.langgraph.enabled=true
#
# DISCLAIMER: These integrations are provided AS IS by Agnostic Security.
# Image digests are pinned and updated with each Yashigani release.
# All support goes to the upstream maintainers.
# ---------------------------------------------------------------------------
agentBundles:

  langgraph:
    enabled: false
    image:
      # ANOMALY 2026-05-02: langchain/langgraph-api is not publicly available on
      # Docker Hub — pull fails. Agent bundle disabled by default (enabled: false).
      # G16 hold-back 2026-05-10 (resolution shipped in v2.23.3): no stable public
      # tag exists; floating "latest" replaced with "not-yet-available" sentinel
      # per image-pinning policy. Sentinel is unpullable by design — operators
      # must supply a real tag+digest before flipping `enabled: true`.
      # Re-evaluate when langchain/langgraph-api publishes a public tag.
      repository: langchain/langgraph-api
      tag: "not-yet-available"
      pullPolicy: IfNotPresent
    replicaCount: 1
    env:
      LANGGRAPH_YASHIGANI_URL: "http://yashigani-gateway:8080"
    # YSG-RISK-005 #3av: requests = 50% of limit.
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    # Secret name that holds the agent registration token
    tokenSecretName: "yashigani-langgraph-token"
    tokenSecretKey: "token"

  # goose: REMOVED — ACP protocol too slow on CPU (~300s per request)
  # crewai: REMOVED — enterprise-only as of v2.1. Contact sales@agnosticsec.com.

  openclaw:
    # NOTE: Node.js 24 image — approximately 800 MB (larger than Python agent images).
    # OpenClaw runs its own Gateway on port 18789.
    # Integration: OpenClaw Gateway -> Yashigani Gateway -> LLM providers.
    # License: MIT (github.com/openclaw/openclaw)
    enabled: false
    # FP-06 Phase 2: Telegram bot-ID pin. Set to the bot's numeric ID (e.g. "123456789")
    # to restrict the :18790 egress gateway to one specific Telegram bot account.
    # Empty string (default) = inert; enforcement begins when non-empty.
    telegramBotId: ""
    # FP-06 Phase 2: Slack channel pins (operator-supplied; inert-until-set).
    # Stored in K8s Secret yashigani-openclaw-slack-secrets; injected as env vars
    # into the Caddy pod (YASHIGANI_OPENCLAW_SLACK_{WEBHOOK_PATH,BOT_TOKEN}).
    # Caddy reads them at parse time via {$YASHIGANI_OPENCLAW_SLACK_*:} in the
    # :18790 egress Caddyfile block.
    slack:
      # CHANNEL 1: incoming-webhook path pin (/services/T.../B.../<secret>).
      # Set to the path component of the operator's Slack incoming-webhook URL.
      # Empty (default) = feature OFF (no enforcement).
      webhookPath: ""
      # CHANNEL 2: Web API bot-token pin (xoxb-..., scoped to one workspace).
      # Set to the operator's Slack bot token. Empty (default) = feature OFF.
      # WARNING: this value is stored in the Helm release secret. Use a K8s
      # ExternalSecret / SealedSecret for production hardening.
      botToken: ""
    image:
      # Pinned to 2026.5.6 to match docker-compose.yml. INDEX digest verified
      # 2026-05-07 via crane digest — multi-arch (linux/amd64 + linux/arm64).
      repository: ghcr.io/openclaw/openclaw
      tag: "2026.5.6@sha256:2ca86d6296fe2ae7111dac14843551340a4c5099e01566253b62c4d3e0a337fc"
      pullPolicy: IfNotPresent
    # NEW-K8S-OPENCLAW-NONROOT-001 (found live during 4.1.2 k3s/Cilium e2e,
    # 2026-07-28): the pinned openclaw image (Node.js base) runs as uid=1000
    # with named user "node" (non-numeric USER directive) — confirmed via
    # `docker run --rm --entrypoint sh <image> -c 'id node'` => uid=1000(node)
    # gid=1000(node). K8s runAsNonRoot rejects non-numeric USER directives
    # without an explicit runAsUser (kubelet error: "container has
    # runAsNonRoot and image has non-numeric user (node), cannot verify user
    # is non-root" — CreateContainerConfigError, every pod, every start).
    # Identical root cause + fix already applied to the langflow bundle above
    # (see its podSecurityContext comment) — openclaw never got the same
    # treatment. Fix: pin the same numeric UID the image itself declares.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
    replicaCount: 1
    env:
      OPENCLAW_SERVER_MODE: "true"
      OPENCLAW_DISABLE_AUDIO: "true"
      OPENCLAW_DISABLE_CAMERA: "true"
      OPENCLAW_DISABLE_LOCATION: "true"
      OPENCLAW_DISABLE_VOICE_WAKE: "true"
      # REMOVED 2026-07-07 (v4.1 three-agent wrap — schema-verified against
      # the pinned ghcr.io/openclaw/openclaw:2026.5.6 image):
      #   OPENCLAW_UPSTREAM_URL, OPENCLAW_{SLACK_API,SLACK_HOOKS,
      #   TELEGRAM_API}_BASE_URL were FABRICATED env vars — the binary never
      #   reads any of them (grep of /app/dist + /app/extensions). openclaw's
      #   REAL wiring mechanism is its config file (openclaw.json:
      #   models.providers.<name>.baseUrl for LLM,
      #   channels.telegram.apiRoot for Telegram; Slack has NO base-URL
      #   config in 2026.5.6 — CONNECT proxy only).
      # KNOWN K8s PARITY GAP (flagged, Captain/agent-bundles.yaml): the K8s
      # openclaw Deployment does not yet mount an openclaw.json ConfigMap —
      # K8s openclaw therefore has NO working LLM/Telegram repoint (and never
      # had one: the removed env vars were no-ops). Compose carries the
      # canonical config at docker/openclaw/openclaw.runtime.json; the K8s
      # equivalent (ConfigMap + OPENCLAW_CONFIG_PATH + bearer substitution)
      # must be added by the bundle template for the forwarder path
      # (yashigani-egress-openclaw:9400/{llm,telegram}) to carry traffic.
    service:
      # Expose OpenClaw's own gateway port for incoming messaging webhooks
      port: 18789
      type: ClusterIP
    # YSG-RISK-005 #3av: requests = 50% of limit.
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    tokenSecretName: "yashigani-openclaw-token"
    tokenSecretKey: "token"
    # NEW-K8S-OPENCLAW-TMPDIR-001 (found live during 4.1.2 k3s/Cilium e2e,
    # 2026-07-28, same investigation as the podSecurityContext fix above):
    # with runAsNonRoot/runAsUser fixed, the container now actually starts —
    # and immediately crashes: "[openclaw] Failed to start CLI: Error:
    # Unable to create fallback OpenClaw temp dir: /tmp/openclaw-1000"
    # (readOnlyRootFilesystem: true is the template default; nothing mounts
    # a writable /tmp). Same class of fix already applied to langflow below
    # (extraVolumeMounts/extraVolumes for a writable /tmp emptyDir).
    # NEW-K8S-OPENCLAW-HOMEDIR-001 (found live during 4.1.2 k3s/Cilium e2e,
    # 2026-07-28, same investigation): with /tmp fixed the container gets
    # further, then crashes again: "Gateway failed to start: Error: EROFS:
    # read-only file system, open '/home/node/.openclaw/openclaw.json.1....tmp'"
    # — openclaw persists/atomically-rewrites its own config + state under
    # its home directory (~/.openclaw), which also needs to be writable
    # under readOnlyRootFilesystem: true.
    extraVolumeMounts:
      - name: openclaw-tmp
        mountPath: /tmp
      - name: openclaw-home
        mountPath: /home/node/.openclaw
    extraVolumes:
      - name: openclaw-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: openclaw-home
        emptyDir:
          sizeLimit: 64Mi

  # Langflow — Visual multi-agent workflow builder (MIT)
  # https://github.com/langflow-ai/langflow
  # Single container, embedded SQLite. OpenAI-compatible API on port 7860.
  # Users build custom agent workflows visually via the Langflow UI.
  # All LLM calls route through Yashigani gateway (OpenAI-compatible).
  #
  # DEFAULT: enabled=true (v4.1 — first-class Yashigani UX).
  # Operators who do not want langflow should set enabled=false explicitly.
  langflow:
    enabled: true
    image:
      # Pinned to 1.9.2 to match docker-compose.yml.
      # INDEX digest verified 2026-05-13 — multi-arch (linux/amd64 + linux/arm64).
      repository: docker.io/langflowai/langflow
      tag: "1.9.2@sha256:45238e614ce42bf93fea36a56316d3ebafdaf70c4df4425aeb2c90b035ec4a14"
      pullPolicy: IfNotPresent
    replicaCount: 1
    env:
      # v4.1 three-agent wrap (2026-07-07): ALL LLM calls dial langflow's
      # egress-forwarder Service (templates/egress-forwarders.yaml, rendered
      # from the values-langflow-egress.yaml overlay — install.sh layers it
      # whenever this bundle is enabled via --agent-bundles). The forwarder
      # holds the langflow SVID and presents the leaf to
      # yashigani-caddy:18790/llm → /egress/eval → /deliver/llm →
      # yashigani-gateway:8081/v1 (same surface as before, governance in
      # front). Bearer via secretKeyRef STAYS (pin-AND-grant overlap).
      OPENAI_API_BASE: "http://yashigani-egress-langflow:9400/llm/v1"
      # OPENAI_API_KEY is injected via secretKeyRef (internalBearer Secret) in
      # agent-bundles.yaml — do NOT set it here (Captain Bucket-C fix).
      LANGFLOW_DEFAULT_MODEL: "qwen2.5:3b"
      DO_NOT_TRACK: "true"
      LANGFLOW_AUTO_LOGIN: "true"
      # COMPOSE PARITY FIX (2026-07-21): persistence.mountPath (/app/langflow, PVC
      # below) and extraVolumeMounts/RO-rootfs were already wired, but langflow was
      # never TOLD to use that mount — it defaulted to sqlite/config paths under
      # the read-only image rootfs (/app/.venv/.../langflow.db,
      # /app/data/.cache/langflow), so initialize_database() raised
      # sqlite3.OperationalError: unable to open database file → CrashLoopBackOff.
      # Mirrors docker-compose.yml:2255-2256 (langflow_data:/app/langflow named
      # volume + these same two env vars). Same fix Compose already carries.
      LANGFLOW_DATABASE_URL: "sqlite:////app/langflow/langflow.db"
      LANGFLOW_CONFIG_DIR: "/app/langflow/config"
      # FAIL-002 parity (v2.23.4): langflow 1.9.2 writes alembic migration log to
      # /app/.venv/lib/python3.12/site-packages/langflow/alembic/alembic.log — inside
      # the image rootfs. readOnlyRootFilesystem:false already prevents EROFS in K8s,
      # but this env var is defence-in-depth: redirects alembic output to stdout
      # (langflow.services.database.service._run_migrations uses nullcontext(sys.stdout)
      # when alembic_log_to_stdout=True, bypassing the file open entirely).
      LANGFLOW_ALEMBIC_LOG_TO_STDOUT: "true"
    service:
      port: 7860
      type: ClusterIP
    # YSG-RISK-005 #3av: requests = 50% of limit.
    # Langflow is heavier than letta (visual UI + workflow engine): 1 GiB limit.
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    # Persistent volume for Langflow SQLite DB and flow data.
    persistence:
      enabled: true
      mountPath: /app/langflow
      size: 5Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    tokenSecretName: "yashigani-langflow-token"
    tokenSecretKey: "token"
    # Langflow image (1.9.2) runs as uid=1000 with named user "user" (non-numeric).
    # K8s runAsNonRoot rejects non-numeric USER directives without runAsUser set.
    # Fix: explicit runAsUser: 1000 so K8s can verify non-root. Risk: LOW (image
    # is non-root by design; UID matches upstream image USER directive).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      # YSG-SECRETS-DIST-002 CLOSED (Laura A1): langflow UID 1000 is the sole
      # remaining GID 2002 consumer on Compose path (reads bearer as group).
      # In K8s, bearer is delivered via secretKeyRef env var — supplementalGroups
      # is not functionally required here but retained for documentation parity.
      # All other services (postgres, redis, budget-redis, letta)
      # have had supplementalGroups: [2002] removed.
      supplementalGroups: [2002]
    containerSecurityContext:
      allowPrivilegeEscalation: false
      # MUST-6 fix (v2.24.1): readOnlyRootFilesystem: true — langflow write paths
      # handled via extraVolumeMounts below (parity with Compose read_only:true).
      # LANGFLOW_ALEMBIC_LOG_TO_STDOUT: "true" eliminates the alembic log write at
      # /app/.venv/.../langflow/alembic/alembic.log (redirects to stdout).
      # Remaining write paths covered by emptyDir mounts:
      #   /tmp       — Python runtime temp files (mode=1777, UID 1000 writes here)
      #   /app/data  — langflow mkdir at startup (ephemeral cache; not persisted)
      # /app/langflow — persistent volume (PVC), writable via named volume mount.
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    # Extra writable paths for langflow with readOnlyRootFilesystem:true.
    # Matches Compose tmpfs mounts (docker-compose.yml:1598-1599).
    extraVolumeMounts:
      - name: langflow-tmp
        mountPath: /tmp
      - name: langflow-appdata
        mountPath: /app/data
    extraVolumes:
      - name: langflow-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: langflow-appdata
        emptyDir:
          sizeLimit: 64Mi

  # Letta (formerly MemGPT) — Stateful agent with persistent memory (Apache 2.0)
  # https://github.com/letta-ai/letta
  # Agent with long-term memory, tool use, and conversation persistence.
  # Exposes REST API on port 8283. Uses shared Postgres (separate `letta` DB).
  # Dependency: Postgres must be available and the `letta` database must exist.
  # The install.sh installer creates the `letta` database and yashigani_app role
  # idempotently (v4.1 F-B fix). For K8s deployments a pre-install Job or manual
  # init is still required: `CREATE ROLE yashigani_app LOGIN; CREATE DATABASE letta
  # OWNER yashigani_app; GRANT ALL ON SCHEMA public TO yashigani_app;`
  #
  # DEFAULT: enabled=true (v4.1 — first-class Yashigani UX).
  # Operators who do not want letta should set enabled=false explicitly.
  letta:
    enabled: true
    image:
      # Pinned to 0.16.7 to match docker-compose.yml.
      # INDEX digest verified 2026-05-13 — multi-arch (linux/amd64 + linux/arm64).
      repository: docker.io/letta/letta
      tag: "0.16.7@sha256:fb7bd2c94a8bb7badbcfdb78a334abe3c1a75b5ea59e177aeba2e6356f54f92c"
      pullPolicy: IfNotPresent
    replicaCount: 1
    env:
      # v4.1 three-agent wrap (2026-07-07): ALL LLM calls dial letta's
      # egress-forwarder Service (templates/egress-forwarders.yaml, rendered
      # from the values-letta-egress.yaml overlay — install.sh layers it
      # whenever this bundle is enabled via --agent-bundles). The forwarder
      # holds the letta SVID and presents the leaf to
      # yashigani-caddy:18790/llm → /egress/eval → /deliver/llm →
      # yashigani-gateway:8081/v1 (same surface as before, governance in
      # front). Bearer via secretKeyRef STAYS (pin-AND-grant overlap).
      OPENAI_API_BASE: "http://yashigani-egress-letta:9400/llm/v1"
      # OPENAI_API_KEY is injected via secretKeyRef (internalBearer Secret) in
      # agent-bundles.yaml — do NOT set it here (Captain Bucket-C fix).
      LETTA_LLM_MODEL: "qwen2.5:3b"
      LETTA_EMBEDDING_MODEL: "qwen2.5:3b"
    # ORCH-PHASE2-REDIS (K8s parity with the docker-compose letta entrypoint):
    # pre-launch letta's bundled redis on the writable /root/.letta PVC with
    # bgsave-errors non-fatal, then run the normal startup.sh. Without this, the
    # default redis dir (/app) is read-only under readOnlyRootFilesystem:true →
    # bgsave fails → writes disabled → 500 on every messages call → the
    # letta-as-orchestrating-brain (Design A) path cannot take a turn.
    command: ["/bin/sh", "-c"]
    args:
      - 'mkdir -p /root/.letta/redis && redis-server --daemonize yes --bind 127.0.0.1 --dir /root/.letta/redis --stop-writes-on-bgsave-error no && export LETTA_REDIS_HOST=localhost && export LETTA_REDIS_PORT=6379 && exec /app/letta/server/startup.sh'
    # Letta connects to Postgres via the letta-pgbouncer sidecar (pod loopback).
    # The URI is assembled from the postgres secret by agent-bundles.yaml:
    #   LETTA_PG_URI=postgresql://yashigani_app:<pw>@127.0.0.1:5432/letta
    # Secret must contain a `postgres_password` key (same secret as Yashigani core).
    # The sidecar pgbouncer dials yashigani-postgres:5432 over full mTLS using
    # letta-pgbouncer_client.crt (issued by mtls-bootstrap-job, UID 70:0400).
    dbPasswordSecretName: "yashigani-postgres-secrets"
    dbPasswordSecretKey: "postgres_password"
    service:
      port: 8283
      type: ClusterIP
    # YSG-RISK-005 #3av: requests = 50% of limit.
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    # Persistent volume for Letta agent memory store.
    persistence:
      enabled: true
      mountPath: /root/.letta
      size: 5Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    tokenSecretName: "yashigani-letta-token"
    tokenSecretKey: "token"
    # Letta image (0.16.7) runs as uid=0 (root). Upstream requires root for
    # /root/.letta persistence path. runAsNonRoot must be false for this bundle.
    # Compensating controls: seccomp RuntimeDefault, CAP_ALL dropped,
    # allowPrivilegeEscalation: false, network policy restricts egress to gateway
    # + pgbouncer only. Risk: YSG-RISK-005 (agent bundle third-party).
    # Re-evaluate if letta ships a non-root image variant.
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      # YSG-SECRETS-DIST-002 CLOSED: yashigani_internal_bearer delivered via
      # secretKeyRef env var in K8s. supplementalGroups: [2002] was vestigial.
      # Removed per Laura A1 amendment — GID 2002 narrowed to langflow-only on
      # Compose path; K8s never needed it.
      # YSG-RISK-121 CLOSED: fsGroup: 70 — mirrors the working yashigani-pgbouncer
      # pod pattern (pgbouncer.yaml podSecurityContext). This pod is mixed-UID:
      # the letta app container runs runAsUser:0 (root — unaffected by fsGroup,
      # root reads regardless of file ownership), while the letta-pgbouncer
      # sidecar runs runAsUser/Group:70. Without fsGroup, the letta-pgbouncer-pki
      # Secret volume below is owned root:root and the non-root sidecar gets
      # EACCES ("failed to load certificate file ... (null)") trying to read
      # its own leaf. fsGroup:70 makes K8s own the Secret volume files as
      # group 70, matching the sidecar's runAsGroup so it can read (with
      # defaultMode 0440 below). Scoped to this bundle's pod only — does NOT
      # touch the CA-material posture (YSG-RISK-120): CA private keys are
      # never mounted here, the letta-pgbouncer-pki mount stays readOnly:true,
      # and this only widens group-read on the leaf/trust-anchor files this
      # pod already legitimately receives.
      fsGroup: 70
    containerSecurityContext:
      allowPrivilegeEscalation: false
      # readOnlyRootFilesystem: true — restored (was incorrectly false since v2.23.x).
      # letta 0.16.7 write paths handled via extraVolumeMounts below:
      #   /app/openapi_letta.json  — emptyDir (app.py:162 writes openapi schema at startup)
      #   /root/nltk_data          — emptyDir (lifespan NLTK punkt_tab fallback download)
      # All other writes go to /root/.letta (PVC) or /tmp (tmpfs via emptyDir medium:Memory).
      # Detection-lane parity finding 2026-05-20: readOnlyRootFilesystem:false was never
      # correct — set since agent-bundles.yaml introduction, missed by Lu/Iris/Laura across
      # multiple releases. Closed as part of letta read_only:true security debt closure.
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    # NEW-K8S-LETTA-OPENAPI-SUBPATH-DIR-001 (found live during 4.1.2 k3s/Cilium
    # e2e via Laura, 2026-07-28): letta CrashLoopBackOff — IsADirectoryError
    # writing openapi_letta.json (app.py:162 writes this file RELATIVE to CWD
    # /app at module import). Root cause: subPath mounts a path from an
    # emptyDir that does NOT already contain that path as a real file — this
    # is a well-known kubelet gotcha: when a subPath target does not already
    # exist in the source volume, kubelet creates the MISSING path as a
    # DIRECTORY (not a file), then bind-mounts that directory onto the
    # intended file path in the container. So /app/openapi_letta.json became
    # a directory, and Python's open(..., "w") raised IsADirectoryError.
    # Fix: pre-seed the file into the SAME `letta-runtime` emptyDir via an
    # initContainer that mounts the volume's ROOT (not via subPath) and
    # `touch`es the file BEFORE the main container's subPath mount resolves
    # — kubelet then correctly bind-mounts an existing FILE. Standard,
    # documented K8s workaround for this exact class of gotcha.
    extraInitContainers:
      - name: pre-touch-letta-openapi-file
        image: "docker.io/library/busybox:1.37"
        imagePullPolicy: IfNotPresent
        # NEW-K8S-LETTA-OPENAPI-SUBPATH-DIR-001 follow-up (found live during
        # the SAME 4.1.2 k3s/Cilium e2e, immediately after the directory-vs-
        # file fix above went live): fixing the directory-vs-file problem
        # surfaced a SECOND, distinct error on the very next attempt:
        # "PermissionError: [Errno 13] Permission denied: 'openapi_letta.json'".
        # Root cause: letta's main container drops ALL capabilities
        # (containerSecurityContext capabilities.drop: [ALL]), which
        # includes CAP_DAC_OVERRIDE — the capability root normally uses to
        # bypass file permission checks. Without it, letta's root (UID 0)
        # process is subject to normal Unix permission bits like any other
        # user. touch'ing the file as this initContainer's own UID 65534
        # left it owned nobody:nogroup with the default umask (0644, no
        # write for anyone but the owner) — root (UID 0, no DAC_OVERRIDE)
        # cannot open it for writing. Fix: chmod the touched file to 0666
        # (world-writable) so any UID, including capability-stripped root,
        # can write it. Safe: this is a non-sensitive OpenAPI schema JSON
        # file letta itself fully overwrites at every startup — no
        # confidentiality/integrity concern from the permissive mode.
        command: ["/bin/sh", "-c", "touch /letta-runtime-init/openapi_letta.json && chmod 0666 /letta-runtime-init/openapi_letta.json"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: letta-runtime
            mountPath: /letta-runtime-init
    # Extra volumes for letta write paths that cannot go to the persistent /root/.letta PVC.
    extraVolumeMounts:
      # letta app.py:162 writes openapi_letta.json relative to CWD (/app) at module import.
      # emptyDir provides a writable inode at /app/openapi_letta.json without opening the
      # rest of /app. subPath mounts the single file path only. The file is pre-created by
      # the pre-touch-letta-openapi-file initContainer above (see that entry's comment for
      # why — subPath-of-a-not-yet-existing-path silently becomes a directory otherwise).
      - name: letta-runtime
        mountPath: /app/openapi_letta.json
        subPath: openapi_letta.json
      # NLTK punkt_tab download in lifespan (fallback — not pre-baked in Docker image).
      # Silently fails without a writable path; emptyDir here avoids the silent failure.
      - name: letta-nltk
        mountPath: /root/nltk_data
      # /tmp for Python runtime temp files.
      - name: letta-tmp
        mountPath: /tmp
    extraVolumes:
      - name: letta-runtime
        emptyDir: {}
      - name: letta-nltk
        emptyDir: {}
      - name: letta-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      # PKI secrets volume — provides ca_root.crt + letta-pgbouncer_client.crt/key
      # to the letta-pgbouncer sidecar for mTLS toward postgres.
      # auth_type=plain: no pgbouncer_userlist Secret needed (YSG-RISK-049 revert).
      #
      # YSG-RISK-053 (K8s parity with compose fix f7d792d5): items: scoping —
      # WITHOUT items: this pod (letta app container included — volumes are
      # pod-scoped) could read every service's leaf key, all bootstrap tokens
      # and caddy_internal_hmac (the Layer-B forgery secret) from the flat
      # Secret. Exactly the 3 files pgbouncer-letta.ini references
      # (server_tls_ca_file=/run/secrets/ca_root.crt + the sidecar's own leaf)
      # are projected. Note: the sidecar's trust anchor is ca_root.crt, NOT
      # ca_bundle.crt — see files/pgbouncer-letta.ini:138.
      - name: letta-pgbouncer-pki
        secret:
          secretName: "yashigani-pki-certs"
          # YSG-RISK-121 CLOSED: 0400 (owner-only) → 0440 (owner+group read),
          # matching the main yashigani-pgbouncer pki-certs volume exactly
          # (pgbouncer.yaml). Paired with fsGroup:70 above, this lets the
          # runAsUser/Group:70 letta-pgbouncer sidecar read its own leaf.
          # Mount stays readOnly:true; no write access is granted; no CA
          # private key material is projected here (items: below is unchanged).
          defaultMode: 0440
          items:
            - key: letta-pgbouncer_client.crt
              path: letta-pgbouncer_client.crt
            - key: letta-pgbouncer_client.key
              path: letta-pgbouncer_client.key
            - key: ca_root.crt
              path: ca_root.crt
      # letta-pgbouncer-ini — ConfigMap with pgbouncer-letta.ini content.
      # Mounted at /etc/pgbouncer/pgbouncer.ini:ro inside the sidecar.
      # ConfigMap is generated by the Helm chart from docker/pgbouncer/pgbouncer-letta.ini.
      # BUG-WAVE5-002 fix: values.yaml is NOT a Go template — {{ include }} is
      # evaluated literally, not rendered. Hardcoded to the resolved name.
      - name: letta-pgbouncer-ini
        configMap:
          name: "yashigani-letta-pgbouncer-ini"
          defaultMode: 0444
    # letta-pgbouncer sidecar — pgbouncer session-mode proxy for letta→postgres mTLS.
    # YSG-RISK-048 CLOSED 2026-05-20 — replaces stunnel+socat sidecar (e694127).
    # Iris design doc: iris-letta-postgres-mtls-design-review.md (Option 1, 33/35).
    # Laura threat model: laura-pgbouncer-letta-threat-model.md (F1–F4 all fixed).
    #
    # letta connects to 127.0.0.1:5432 (pod loopback — pod network namespace shared
    # between all containers in the pod). pgbouncer sidecar dials yashigani-postgres:5432
    # over full mTLS presenting letta-pgbouncer_client.crt (UID 70:0400, no C4 violation).
    # session mode required for alembic DDL advisory locks.
    #
    # Multi-arch: edoburu/pgbouncer:v1.25.1-p0 publishes arm64+amd64. No buildx required.
    # Same image as existing yashigani-pgbouncer Deployment. No new registry dependency.
    extraContainers:
      - name: letta-pgbouncer
        image: "docker.io/edoburu/pgbouncer:v1.25.1-p0@sha256:4a8371e79d6627e74f553d0aaa8e4c5ace20e30034fb296e569b71c89c99e108"
        imagePullPolicy: IfNotPresent
        securityContext:
          # pgbouncer runs as UID 70 (edoburu image USER pgbouncer). runAsNonRoot:true
          # is correct and is an improvement over the stunnel sidecar (runAsNonRoot:false).
          # Laura threat model §5: this is a security improvement over stunnel.
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          allowPrivilegeEscalation: false
          # readOnlyRootFilesystem: pgbouncer entrypoint writes userlist.txt at startup.
          # Same documented exception as the existing pgbouncer Deployment (pgbouncer.yaml).
          # Compensating controls: cap_drop ALL + no-new-privileges + runAsUser:70.
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        # exec-chain fix (9b9d2b8): pass pgbouncer.ini explicitly to edoburu entrypoint.
        # auth_type=plain (YSG-RISK-049 ACCEPTED-LOW non-KMS-only — Tiago directive 2026-05-21).
        # edoburu entrypoint writes cleartext userlist.txt from DATABASE_URL at startup.
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            exec /entrypoint.sh pgbouncer /etc/pgbouncer/pgbouncer.ini
        env:
          # edoburu image uses DATABASE_URL to populate [databases] section at container start.
          # LETTA_PG_PASSWORD declared first — K8s $(VAR) forward-ref constraint.
          - name: LETTA_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "yashigani-postgres-secrets"
                key: "postgres_password"
          - name: DATABASE_URL
            value: "postgresql://yashigani_app:$(LETTA_PG_PASSWORD)@yashigani-postgres:5432/letta"
          - name: AUTH_TYPE
            value: "plain"
          - name: POOL_MODE
            value: "session"
          - name: MAX_CLIENT_CONN
            value: "50"
          - name: DEFAULT_POOL_SIZE
            value: "20"
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
          # pgbouncer-letta.ini — session mode config with server_tls_sslmode=verify-full.
          - name: letta-pgbouncer-ini
            mountPath: /etc/pgbouncer/pgbouncer.ini
            subPath: pgbouncer-letta.ini
            readOnly: true
          # PKI secrets — ca_root.crt + letta-pgbouncer_client.crt/key for mTLS to postgres.
          - name: letta-pgbouncer-pki
            mountPath: /run/secrets
            readOnly: true

  # filesystem-mcp — Shape-C MCP server bundle (codegen-emitted; placeholder here for
  # label verification only).  Real values are emitted by _gen_values_yaml_shape_c()
  # at agent-onboard time.  shape: "c" causes agent-bundles.yaml to emit the
  # yashigani.io/shape=c pod label that networkpolicy.yaml gateway-egress rule selects on.
  filesystemMcp:
    enabled: false
    shape: "c"
    image:
      # Placeholder — replaced by codegen with the pinned digest at onboard time.
      repository: ghcr.io/agnosticsec/filesystem-mcp
      tag: "not-yet-available"
      pullPolicy: IfNotPresent
    replicaCount: 1
    env: {}
    service:
      port: 8000
      type: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    # Shape-C bundles run as non-root, read-only rootfs, all caps dropped.
    # No persistence — MCP servers are stateless (workspace is a bind-mount volume).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

# ---------------------------------------------------------------------------
# Open WebUI — REMOVED in 4.0 (YSG-RISK-142). ui4, Yashigani's first-party
# Lit-based chat/agents/builder/workflows SPA, is served directly by the
# backoffice and replaces it. The helm/yashigani/templates/open-webui.yaml
# Deployment/Service/PVC template, the openWebui-gated blocks in
# secrets.yaml/networkpolicy.yaml/ollama.yaml, and this values block were all
# removed together on 2026-07-28. Do not reintroduce without a design review —
# see the risk register entry for what depended on it and why it was cut.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Budget Redis — dedicated Redis for token budget counters (v1.0)
# Separate from main Redis; maxmemory-policy noeviction required.
# ---------------------------------------------------------------------------
budgetRedis:
  enabled: true
  image:
    repository: redis
    tag: "7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # YSG-RISK-005 #3av: requests = 50% of limit.
  resources:
    requests:
      cpu: "125m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  service:
    port: 6379
    type: ClusterIP
  existingSecretName: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# ---------------------------------------------------------------------------
# Wazuh SIEM integration (B11 fix — DRIFT-001 / Lu A.8.15/A.8.16)
# ---------------------------------------------------------------------------
# Compose ships a 3-container Wazuh stack (manager, indexer, dashboard).
# Kubernetes does NOT support Wazuh in this chart version — no Helm templates
# exist for Wazuh resources. Setting wazuh.enabled=true has NO effect; it is
# retained as an explicit operator-visible declaration so that:
#   1. The operator knows Wazuh is NOT running (vs. silently absent).
#   2. The backoffice UI "Wazuh: active" status can be gated on this value in
#      a future release to prevent misleading the operator.
#   3. Auditors reviewing chart values find an explicit NOT-SUPPORTED declaration
#      rather than inference-by-absence (ISO 27001 A.8.15/A.8.16 audit trail).
#
# If you need SIEM on Kubernetes, use an external Wazuh deployment and
# configure the agents to forward logs externally. This is tracked as a
# future K8s integration item.
#
# AUDIT NOTE: Any compliance control that lists "Wazuh SIEM" as implemented
# MUST reference a running external Wazuh cluster, NOT this chart value.
# The compose-side Wazuh stack is a Docker/Podman deployment concern only.
wazuh:
  enabled: false  # NOT SUPPORTED on Kubernetes in this chart version.

# ---------------------------------------------------------------------------
# PostgreSQL 16 — primary durable store
#
# FINDING-V412-K8S-PG-SSL (Captain, 2026-07-24): the default postgres:16-alpine
# image has NO openssl CLI, so files/postgres-05-enable-ssl.sh's fail-closed
# chain-of-continuity check (FINDING-LAURA-V412-PKI-PIN) aborts with "openssl
# not found" — ssl=on never gets written, gateway/backoffice sslmode=verify-ca
# then hit "server does not support SSL" and CrashLoop. Standardised on the
# SAME pgvector/pgvector:0.8.2-pg16 image already used by
# docker-compose.yml/docker/docker-compose.release.yml (Debian bookworm base,
# HAS /usr/bin/openssl) for full runtime parity across compose and K8s. This
# image's postgres user is UID/GID 999 (Debian convention, NOT Alpine's 70) —
# templates/postgres.yaml securityContext.runAsUser/runAsGroup/fsGroup are set
# to 999 to match (see that file's comment for the chown-EPERM history this
# fixes). Digest verified live via `docker buildx imagetools inspect` 2026-07-24
# (the tag has been republished since compose's original pin — the digest here
# is the current, live-verified one, not carried over stale).
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: docker.io/pgvector/pgvector
    tag: "0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # YSG-RISK-005 #3av: requests = 50% of limit.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  service:
    port: 5432
    type: ClusterIP
  existingSecretName: ""
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

# ---------------------------------------------------------------------------
# PgBouncer — connection pooler
# ---------------------------------------------------------------------------
pgbouncer:
  enabled: true
  image:
    repository: edoburu/pgbouncer
    tag: "v1.25.1-p0@sha256:4a8371e79d6627e74f553d0aaa8e4c5ace20e30034fb296e569b71c89c99e108"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # YSG-RISK-005 #3av: requests = 50% of limit.
  resources:
    requests:
      cpu: "125m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  service:
    port: 5432
    type: ClusterIP
  env:
    poolMode: transaction
    maxClientConn: "100"
    defaultPoolSize: "20"
  # ---------------------------------------------------------------------------
  # YSG-RISK-049 CLOSED v2.24.0 — auth_query credential (Amendments A2+C6)
  # ---------------------------------------------------------------------------
  # authSecretName: Name of the K8s Secret containing pgbouncer_authenticator_password.
  #   Default: "" (secrets.yaml auto-generates yashigani-pgbouncer-auth-secret).
  #   Override: set to an operator-provisioned or ExternalSecret-backed Secret name.
  #   The Secret MUST contain key: pgbouncer_authenticator_password
  #   Option C isolation: dedicated Secret, NOT merged into yashigani-postgres-secrets.
  #   See secrets.yaml comment block for full provisioning instructions.
  authSecretName: ""
  # authNetworkCidr REMOVED (YSG-RISK-218 close v2.24.0): the pg_hba A2 CIDR
  # carveout is gone. pgbouncer_authenticator now presents pgbouncer-auth_client.crt
  # (dedicated outbound cert); the catch-all hostssl rule applies uniformly.
  # No CIDR override is needed. See iris-v240-ysg-risk-050-cert-separation-design.md.

# ---------------------------------------------------------------------------
# Partition maintenance CronJob — DB partition pre-creation (runs monthly)
# ---------------------------------------------------------------------------
partitionCronjob:
  # YSG-RISK-005 #3av: requests = 50% of limit. Single-shot job, low resource.
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# ---------------------------------------------------------------------------
# v2.2 Feature Flags
# ---------------------------------------------------------------------------

# PII Detection — controls detection mode for request/response payloads.
# Modes: log (detect + record only), redact (inline replacement), block (drop payload).
# Requires license tier: pii_log (Community+), pii_redact (Pro+).
pii:
  enabled: false
  mode: "log"          # log | redact | block
  enabledTypes:        # PII categories to scan — leave empty to scan all
    - SSN
    - CREDIT_CARD
    - EMAIL
    - PHONE
    - IBAN
    - PASSPORT
    - NHS_NUMBER
    - DRIVERS_LICENCE
    - IP_ADDRESS
    - DATE_OF_BIRTH
  scanRequests: true
  scanResponses: true

# DDoS Protection — application-layer per-IP connection counting (v2.2).
# Backed by Redis (main redis DB 0, key namespace ddos:).
# fail-open: if Redis is unreachable, requests are allowed through.
ddosProtection:
  enabled: true
  maxConnectionsPerIp: 50
  windowSeconds: 60

# Response Inspection — run Ollama classifier over LLM responses (v0.9.0).
responseInspection:
  enabled: false

# SSO / Identity Provider configuration (v2.1 — OIDC; v2.23.4 — SAMLv2).
# Mirrors the YASHIGANI_IDP_<N>_* env vars used by docker-compose.
# Up to 10 IdPs may be configured. Secrets (clientSecret, samlSpPrivateKey)
# must be stored in a Kubernetes Secret and referenced via existingSecretName.
sso:
  twoFactorRequired: false
  # existingSecretName: yashigani-sso-secrets
  # The secret must contain keys idp_<n>_client_secret for OIDC IdPs,
  # and idp_<n>_saml_sp_private_key for SAML IdPs (RSA keys only —
  # non-RSA keys reject startup per YSG-RISK-044 mitigation).
  idps: []
  # OIDC example:
  # - id: "keycloak-dev"
  #   name: "Keycloak Dev"
  #   protocol: "oidc"
  #   discoveryUrl: "https://keycloak.example.com/realms/yashigani/.well-known/openid-configuration"
  #   clientId: "yashigani"
  #   clientSecretKey: "idp_1_client_secret"   # key inside existingSecretName
  #   emailDomains: "example.com"
  #   redirectUri: "https://yashigani.example.com/admin/sso/callback"
  #
  # SAMLv2 example (requires Professional tier or above):
  # - id: "entra-saml"
  #   name: "Entra ID (SAML)"
  #   protocol: "saml"
  #   entityId: "https://yashigani.example.com/saml"   # SP entity ID
  #   samlIdpSsoUrl: "https://login.microsoftonline.com/<tenant>/saml2"
  #   samlIdpSlsUrl: "https://login.microsoftonline.com/<tenant>/saml2"
  #   samlIdpX509Cert: "<base64-cert-body-no-headers>"
  #   samlSpSlsUrl: "https://yashigani.example.com/auth/sso/saml/entra-saml/sls"
  #   samlSpPrivateKeySecretKey: "idp_2_saml_sp_private_key"  # RSA key in existingSecretName
  #   samlSpCertSecretKey: "idp_2_saml_sp_cert"
  #   redirectUri: "https://yashigani.example.com/auth/sso/saml/entra-saml/acs"
  #   emailDomains: "example.com"

# Model Aliases — Redis-backed alias-to-model routing (v2.3 backoffice feature).
# Aliases are managed at runtime via the backoffice UI/API.
# Seed defaults may be provided here; they are applied on backoffice startup.
modelAliases:
  seedDefaults: true
  # defaults are defined in the DB migration (0005_identity_budget_routing.py)
  # Override or add custom aliases:
  # extra:
  #   - alias: "fast"
  #     provider: "local"
