# Yashigani v4.1.2 — Umbrella Chart Top-Level Values
# All sub-chart values are namespaced under their service name.
# Last updated: 2026-07-15 (v4.1.2: version bump — Deny/RBAC hardening + complete logout + podman 6.x)

global:
  # imageRegistry and imageOwner are used only for gateway / backoffice /
  # adminBootstrap (images you build from source). Leave both empty for
  # local Docker/Podman deployments where images are built by install.sh and
  # already present on the node. For K8s: set these to your private registry
  # and namespace, then push your locally-built images there before deploying.
  # Example: imageRegistry: "registry.example.com", imageOwner: "myorg"
  # Agnostic Security does not host or distribute these images.
  imageRegistry: ""
  imageOwner: ""
  # REQUIRED: Replace with your actual domain before deployment
  tlsDomain: "yashigani.example.com"
  # tlsMode: caddy | nginx (cert-manager + nginx-ingress)
  tlsMode: "caddy"
  certManagerIssuer: "letsencrypt-prod"
  acmeEmail: "admin@example.com"
  environment: "production"
  useExternalSecrets: false
  # MI-6 (multi-instance / YSG-RISK-061): per-instance SPIFFE trust-domain
  # authority. On K8s the tenancy boundary is the namespace/release, so a
  # second instance is a separate namespace + a distinct trust domain (e.g.
  # "apac.yashigani.internal"). Set this per release so a sibling instance's
  # SPIFFE identity does not validate. Leave at the default for a single
  # instance — preserves "yashigani.internal" byte-for-byte (no rotation).
  spiffeTrustDomain: "yashigani.internal"

  keda:
    enabled: true

  topologySpread:
    enabled: true
    policy: DoNotSchedule
    maxSkew: 1

  pdb:
    enabled: true

# ---------------------------------------------------------------------------
# Internal mTLS (v2.23.1) — core-plane mutual TLS between gateway, backoffice,
# postgres, pgbouncer, redis, budget-redis.
#
# On install/upgrade a Helm pre-install hook Job boots the two-tier PKI
# (root → intermediate → per-service leaves) using the gateway image's
# `python -m yashigani.pki.issuer` CLI, then writes the resulting certs and
# trust bundle into a namespace-scoped Secret (yashigani-pki-certs).
# Core-plane pods mount it at /run/secrets via per-pod Secret-volume `items:`
# projections (YSG-RISK-053): each pod sees ONLY its own leaf + bootstrap
# token + the trust anchors it verifies with — never another service's
# private key and never caddy_internal_hmac.
#
# A CronJob rotates leaf certs weekly (default Sun 02:00). Pods pick up
# the new cert on the next roll/restart — no in-place reload in v2.23.1.
#
# OPA (policy) now serves mTLS; mtls_capable:true in the manifest (v2.23.2).
# All callers updated to use internal_httpx_client (EX-231-01 closed).
#
# UPGRADE NOTE — plaintext → mTLS on an existing PVC:
# The postgres init script (05-enable-ssl.sh) only runs on a fresh initdb.
# If you are upgrading a running release whose postgres PVC is non-empty,
# after the upgrade:
#   1) kubectl exec into the postgres pod,
#   2) append the hostssl rules to $PGDATA/pg_hba.conf by hand (the script
#      is available at /docker-entrypoint-initdb.d/05-enable-ssl.sh as a
#      reference),
#   3) psql --host /var/run/postgresql -c "SELECT pg_reload_conf();"
# Alternatively: uninstall the release + delete the PVC + fresh install.
# Automated in-place migration for existing data is tracked as task #54.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Network Policies (EX-231-10 — Caddy-centric isolation)
# ---------------------------------------------------------------------------
# When enabled (default), the chart renders NetworkPolicy resources that
# enforce the Caddy-sole-ingress posture: backoffice and gateway only accept
# connections from yashigani-caddy pods. Prometheus scrapes go through Caddy's
# SPIFFE-gated listeners (:8444/:8445) only.
#
# Set to false ONLY in CNI environments that do not support NetworkPolicy
# (e.g. plain kind without Calico/Cilium, or specific managed K8s tiers).
# In that case you accept that the Caddy-centric isolation control is
# network-layer absent; application-layer mTLS + SPIFFE gate remain active.
# Document any disablement in the risk register with maintainer sign-off.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# DNS (FINDING-V412-DNS-001 / IRIS-CIL-001): allow-dns-egress scopes :53 egress
# to the cluster DNS pod only (closes the open DNS-exfil channel). These
# selectors default to CoreDNS on k3s/kubeadm; OVERRIDE if your distro labels
# CoreDNS differently — otherwise pod DNS resolution is blocked.
# ---------------------------------------------------------------------------
dns:
  corednsNamespace: kube-system
  corednsPodLabels:
    k8s-app: kube-dns

networkPolicies:
  enabled: true
  # FINDING-V412-UNIVERSAL-004: NetworkPolicy enforcement is CNI-dependent —
  # Calico/Cilium enforce at the datapath; flannel (k3s default) and kindnet
  # (kind default) silently NO-OP NetworkPolicy, so a green `helm install` could
  # ship with NO ring-fence (egress bypassing Caddy->OPA), making Enterprise/k8s
  # weaker than Professional/compose. Enforcement is VERIFIED by the INSTALLER,
  # not by a chart value (a chart cannot probe the datapath): install.sh runs a
  # positive enforcement probe (throwaway ns + default-deny + allow->deny->allow
  # reachability test) and FAILS the k8s install if the CNI does not enforce.
  # Override only with risk-register sign-off:
  #   install.sh --skip-networkpolicy-probe   (or NETPOL_REQUIRE_ENFORCEMENT=false)

# ---------------------------------------------------------------------------
# Admission Control (YSG-RISK-008 — v2.23.2 P1)
# ---------------------------------------------------------------------------
# When enabled, the chart renders Kyverno ClusterPolicy resources that REJECT
# pods missing the YSG-RISK-008 container hardening baseline:
#   - runAsNonRoot: true (pod or container level)
#   - allowPrivilegeEscalation: false (every container)
#   - seccompProfile.type: RuntimeDefault (pod level)
#   - capabilities.drop: [ALL] (every container)
#   - No runAsUser: 0 (except documented exceptions)
#
# Set to true only AFTER installing Kyverno cluster-wide
# (`helm install kyverno kyverno/kyverno -n kyverno --create-namespace`).
# The chart does not bundle Kyverno.
#
# In CNI environments or clusters without Kyverno the ClusterPolicy CRD will
# not be present and helm install/upgrade will fail with an opaque API-server
# error. Leaving this false means application-layer mTLS + SPIFFE gate remain
# active; document any disablement in the risk register with maintainer
# sign-off, referencing YSG-RISK-008.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Image policy (A6 — Captain MEDIUM + Nico N-003)
# ---------------------------------------------------------------------------
# Yashigani-owned images (gateway, backoffice, caddy) are tag-only by default.
# Production deployments SHOULD pin to @sha256: digests for supply-chain
# attestation. The attestation workflow:
#   1. Build images: install.sh builds yashigani-gateway + yashigani-backoffice
#      from source and tags them with the release version.
#   2. Inspect digest: `docker inspect --format='{{index .RepoDigests 0}}' <image>`
#      or `docker images --digests <image>`.
#   3. Set in values: gateway.image.tag="2.25.0@sha256:<digest>" etc.
#
# requireImageDigests: when true, helm template/install/upgrade fails if any
# Yashigani-owned image tag does not contain @sha256:. Enforce post-build.
# Default: false — operators must opt in after running their own image build.
imagePolicy:
  requireImageDigests: false

# ---------------------------------------------------------------------------
# LIC-002 SECURITY NOTICE — YASHIGANI_LICENSE_TIER is NOT an operator-settable
# value and MUST NOT appear anywhere in this values file, in extraEnv blocks,
# or in any Kubernetes Secret/ConfigMap managed by this chart. Setting it via
# the environment bypasses the signed-license enforcement path and lets any
# operator claim any tier without a valid license token.
#
# There is intentionally NO extraEnv escape hatch in this chart. If you are
# adding a new env var to the gateway or backoffice, add it as a first-class
# chart value with a named field — never via an open-ended extraEnv list.
#
# If you see YASHIGANI_LICENSE_TIER in any manifest or values file, treat that
# as a HIGH-severity finding and remove it before deploying.
# ---------------------------------------------------------------------------
admissionPolicies:
  enabled: false
  # Kyverno policy action: Enforce (hard reject) or Audit (log only).
  # Must be Enforce in production. Audit only during rollout evaluation.
  validationFailureAction: Enforce

# ---------------------------------------------------------------------------
# Multi-Tenant / Cilium additive layer (Enterprise install profile)
# ---------------------------------------------------------------------------
# tom-chart.md (2026-07-19 REISSUED verdict) + yashigani-k8s-dns-hardening-
# design-20260719.md. ADDITIVE ONLY — the 45-resource standard NetworkPolicy
# baseline (networkpolicy.yaml) remains the CNI-portable source of truth for
# the intra-tenant-stack ring-fence, unchanged, on every profile. This block
# gates a SEPARATE Cilium-only layer:
#   - CiliumClusterwideNetworkPolicy cross-tenant default-deny
#     (templates/cilium-clusterwide-networkpolicy.yaml)
#   - 3 targeted CiliumNetworkPolicy toFQDNs egress rules narrowing the
#     ollama-registry / Caddy-ACME / openclaw-Slack-Telegram ipBlock-CIDR-
#     guess gaps already flagged inline in networkpolicy.yaml /
#     networkpolicy-caddy-egress.yaml (templates/cilium-networkpolicy-fqdn.yaml)
#
# DEFAULT: OFF on every profile shipped by this chart today. Per the reissued
# verdict this is intended to be DEFAULT-ON for the Enterprise/shared-cluster
# multi-tenant install profile specifically (NOT Professional Plus, which is
# namespace-per-release with no cross-tenant boundary to protect and stays
# CNI-portable on Calico or any enforcing CNI). This chart does not yet
# encode a Professional-Plus/Enterprise profile switch — flagged for
# Maxine/Iris: an Enterprise values overlay (e.g. values-enterprise.yaml, not
# present in this chart today) must set multiTenant.enabled=true AND
# multiTenant.cilium.enabled=true; Professional Plus installs leave both false
# (this file's defaults) and render byte-identical to today.
#
# HARD DEPENDENCY when enabled: Cilium must be installed cluster-wide BEFORE
# helm install/upgrade (CiliumClusterwideNetworkPolicy + CiliumNetworkPolicy
# CRDs). Both new templates fail closed with a remediation message if the CRD
# is absent — same pattern as admissionPolicies' Kyverno guard.
multiTenant:
  enabled: false
  # Namespace-boundary label KEY. install.sh's k8s_helm_install() namespace
  # pre-creation step is the LOAD-BEARING side of this contract — it must
  # stamp this label onto the Namespace (value = tenantId below) BEFORE helm
  # install runs, or the tenant boundary this block documents has no
  # namespace-level record. This chart's own Cilium templates do NOT depend
  # on that stamp today (they key on the reserved namespace-NAME identity
  # instead — see cilium-clusterwide-networkpolicy.yaml's "MECHANISM NOTE");
  # the namespace label is still required for discoverability/audit and any
  # future namespace-label-based selector. Su's lane, not this chart —
  # flagged as a cross-team dependency (tom-chart.md item 5).
  tenantLabel: "yashigani.io/tenant"
  # This release's tenant identifier. REQUIRED (fail-closed in
  # cilium-clusterwide-networkpolicy.yaml) when multiTenant.enabled=true.
  # Distinct from agentBundles/agentIngressFronts tenantId (an
  # agent-upstream routing key, not a k8s isolation boundary —
  # tom-chart.md grounding).
  tenantId: ""
  cilium:
    enabled: false
    # Namespaces (beyond this release's own namespace + kube-system, which
    # are always implicitly allowed by the cross-tenant CCNP for DNS) that
    # cross-tenant traffic is permitted to/from — e.g. a shared ingress-nginx
    # namespace (auto-added when global.tlsMode=nginx) or cert-manager.
    # Empty by default; operators on a shared platform-services cluster with
    # additional platform namespaces must add them here — this chart does
    # not guess a cluster's platform-namespace layout.
    additionalAllowedNamespaces: []

mtls:
  # Hard-off switch. When false the chart renders the pre-v2.23.1 plaintext
  # topology (no PKI job, no cert mounts). Intended for deliberate testing
  # only — production deployments MUST keep this enabled.
  enabled: true

  # Image used by the applier container that materialises the Secret from
  # the issuer output. alpine/k8s ships kubectl + sh in a single image —
  # necessary because we shell-wrap the apply pipeline. registry.k8s.io/
  # kubectl is distroless (no sh) and therefore won't work here. Override
  # to your internal mirror if air-gapped.
  kubectlImage:
    repository: "alpine/k8s"
    tag: "1.29.15@sha256:82171c2a1b3412fc0450ff347f11451294f917122c7f49a63d77f3499a068f11"
    pullPolicy: IfNotPresent

  # Two-tier PKI lifetime policy. Must sit inside the bounds declared in
  # docker/service_identities.yaml cert_policy.* — the issuer enforces them.
  rootLifetimeYears: 10
  intermediateLifetimeDays: 180
  leafLifetimeDays: 90

  # Weekly rotation of leaf certs. Keeps every service <7 days away from a
  # fresh cert; aligns with PCI DSS 4.0 4.2.1.1 guidance. Cron in UTC.
  rotation:
    enabled: true
    schedule: "0 2 * * 0"
    # Keep the last N rotation CronJob runs in history for audit trail.
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Backoff before the rotation CronJob gives up on a failing run.
    backoffLimit: 2

  # Name of the leaves-Secret the bootstrap job writes into. Core-plane
  # Deployments/StatefulSets mount this at /run/secrets — since YSG-RISK-053
  # each mount carries an `items:` projection so a pod only receives its own
  # leaf/token + trust anchors (mirrors the compose-side scoped-secrets fix
  # f7d792d5). After retro #3aj this Secret contains LEAF material only:
  #   * <service>_client.crt + <service>_client.key (the per-service leaves)
  #   * ca_root.crt + ca_intermediate.crt (public certs — workloads use intermediate only, Pattern B)
  #   * caddy_internal_hmac (EX-231-10 Layer B) — per-install shared secret
  #     injected by Caddy as X-Caddy-Verified-Secret on every upstream proxy.
  #     backoffice and gateway verify it via the gateway/backoffice middleware. The bootstrap Job
  #     generates it fresh on install; on upgrade it reuses the existing value
  #     from the Secret (idempotent) so a live stack isn't disrupted mid-apply.
  # It deliberately does NOT contain the CA private keys — those live in
  # caKeysSecretName below and are mounted only by the bootstrap Job and
  # rotation CronJob. Name retained as `yashigani-pki-certs` for upgrade
  # compatibility (the bootstrap-job applier rewrites the contents in place).
  # Do NOT set existingSecretName unless you're running the issuer
  # out-of-band and materialising the Secret yourself.
  secretName: "yashigani-pki-certs"
  existingSecretName: ""

  # Retro #3aj — separate Secret for the CA private keys (root + intermediate).
  # Mounted ONLY by the PKI bootstrap Job and rotation CronJob; workload pods
  # never see ca_root.key or ca_intermediate.key. RBAC restricts mutation of
  # this Secret to the yashigani-pki ServiceAccount used by those Jobs only.
  caKeysSecretName: "yashigani-pki-ca-keys"

  # Bootstrap job resources — small, single-shot, short-lived.
  bootstrapResources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Admin Bootstrap (retro #3ap) — primary + backup admin + dual TOTP.
#
# Mirrors install.sh _gen_admin_credentials in compose: produces admin1 and
# admin2 usernames, passwords, and TOTP secrets, and stores them in a Secret
# that the backoffice mounts into /run/secrets. This is the K8s parity for
# the project's two-admin bootstrap policy — every install must yield TWO
# admin accounts with TOTP pre-provisioned, never a single-admin install.
#
# Disable ONLY if you intend to seed admins out-of-band by pre-creating
# `existingSecretName` with the same key schema (admin1_username,
# admin1_initial_password, admin1_totp_secret, admin2_username,
# admin2_password, admin2_totp_secret).
# ---------------------------------------------------------------------------
adminBootstrap:
  enabled: true
  # Name of the Secret the bootstrap Job writes into and the backoffice
  # mounts at /run/secrets (alongside the PKI leaves).
  secretName: "yashigani-admin-bootstrap"
  # Skip the chart-managed Job and use a Secret you have pre-created out of
  # band. Must contain the six keys listed above.
  existingSecretName: ""
  # Image used to mint passwords + TOTP secrets. The gateway image already
  # bundles python3 + pyotp + secrets which is everything we need; reusing
  # it avoids another image pull.
  image:
    # Built locally by install.sh from the v2.24.0 tagged source.
    # For K8s deployments: push to your own private registry and update
    # the repository field accordingly. Pin your post-build digest with
    # `@sha256:<digest>` for supply-chain attestation (recommended).
    repository: yashigani-gateway
    tag: "4.1.2"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ---------------------------------------------------------------------------
# Internal Bearer Token (Captain Bucket-C — per-install, rotatable secret)
# ---------------------------------------------------------------------------
# YASHIGANI_INTERNAL_BEARER is the shared token agent bundles (langflow,
# letta) present as the OpenAI `Authorization: Bearer <token>` when
# calling gateway:8081/v1. The gateway's AgentAuthMiddleware validates it at
# the app layer. Previously hardcoded to "yashigani-internal"; now per-install.
#
# Fail-closed: if internalBearer.value is empty AND no existingSecretName is
# set, helm template/install/upgrade will fail (see validate-security.yaml).
# Generate with: openssl rand -hex 32
#
# Upgrade-safe: the auto-generated Secret uses helm lookup so the value is
# preserved on `helm upgrade` and only generated fresh on first install.
internalBearer:
  # Set a non-empty value here, or leave empty to auto-generate on first install.
  # In production: pass via --set internalBearer.value="$(openssl rand -hex 32)"
  # or supply an existingSecretName with key `yashigani_internal_bearer`.
  value: ""
  # Optionally point to a pre-created K8s Secret (key: yashigani_internal_bearer).
  existingSecretName: ""

# ---------------------------------------------------------------------------
# Gateway — MCP reverse proxy (data plane)
# ---------------------------------------------------------------------------
gateway:
  enabled: true
  image:
    # Built locally by install.sh from the v2.24.0 tagged source.
    # For K8s deployments: push to your own private registry and update
    # the repository field accordingly. Pin your post-build digest with
    # `@sha256:<digest>` for supply-chain attestation (recommended).
    repository: yashigani-gateway
    tag: "4.1.2"
    pullPolicy: IfNotPresent
  replicaCount: 2
  # YSG-RISK-005 #3av: requests = 50% of limit (scheduler sizing).
  # Limits match compose sizing baseline (retro #3au / risk register).
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  service:
    port: 8080
    type: ClusterIP
  existingSecretName: ""  # leave empty to auto-generate, or set to a pre-created K8s secret name
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  # ---------------------------------------------------------------------------
  # v2.25.0 P3: MCP broker server list.  JSON-serialised into YASHIGANI_MCP_SERVERS.
  # Default empty list = no MCP servers registered (gateway behaves as v2.24.x).
  # Each entry: {agent_name, upstream_url, tenant_id, is_filesystem_agent (opt)}.
  # NOTE: gateway.mcpServers MUST NOT be set unless agentBundles.filesystemMcp.enabled=true.
  # Setting mcpServers without the bundle enabled is a configuration error — the Helm
  # chart will fail at template time (validate-security.yaml MCP-GUARD-001).
  # Example (pair with agentBundles.filesystemMcp.enabled=true):
  #   gateway:
  #     mcpServers:
  #       - agent_name: filesystem-mcp
  #         upstream_url: http://filesystem-mcp:8000
  #         tenant_id: acme
  #         is_filesystem_agent: true
  # ---------------------------------------------------------------------------
  mcpServers: []
  # ---------------------------------------------------------------------------
  # K8s parity fix (tier-tests-20260720, supersedes K8s SB-2): MCP identity
  # signing key delivery for Kubernetes deployments.
  #
  # WHY THIS IS REQUIRED (not optional): the MCP JWT issuer
  # (src/yashigani/mcp/_jwt.py::_load_or_generate_key) is wired on EVERY
  # gateway startup where Redis is configured — build_registry_from_env()
  # (src/yashigani/mcp/registry.py ~line 267/337) builds the shared issuer
  # whenever a durable_store is available, NOT only when
  # agentBundles.filesystemMcp.enabled or YASHIGANI_MCP_SERVERS is set. With
  # YASHIGANI_ENV=production (hardcoded by gateway.yaml, LIC-001 anti-tamper)
  # an ephemeral key is refused, so a persistent key MUST exist at
  # /run/secrets/mcp_identity_signing_key or the gateway fail-closes at
  # startup ("MCP broker wiring failed — gateway cannot start safely").
  #
  # Key spec (Nico mcp-identity-jwt-spec-20260529.md §2, LOCKED): EC P-384,
  # single root key per installation, per-tenant keys HKDF-derived at runtime
  # (YSG-RISK-253) — never generate per-tenant Secrets. Non-KMS default
  # storage = PEM file, gateway UID only. Default rotation cadence 90 days,
  # via an explicit operator-triggered rotation — NEVER silently on
  # helm upgrade/reinstall (would desync JWKS across replicas and invalidate
  # in-flight MCP identity JWTs).
  #
  # Choice: separate Secret, separate mount — logically distinct from mTLS PKI
  # (JWT signing key rotation lifecycle != TLS cert rotation lifecycle).
  #
  # Generation mechanism: Sprig's `genPrivateKey "ecdsa"` only emits P-256
  # (hardcoded), so Helm templating alone CANNOT mint the required P-384
  # curve. The chart's mtls-bootstrap-job.yaml (pre-install/pre-upgrade Job,
  # already running python `cryptography` for PKI issuance) mints this key
  # in-cluster instead — idempotently: pki-pre-seed preserves an existing key
  # from a prior install (no rotation on upgrade), the issuer initContainer
  # generates a fresh key only when none was preserved, and the applier
  # container writes/keeps the Secret (helm.sh/resource-policy: keep, same as
  # the two PKI Secrets). Zero operator pre-creation required — `helm install`
  # alone is sufficient (CLAUDE.md: reproduce from committed code).
  #
  # existingSecretName: set to point the gateway at an operator/KMS-synced
  # Secret instead (e.g. Vault Agent Injector, external-secrets-operator) —
  # the chart-managed Secret named `secretName` below is then not consulted.
  # Mirrors the mtls.existingSecretName override pattern exactly.
  # ---------------------------------------------------------------------------
  mcpSigningKey:
    existingSecretName: ""                     # operator/KMS override (optional)
    secretName: "yashigani-mcp-signing-key"     # chart-managed Secret (mtls-bootstrap-job)
    secretKey: "mcp_identity_signing_key"       # key inside the Secret
  env:
    upstreamUrl: ""
    opaUrl: "https://yashigani-policy:8181"
    # YSG-RISK-136 fix: this MUST match docker-compose.yml's gateway/backoffice
    # OLLAMA_BASE_URL (https://caddy:11435/ollama) — the NetworkPolicy hardening
    # in networkpolicy.yaml (v4.1 Phase 1b-ii / LAURA-I1-01) removed the direct
    # gateway/backoffice -> yashigani-ollama:11434 ingress rule; ONLY the caddy
    # pod may reach ollama:11434 now (allow-ollama-ingress). This default was
    # never updated in lockstep when that NetworkPolicy hardening landed, so
    # every k8s gateway Ollama call (direct-model chat AND the fallback local
    # backend behind every agent route) was silently dropped by NetworkPolicy
    # (TCP connect timeout, no RST — indistinguishable from a dead backend
    # without packet-level inspection). ollama_async_client/ollama_sync_client
    # (inspection/_ollama_transport.py) already handle this mesh-mTLS URL
    # scheme (used for the "Mac Metal" front too) — this is a values-only fix,
    # no code change needed. See caddy.yaml Service (port 11435 added) +
    # networkpolicy.yaml (already correct, unchanged by this fix).
    #
    # YSG-RISK-136 FOLLOW-UP (live-verification catch, same day): the first cut
    # of this fix pointed at hostname "yashigani-caddy" — but that's the MAIN
    # LoadBalancer Service (public edge, only ports 80/443, deliberately never
    # carries the internal mesh port — see agent-ingress-fronts.yaml's own
    # "NEVER on the public LoadBalancer Service" rationale). Port 11435 was
    # added to a SEPARATE, purpose-built ClusterIP Service,
    # "yashigani-caddy-mesh" (same file), specifically so it would NOT land on
    # the public LB. The hostname here must match THAT service, not the main
    # one. Confirmed live: yashigani-caddy:11435 timed out (Service has no
    # such port — direct pod-IP connect to the same caddy pod succeeded
    # instantly, isolating this as a Service-definition/hostname mismatch, not
    # a NetworkPolicy or pod-readiness issue); yashigani-caddy-mesh:11435
    # connects immediately.
    ollamaUrl: "https://yashigani-caddy-mesh:11435/ollama"
    redisHost: "yashigani-redis"
    redisPort: "6379"
    agentRoutingEnabled: "true"
    agentPathPrefix: "/agents"
    agentTokenMinLength: "64"
    # v0.5.0
    deploymentStream: "opensource"
    # YSG-RISK-076 / DP-Y-003 §3.4: semantic-intent import classifier sidecar.
    # Default "true" — every MCP tool import is screened by the Ollama-backed
    # semantic-intent classifier before operator approval (day-one-poison close).
    # Set to "false" to disable (e.g. air-gapped deployments without Ollama).
    # Backend: ollamaUrl (http://yashigani-ollama:11434 above). No extra service.
    semanticIntentSidecar: "true"
    # --- Orchestration caps (build-sheet §9 — operator-tunable; MF3 helm parity) ---
    # Mirrors docker-compose.yml x-gateway env exactly so Docker and K8s gateways
    # are config-equivalent. Read by src/yashigani/gateway/orchestrator.py via
    # configure_openai_router().
    #   orchMaxDepth=9 is the §0.1 9-level hop invariant — do NOT lower below 9.
    #   orchMaxIters is floored at 9 in code so a 9-deep chain isn't truncated.
    #   orchDeadlineS is the orchestration wall-clock budget (seconds).
    #   orchMaxFanout caps parallel sub-calls per level.
    orchMaxDepth: "9"
    orchMaxIters: "9"
    orchDeadlineS: "300"
    orchMaxFanout: "4"
    # LAURA-ORCH-001(b): strict low budget for tool calls whose justification
    # derives from prior tool-RESULT content (injection-originated hops). An
    # over-budget result-steered hop is REFUSED so a result-steering injection
    # loop cannot amplify. Keep low (default 2); raise only with care.
    orchInjectionBudget: "2"
    # ORCH-PHASE2 (Design A, letta-as-brain): per-letta-turn HTTP timeout (s). A
    # letta agentic turn does multi-step reasoning + its own gateway LLM call
    # (~2 min on the 3B brain); keep above per-turn latency and below orchDeadlineS.
    orchLettaTurnTimeoutS: "240"
    # SELFCALL_BASE — internal mesh self-call target. Same-pod loopback to the
    # http-mesh container port (8081, no Caddy, internal bearer, NetworkPolicy-
    # isolated). orchestrator._mesh_base() reads the key directly (empty string
    # would NOT fall through to the code default), so set the real value here.
    orchSelfcallBase: "http://127.0.0.1:8081"
    # M-01 fix: overridden to grpcs:// by gateway.yaml when mtls.enabled=true.
    # This value applies only when mTLS is disabled (non-default, testing only).
    otelEndpoint: "http://otel-collector:4317"
    sklearnModelPath: "/app/models/sensitivity_classifier.joblib"

# ---------------------------------------------------------------------------
# Backoffice — Admin control plane
# ---------------------------------------------------------------------------
backoffice:
  enabled: true
  # v2.23.2 fix — SSRF guard hostname allowlist (TM-V231-004 / Pentest #95).
  # _assert_safe_upstream_url() blocks loopback/RFC1918/link-local by default.
  # agentUpstreamHostnames lists the Kubernetes service hostnames that are permitted
  # as agent upstream URLs despite resolving to cluster-internal IPs. The rendered
  # value is joined with commas and injected as YASHIGANI_AGENT_UPSTREAM_HOSTNAMES
  # on the backoffice container.
  # Default: the three canonical Yashigani-internal bundle service names.
  # Extend: add your custom agent service names to this list.
  # Security: adding a name trusts that K8s service as a legitimate internal mesh
  # endpoint. Agent registration is still admin-gated (TOTP step-up + audit trail).
  agentUpstreamHostnames:
    - langflow
    - letta
    - openclaw
    # v4.1 §2.5 ingress-fronting: registered agent upstream URLs point at the
    # Caddy mesh-front ClusterIP Service (https://yashigani-caddy-mesh:
    # <meshPort>/agents/<tenant>/<system>) instead of the raw agent service.
    # The raw names above stay during the transition (rollback lever).
    - yashigani-caddy-mesh
  image:
    # Built locally by install.sh from the v2.24.0 tagged source.
    # For K8s deployments: push to your own private registry and update
    # the repository field accordingly. Pin your post-build digest with
    # `@sha256:<digest>` for supply-chain attestation (recommended).
    repository: yashigani-backoffice
    tag: "4.1.2"
    pullPolicy: IfNotPresent
  # YSG-RISK-122 (Ava, live k8s @ ca720724): defense-in-depth initContainers
  # that block backoffice's main container from starting until
  # yashigani-redis and yashigani-budget-redis are DNS-resolvable + accepting
  # TCP connections. The primary fix is the runtime self-heal in
  # backoffice/redis_selfheal.py (bounded lazy reconnect); this toggle exists
  # so operators can disable the initContainers independently if their own
  # dependency-ordering tooling already handles it. Default: enabled.
  waitForRedis:
    enabled: true
  replicaCount: 2
  # YSG-RISK-005 #3av: requests = 50% of limit.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  service:
    port: 8443
    type: ClusterIP
  existingSecretName: ""
  # Iris coord #1 (v2.25.0 P2 wave 2): backoffice.dbAesKey — operator-supplied
  # AES key for pgcrypto pgp_sym_encrypt on the auth_settings table.
  # When non-empty, secrets.yaml writes this value into yashigani-backoffice-secrets
  # under the db_aes_key key instead of auto-generating via randAlphaNum.
  # This retires the install.sh _write_helm_values `kubectl create secret --dry-run`
  # workaround which pre-seeded the Secret before helm install.
  #
  # Key format: 64-char hex (32 bytes) — generate with: openssl rand -hex 32
  # On upgrade: re-supply the SAME key or the db_aes_key value in the existing
  # Secret will be preserved by Helm's lookup() regardless of this field.
  # Missing key → RuntimeError at backoffice startup (fail-closed per SOP 1).
  #
  # Helm-only deployments: set via --set backoffice.dbAesKey="$(openssl rand -hex 32)"
  # install.sh path: install.sh generates DB_AES_KEY and sets this value
  # in _write_helm_values (removing the pre-seeding workaround).
  dbAesKey: ""
  # YSG-RISK-076 / DP-Y-003 §3.4: semantic-intent import classifier sidecar (backoffice).
  # Backoffice MCP import screen uses the same Ollama-backed classifier as the gateway.
  # Default "true". Set to "false" to disable across both gateway and backoffice.
  # Mirrors docker-compose.yml YASHIGANI_SEMANTIC_INTENT_SIDECAR on the backoffice service.
  semanticIntentSidecar: "true"
  # v2.23.3 (#59): the backoffice K8s Secret (existingSecretName / default
  # "yashigani-backoffice-secrets") must contain the following keys:
  #   db_aes_key  — 64-char hex (32 bytes) or 44-char base64; used by
  #                 pgcrypto pgp_sym_encrypt to encrypt auth_settings values
  #                 (including the HIBP API key) at rest.  install.sh generates
  #                 this key automatically; for Helm-only deployments, generate
  #                 with: openssl rand -hex 32
  #   Missing key → RuntimeError at backoffice startup (fail-closed, SOP 1).
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  # v2.23.2 #47 — Backup status + verify.
  # Set to the absolute host path of the backups directory (created by install.sh).
  # Empty string = skip the mount (endpoints return empty state gracefully).
  # Example: /opt/yashigani/backups
  backupsHostPath: ""

# ---------------------------------------------------------------------------
# Audit log persistence — B7 fix (v2.25.0 P2, Lu P0-#3)
# SOC 2 CC7.2 / ISO 27001 A.8.15 / NIST AU-9/AU-11 / CMMC AU.L2-3.3.4/8/9 /
# EU AI Act Art.12: operator-visible audit log persistence in K8s.
#
# Prior state: varlog volume was emptyDir{sizeLimit:50Mi} on gateway + backoffice.
# Pod restart wiped the file sink; audit env vars were absent from helm entirely.
#
# When enabled: gateway + backoffice replace the emptyDir with a PVC-backed
# audit-data volume at /var/log/yashigani. The audit env vars are injected on
# both containers so the application writes to the configured path + rotation.
#
# storageClass: "" uses the cluster default StorageClass (standard / gp2 / etc.)
# Set to a specific class for NFS, Longhorn, etc. that supports ReadWriteMany
# if replicaCount > 1 (each replica writes its own audit log shard).
# ---------------------------------------------------------------------------
auditLog:
  # Set to true to enable PVC-backed audit log persistence on gateway + backoffice.
  # false = prior behaviour (emptyDir 50Mi, no persistence).
  enabled: false
  persistence:
    size: "5Gi"
    storageClass: ""
    # AccessMode: ReadWriteOnce works for single-replica; ReadWriteMany needed
    # when replicaCount > 1 and the StorageClass supports it (e.g. NFS, EFS).
    accessMode: "ReadWriteOnce"
  # Audit log configuration injected as env vars (mirrors compose .env defaults).
  # YASHIGANI_AUDIT_LOG_PATH: path inside the container (must be under /var/log/yashigani)
  logPath: "/var/log/yashigani/audit.log"
  # YASHIGANI_AUDIT_MAX_FILE_SIZE_MB: rotate after this many MB (0 = disabled)
  maxFileSizeMB: "100"
  # YASHIGANI_AUDIT_RETENTION_DAYS: prune rotated files older than N days (0 = disabled)
  retentionDays: "90"

# ---------------------------------------------------------------------------
# audit — tamper-evident hash-chain checkpoint signing (Lu wire-sink-gate P2)
# ---------------------------------------------------------------------------
audit:
  signingKey:
    # When true, mount the audit-chain checkpoint signing key (RO) into BACKOFFICE
    # ONLY and set YASHIGANI_AUDIT_SIGNING_KEY_PATH so daily merkle-root
    # checkpoints are ECDSA-signed (non-repudiation; NIST AU-10). When false,
    # checkpoints are written UNSIGNED (still tamper-evident via the merkle root).
    # CRITICAL: the signing key is never mounted into the gateway/runtime path, so
    # a held yashigani_app DB credential cannot forge a signed checkpoint.
    enabled: false
    # Secret name holding the internal-CA ECDSA leaf private key under the
    # `audit_signing.key` data key. Create it with the leaf produced by the same
    # internal CA (see install.sh _provision_audit_signing_key for the issuance
    # pattern). Marked optional in the mount so a missing Secret => unsigned, not
    # a pod-start failure.
    existingSecretName: ""

# ---------------------------------------------------------------------------
# Backup — age-encrypted CronJob (MP.L2-3.8.9 / CMMC L2)
# Last updated: 2026-05-09T00:00:00+01:00
# ---------------------------------------------------------------------------
# Operator pre-requisites (see docs/operations/backup.md — Encryption section):
#
#   1. Generate key pair on the operator host (NOT inside the cluster):
#        age-keygen -o /tmp/backup-identity.age
#        chmod 0400 /tmp/backup-identity.age
#
#   2. Extract recipient public key:
#        age-keygen -y /tmp/backup-identity.age   # prints: age1...
#
#   3. Create ConfigMap with the recipient public key:
#        kubectl create configmap yashigani-backup-recipient \
#          --from-literal=recipient.age.pub="age1<your-public-key>" \
#          -n yashigani
#
#   4. Create Secret with the identity private key (for restore access — store
#      a copy offline, do NOT keep only in-cluster):
#        kubectl create secret generic yashigani-backup-identity \
#          --from-file=identity.age=/tmp/backup-identity.age \
#          -n yashigani
#        rm /tmp/backup-identity.age  # shred the original
#
#   Encryption-only backup job does NOT require the identity Secret.
#   The identity Secret is only needed by the restore path.
#
backup:
  enabled: false  # set to true after provisioning recipientKeyConfigMap
  schedule: "0 2 * * *"  # 02:00 UTC daily
  # Name of ConfigMap holding the age recipient public key.
  # ConfigMap key must be named exactly: recipient.age.pub
  # Contents: a single line starting with 'age1' (bech32 X25519 public key).
  recipientKeyConfigMap: "yashigani-backup-recipient"
  # Name of Secret holding the age identity (private key) — used by restore path only.
  # Secret key must be named exactly: identity.age
  # This Secret is NOT mounted by the backup CronJob (encryption uses the public key only).
  identitySecret: "yashigani-backup-identity"
  # Output directory inside the CronJob pod. This path must be backed by a
  # PersistentVolume or hostPath so that encrypted archives survive pod restarts.
  outputDir: "/var/lib/yashigani/backups"
  # Source directory inside the pod to archive.
  sourceDir: "/var/lib/yashigani"
  # PersistentVolumeClaim to mount at outputDir. If empty, no PVC is created
  # and the operator must supply a hostPath or other volume via extraVolumes.
  pvcName: ""
  # If pvcName is empty and you want the chart to create a PVC, set these:
  pvc:
    create: false
    storageClassName: ""
    size: "10Gi"
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  # History limits
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  # B5 fix (v2.25.0 P2): agent bundle state directories.
  # Each entry mounts the named PVC into the backup CronJob pod and includes
  # the mountPath in the YASHIGANI_BACKUP_EXTRA_DIRS list passed to backup.sh.
  # Without this, agent bundle state (langflow flows, letta memories, openclaw
  # policies) is silently excluded from every encrypted backup.
  #
  # Disable an entry by setting pvcName: "" — the mount is skipped entirely.
  # If an agent bundle PVC does not exist, the CronJob pod will fail to start.
  # Only enable entries for agent bundles that are actually deployed.
  #
  # Example — enable langflow backup when agentBundles.langflow.enabled=true:
  #   backup:
  #     agentBundlePaths:
  #       - pvcName: "yashigani-langflow-data"
  #         mountPath: "/var/lib/yashigani-agents/langflow"
  #       - pvcName: "yashigani-letta-data"
  #         mountPath: "/var/lib/yashigani-agents/letta"
  #
  # Default: empty list — no agent bundle state included in backup.
  # Set explicitly when agent bundles are enabled and you want their state
  # included in the encrypted backup tarball.
  agentBundlePaths: []

