# ---------------------------------------------------------------------------
# Ollama — local LLM inference (StatefulSet)
# ---------------------------------------------------------------------------
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: "0.23.1@sha256:6077dbbd6508dce8973f8b91c30d8026b1279ab0483e15f0dfad469dba676c2f"
    pullPolicy: IfNotPresent
  # NEW-K8S-OLLAMA-REPLICA-MODEL-ASYMMETRY-001 (found live by Ava's e2e against
  # 4.1.2 k3s/Cilium, 2026-07-28): default was 2 (StatefulSet, "2 replicas for
  # HA"), but ollama-init-job.yaml pulls the model via a single set of
  # `ollama pull` calls against the `yashigani-ollama` Service — a normal
  # ClusterIP Service picks ONE backend pod per connection, so the pull
  # lands entirely on ONE replica (ollama-0's PVC). Every other replica's
  # PVC (each StatefulSet replica gets its own PVC via
  # volumeClaimTemplates) stays with an EMPTY model catalog. The Service
  # then round-robins real inference traffic across replicas — roughly
  # half of all chat/inference calls hit an empty-catalog replica and hang
  # (Ava's exact @letta/@langflow/@openclaw/direct-model chat-blocking
  # finding). Fixed at 1: this is also the functionally correct value for
  # any single-GPU deployment (the common shape — see project sizing notes,
  # ~50 users/RTX3060) — a second replica cannot usefully hold the SAME
  # model concurrently in the SAME one GPU's VRAM; it only adds contention,
  # never capacity. helm/yashigani/values.single-node.yaml already had this
  # correct (replicaCount: 1) as an optional overlay, but install.sh's k8s
  # path never layers it in, so every k8s install got the broken default.
  # Made the chart's baseline default itself correct rather than relying on
  # an overlay operators may not know to pass. RESIDUAL / follow-up (not
  # fixed here): true multi-GPU multi-replica scale-out requires
  # ollama-init-job.yaml to pull per-pod (e.g. iterate StatefulSet pod DNS
  # names ollama-0.<headless-svc>, ollama-1.<headless-svc>, ... instead of
  # the round-robin Service VIP) before replicaCount > 1 is safe again.
  # ollama.hpa.* below is NOT wired to any live HorizontalPodAutoscaler
  # object in this chart (grepped: no HPA template exists for ollama at
  # all) — those values are currently inert/dead config, so no separate
  # autoscale-reintroduces-the-bug risk exists today; flagged for whoever
  # eventually wires HPA up to also gate it on the per-pod-pull fix above.
  replicaCount: 1
  # YSG-RISK-005 #3av: requests = 50% of limit.
  # LLM inference — high memory requirement, 2 CPUs to keep inference
  # from starving other services. Increase on GPU hosts.
  resources:
    requests:
      cpu: "1000m"
      memory: "2048Mi"
    limits:
      cpu: "2000m"
      memory: "4096Mi"
  service:
    port: 11434
    type: ClusterIP
  persistence:
    enabled: true
    # Sized for: model storage (3-30 GB depending on model) +
    # per-user inference data (documents, files, embeddings caches).
    # Increase further for multi-user heavy-document workloads.
    size: 100Gi
    storageClass: ""
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
  model: "qwen2.5:3b"
  # keepAlive: how long a loaded model stays resident in VRAM after last use.
  # -1 = never evict (recommended — cold load is 37-46s, exceeds classifier timeout).
  # Set to "5m" to restore Ollama default idle-eviction behaviour.
  keepAlive: "-1"
  env:
    ollamaHost: "0.0.0.0"
    # HOME=/data routes ollama's key + state (~/.ollama) to the persistent
    # volume mount, allowing the container to run as UID 1000 (non-root).
    # Verified 2026-05-03 — no root required.
    home: "/data"
    ollamaModels: "/data/models"
  # initJob — one-shot Kubernetes Job to pull the default model on first deploy.
  # Activated only when an agent bundle needing it is enabled (no model needed
  # for API-only). defaultModel: model to pull, so the ui4 chat surface shows
  # it as an available backend.
  # modelDigest: short SHA prefix for supply-chain verification (SOL-SC-03).
  #   Default is "skip" — Ollama republishes models on upstream updates, which
  #   changes the manifest SHA and hard-fails every clean install if a stale
  #   digest is pinned. Prod operators who need strict enforcement set an explicit
  #   prefix here; mismatches are always logged as loud WARNINGs.
  # minDiskGiB: minimum free gigabytes required on the ollama volume before pull.
  #   If free space < minDiskGiB the Job logs a warning and exits 0 (warn-only).
  initJob:
    # defaultModel: qwen2.5:3b — 1.9 GB, Qwen 2.5 3B-parameter instruct model.
    # Good balance of size and capability for a single-node deployment.
    defaultModel: "qwen2.5:3b"
    modelDigest: "skip"
    minDiskGiB: 3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
  # gpu: Kubernetes GPU resource configuration (source: docs.ollama.com/gpu).
  # Apple Metal (apple_metal) is NOT applicable to Kubernetes — it is a macOS-only
  # host-native path handled by the compose overlay (docker-compose.gpu-mac-metal.yml).
  #
  # Supported K8s paths:
  #   nvidia  — requires NVIDIA device plugin (k8s.io/nvidia-device-plugin)
  #             sets: resources.limits."nvidia.com/gpu": "1"
  #   amd_rocm— requires AMD device plugin (github.com/ROCm/k8s-device-plugin)
  #             sets: resources.limits."amd.com/gpu": "1"
  #   vulkan  — no standard K8s device plugin; manual device mount required
  #             (extraDevices not yet implemented — fall back to CPU or use hostPath)
  #   none    — CPU-only (default)
  #
  # additionalResourceLimits: merged into ollama.resources.limits when non-empty.
  # Example for NVIDIA:  additionalResourceLimits: {"nvidia.com/gpu": "1"}
  # Example for AMD:     additionalResourceLimits: {"amd.com/gpu": "1"}
  gpu:
    type: "none"
    additionalResourceLimits: {}

