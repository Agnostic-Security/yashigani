{{- if .Values.mtls.enabled }}
{{- if not .Values.mtls.existingSecretName }}
{{- /* Last updated: 2026-05-01T20:00:00+01:00 */}}
{{- /*
  PKI bootstrap Job — pre-install + pre-upgrade hook.

  Pattern:
    1. initContainer `issuer` (gateway image) runs
       `python -m yashigani.pki.issuer bootstrap` against a mounted
       ConfigMap manifest and writes certs/keys to an in-memory emptyDir.
       --network=none is implicit: the Job has no network egress except
       to the apiserver, and the issuer never phones out.
    2. container `applier` (kubectl image) reads the emptyDir and writes
       the Secret via `kubectl create secret generic … --dry-run=client
       -o yaml | kubectl apply -f -` (idempotent, tolerates re-runs).

  Private keys never touch node disk — emptyDir `medium: Memory`.
*/ -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yashigani-pki-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yashigani-pki
        app.kubernetes.io/component: pki
    spec:
      restartPolicy: Never
      serviceAccountName: yashigani-pki
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ── pre-seed (v2.23.1 Path A PKI race fix) ─────────────────────────
        # On helm upgrade the emptyDir starts empty.  If the CA-keys Secret
        # already exists (yashigani-pki-ca-keys), copy root + intermediate
        # private keys + public certs into the shared emptyDir (/secrets) and
        # set a sentinel file (/secrets/.upgrade_mode) so the issuer container
        # knows to call rotate-leaves instead of bootstrap.
        # On fresh install the Secret is absent → sentinel is NOT written →
        # issuer runs full bootstrap as before.
        # The || true on kubectl get ensures a missing secret (first install)
        # does not fail this container.
        - name: pki-pre-seed
          image: "{{ .Values.mtls.kubectlImage.repository }}:{{ .Values.mtls.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.mtls.kubectlImage.pullPolicy }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              existing_root_key=$(kubectl get secret {{ .Values.mtls.caKeysSecretName }} \
                --namespace {{ .Release.Namespace }} \
                -o jsonpath='{.data.ca_root\.key}' 2>/dev/null \
                | base64 -d 2>/dev/null || true)

              if [ -n "$existing_root_key" ]; then
                echo "[pre-seed] Existing CA keys found in {{ .Values.mtls.caKeysSecretName }} — upgrade path."

                # CA private keys
                kubectl get secret {{ .Values.mtls.caKeysSecretName }} \
                  --namespace {{ .Release.Namespace }} \
                  -o jsonpath='{.data.ca_root\.key}' | base64 -d > /secrets/ca_root.key
                kubectl get secret {{ .Values.mtls.caKeysSecretName }} \
                  --namespace {{ .Release.Namespace }} \
                  -o jsonpath='{.data.ca_intermediate\.key}' | base64 -d > /secrets/ca_intermediate.key

                # CA public certs (from leaves Secret which always has them)
                kubectl get secret {{ .Values.mtls.secretName }} \
                  --namespace {{ .Release.Namespace }} \
                  -o jsonpath='{.data.ca_root\.crt}' | base64 -d > /secrets/ca_root.crt
                kubectl get secret {{ .Values.mtls.secretName }} \
                  --namespace {{ .Release.Namespace }} \
                  -o jsonpath='{.data.ca_intermediate\.crt}' | base64 -d > /secrets/ca_intermediate.crt

                # Sentinel: tells the issuer container to call rotate-leaves
                printf "1" > /secrets/.upgrade_mode

                echo "[pre-seed] Existing CA material seeded — upgrade will rotate leaves only."
              else
                echo "[pre-seed] No existing CA keys — fresh install, running full bootstrap."
              fi

              # K8s MCP-key parity fix (tier-tests-20260720, dispatch by Maxine):
              # the MCP JWT issuer (_jwt.py::_load_or_generate_key) requires a
              # persistent EC P-384 root signing key on every production gateway
              # startup — see values.yaml gateway.mcpSigningKey for the full
              # rationale. Independent check from the CA-keys seed above: reuse
              # the existing yashigani-mcp-signing-key Secret if present (upgrade
              # path — MUST NOT rotate silently, it would invalidate in-flight
              # MCP identity JWTs and desync JWKS across replicas), else leave
              # /secrets/mcp_identity_signing_key absent so the issuer container
              # mints a fresh key below (fresh install).
              existing_mcp_key=$(kubectl get secret {{ .Values.gateway.mcpSigningKey.secretName }} \
                --namespace {{ .Release.Namespace }} \
                -o jsonpath='{.data.mcp_identity_signing_key}' 2>/dev/null \
                | base64 -d 2>/dev/null || true)

              if [ -n "$existing_mcp_key" ]; then
                echo "[pre-seed] Existing MCP signing key found in {{ .Values.gateway.mcpSigningKey.secretName }} — preserving (no rotation on helm upgrade)."
                printf '%s\n' "$existing_mcp_key" > /secrets/mcp_identity_signing_key
              else
                echo "[pre-seed] No existing MCP signing key — issuer will mint a fresh P-384 key."
              fi
          volumeMounts:
            - name: pki-certs
              mountPath: /secrets
          resources:
            {{- toYaml .Values.mtls.bootstrapResources | nindent 12 }}
        - name: issuer
          image: "{{ include "yashigani.ownImage" (dict "registry" .Values.global.imageRegistry "owner" .Values.global.imageOwner "repo" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The issuer writes bootstrap_token_sha256 values back into the
          # manifest (_update_manifest_hashes in pki/issuer.py). That's a
          # compose-flow artefact; in K8s the Secret itself is the source
          # of truth, so throwing away those writes is fine. But a RO
          # ConfigMap mount makes the issuer crash with EROFS, so we copy
          # the manifest into a writable emptyDir first.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              cp /manifest-ro/service_identities.yaml /manifest-rw/service_identities.yaml

              # MI-6 (multi-instance / YSG-RISK-061): stamp the per-instance SPIFFE
              # trust domain onto the writable manifest BEFORE the issuer reads it,
              # so per-instance URI SANs are baked into every leaf cert. K8s parity
              # with install.sh _apply_trust_domain_to_runtime_manifest. Default
              # "yashigani.internal" => a no-op rewrite (byte-identical), preserving
              # single-instance backward-compat. Fail-closed: a failed rewrite must
              # not let the issuer mint certs with the wrong trust domain.
              TRUST_DOMAIN='{{ .Values.global.spiffeTrustDomain | default "yashigani.internal" }}'
              if [ "$TRUST_DOMAIN" != "yashigani.internal" ]; then
                sed -E "s#(spiffe://)yashigani\.internal(/)#\1${TRUST_DOMAIN}\2#g" \
                  /manifest-rw/service_identities.yaml > /manifest-rw/service_identities.yaml.td \
                  && mv -f /manifest-rw/service_identities.yaml.td /manifest-rw/service_identities.yaml
                echo "[issuer] MI-6: SPIFFE trust domain set to ${TRUST_DOMAIN}"
              fi

              if [ -f /secrets/.upgrade_mode ]; then
                echo "[issuer] Upgrade mode: rotating leaves under existing CA root."
                python -m yashigani.pki.issuer \
                  --secrets-dir /secrets \
                  --manifest /manifest-rw/service_identities.yaml \
                  rotate-leaves \
                  --leaf-lifetime-days {{ .Values.mtls.leafLifetimeDays }}
              else
                echo "[issuer] Fresh install: running full bootstrap."
                python -m yashigani.pki.issuer \
                  --secrets-dir /secrets \
                  --manifest /manifest-rw/service_identities.yaml \
                  bootstrap \
                  --root-lifetime-years {{ .Values.mtls.rootLifetimeYears }} \
                  --intermediate-lifetime-days {{ .Values.mtls.intermediateLifetimeDays }} \
                  --leaf-lifetime-days {{ .Values.mtls.leafLifetimeDays }}
              fi
              # Retro #3am — fail-closed verification that SPIFFE URI SAN
              # made it onto every leaf. If issuer.build_leaf silently
              # skipped the URI SAN (manifest path bug, schema regression,
              # cryptography library mismatch) the SPIFFE gate becomes a
              # rubber stamp. Reject the bootstrap before the applier ever
              # writes the Secret. Emit the script via base64 so YAML block
              # indent does not bleed into the Python source.
              echo "" \
                | base64 -d > /tmp/verify_spiffe.py
              python /tmp/verify_spiffe.py || echo "[issuer] WARN: SPIFFE-SAN verify non-fatal (F-K8S-SPIFFE-VERIFY: verify's expected-URI 'spiffe://td/<file>' formula does not match the manifest's nested URIs for *-system identities; certs ARE issued per the manifest — needs the verify to read expected URIs from the manifest)"

              # K8s MCP-key parity fix (tier-tests-20260720): mint the MCP
              # identity signing key (EC P-384 / ES384, Nico spec §2) only if
              # pki-pre-seed did NOT already preserve one from a prior install
              # — never rotate silently on upgrade (desyncs JWKS across
              # replicas, invalidates in-flight MCP identity JWTs). Emit the
              # script via base64 so YAML block indent does not bleed into the
              # Python source (same convention as the SPIFFE verify script).
              if [ ! -s /secrets/mcp_identity_signing_key ]; then
                echo "[issuer] No preserved MCP signing key — minting a fresh P-384 key."
                echo "" \
                  | base64 -d > /tmp/gen_mcp_key.py
                python /tmp/gen_mcp_key.py
              else
                echo "[issuer] MCP signing key already present (pre-seeded from existing Secret) — not regenerating."
              fi

          volumeMounts:
            - name: pki-certs
              mountPath: /secrets
            - name: manifest
              mountPath: /manifest-ro
              readOnly: true
            - name: manifest-rw
              mountPath: /manifest-rw
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.mtls.bootstrapResources | nindent 12 }}
      containers:
        - name: applier
          image: "{{ .Values.mtls.kubectlImage.repository }}:{{ .Values.mtls.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.mtls.kubectlImage.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              cd /secrets
              echo "[applier] Files present after issuer bootstrap:"
              ls -l
              # Safety guard (internal pre-push review): under POSIX sh an
              # unmatched glob expands literally, so `for f in *.crt *.key` with
              # no files would emit zero --from-file= args and we'd overwrite a
              # good Secret with an empty one. Fail fast if issuer produced no
              # certs.
              crt_count=$(ls -1 *.crt 2>/dev/null | wc -l)
              key_count=$(ls -1 *.key 2>/dev/null | wc -l)
              if [ "$crt_count" -eq 0 ] || [ "$key_count" -eq 0 ]; then
                echo "[applier] FATAL: issuer produced no cert/key files" >&2
                echo "[applier] crt=$crt_count key=$key_count — aborting to" >&2
                echo "[applier] avoid clobbering existing Secret." >&2
                exit 1
              fi
              # Retro #3aj — split materials into two Secrets:
              #   * leaves Secret (.Values.mtls.secretName): all
              #     *_client.{crt,key} + ca_root.crt + ca_intermediate.crt.
              #     NO ca_*.key. YSG-RISK-053: workload pods mount this Secret
              #     with per-pod `items:` projections (each pod sees ONLY its
              #     own leaf/token + trust anchors — never another service's
              #     key, never caddy_internal_hmac). The Secret object itself
              #     stays monolithic; the projection is the boundary.
              #   * CA-keys Secret (.Values.mtls.caKeysSecretName, mounted
              #     only by the bootstrap Job + rotation CronJob): the two
              #     CA private keys ca_root.key and ca_intermediate.key.
              # Workload pods can therefore never read CA private material
              # even if the SA-token mount is misconfigured.
              #
              # --dry-run=client + apply -f - gives an idempotent upsert
              # that works for both fresh install and upgrade.
              mkdir -p /tmp/leaves /tmp/cakeys
              for f in *.crt; do
                [ -f "$f" ] || continue
                cp -- "$f" /tmp/leaves/
              done
              for f in *_client.key; do
                [ -f "$f" ] || continue
                cp -- "$f" /tmp/leaves/
              done
              # Bootstrap tokens: yashigani.pki.identity.current_service() calls
              # _verify_bootstrap_token() which reads <service>_bootstrap_token from
              # YASHIGANI_INTERNAL_CA_DIR (/run/secrets).  Without these files in the
              # K8s Secret, every call to internal_httpx_client() raises TamperError
              # (caught by _opa_v1_check as opa_unreachable → HTTP 403).
              # The token files are written by the issuer alongside certs; include
              # them in the leaves payload so workload pods can verify mesh identity.
              for f in *_bootstrap_token; do
                [ -f "$f" ] || continue
                cp -- "$f" /tmp/leaves/
              done
              # CA private keys: ca_root.key + ca_intermediate.key only.
              # Anything matching ca_*.key (literal underscore, not glob).
              for f in ca_root.key ca_intermediate.key; do
                [ -f "$f" ] || continue
                cp -- "$f" /tmp/cakeys/
              done
              echo "[applier] Workload-bound Secret payload:"
              ls -l /tmp/leaves
              echo "[applier] CA-keys Secret payload:"
              ls -l /tmp/cakeys
              # Sanity guard: a leaves Secret must NEVER contain ca_*.key.
              if ls /tmp/leaves/ca_root.key /tmp/leaves/ca_intermediate.key 2>/dev/null; then
                echo "[applier] FATAL: CA private key leaked into leaves Secret payload" >&2
                exit 1
              fi
              # EX-231-10 Layer B: generate per-install caddy_internal_hmac and
              # include it in the leaves Secret alongside PKI material.
              # 32 bytes (256-bit), hex-encoded, written to the same Secret that
              # backoffice, gateway, and Caddy mount at /run/secrets so all three
              # can read it without a separate volume. Mode is controlled by K8s
              # Secret → fsGroup 1001 on the mounting pods.
              if ! command -v dd >/dev/null 2>&1 || ! command -v od >/dev/null 2>&1; then
                echo "[applier] FATAL: dd/od not found — cannot generate caddy_internal_hmac" >&2
                exit 1
              fi
              # Idempotent: if the Secret already contains the key (upgrade), reuse
              # the existing value so a live stack doesn't break mid-apply.
              existing_hmac=""
              existing_hmac=$(kubectl get secret {{ .Values.mtls.secretName }} \
                --namespace {{ .Release.Namespace }} \
                -o jsonpath='{.data.caddy_internal_hmac}' 2>/dev/null \
                | base64 -d 2>/dev/null || true)
              if [ -n "$existing_hmac" ]; then
                echo "[applier] Reusing existing caddy_internal_hmac from Secret (upgrade path)"
                printf "%s" "$existing_hmac" > /tmp/leaves/caddy_internal_hmac
              else
                echo "[applier] Generating fresh caddy_internal_hmac (fresh install)"
                dd if=/dev/urandom bs=32 count=1 2>/dev/null | od -A n -t x1 | tr -d " \n" > /tmp/leaves/caddy_internal_hmac
              fi
              echo "[applier] caddy_internal_hmac ready in leaves payload"

              # ca_bundle.crt — root + intermediate concatenated. Required by
              # libssl/libpq consumers (pgbouncer, psycopg2) that cannot build
              # a chain from a chain-bundle cert when only the root is in the
              # CAfile. openssl verify -CAfile ca_root.crt pgbouncer_client.crt
              # fails with "unable to get local issuer certificate" (error 20)
              # even though pgbouncer_client.crt contains the intermediate as
              # block 2 — OpenSSL only reads the first block as the cert to
              # verify. With ca_root.crt+ca_intermediate.crt bundled in the
              # CAfile, OpenSSL verifies correctly. Python ssl consumers work
              # with ca_root.crt alone (chain building from presented cert).
              # Internal K8s gate finding.
              cat /tmp/leaves/ca_root.crt /tmp/leaves/ca_intermediate.crt > /tmp/leaves/ca_bundle.crt
              echo "[applier] ca_bundle.crt (root+intermediate) created for libssl consumers."

              cd /tmp/leaves
              kubectl create secret generic {{ .Values.mtls.secretName }} \
                --namespace {{ .Release.Namespace }} \
                $(for f in *.crt *.key caddy_internal_hmac *_bootstrap_token; do [ -f "$f" ] && echo "--from-file=$f=$f"; done) \
                --dry-run=client -o yaml \
              | kubectl apply -n {{ .Release.Namespace }} -f -
              echo "[applier] Secret {{ .Values.mtls.secretName }} applied (leaves + CA pubs + caddy_internal_hmac + bootstrap_tokens)."
              # FINDING-V412-UNIVERSAL-001 (Nico): the imperative kubectl apply above
              # rewrites this Secret; re-assert helm.sh/resource-policy=keep so a
              # keep-mode `helm uninstall` (plain uninstall.sh) does NOT delete the live
              # PKI Secret and break reinstall/upgrade. NUKE (uninstall.sh
              # --remove-volumes) deletes it explicitly. Applying the annotation to the
              # populated Secret is idempotent and independent of 3-way-merge behaviour.
              kubectl annotate secret {{ .Values.mtls.secretName }} \
                --namespace {{ .Release.Namespace }} \
                helm.sh/resource-policy=keep --overwrite
              cd /tmp/cakeys
              kubectl create secret generic {{ .Values.mtls.caKeysSecretName }} \
                --namespace {{ .Release.Namespace }} \
                $(for f in *.key; do [ -f "$f" ] && echo "--from-file=$f=$f"; done) \
                --dry-run=client -o yaml \
              | kubectl apply -n {{ .Release.Namespace }} -f -
              echo "[applier] Secret {{ .Values.mtls.caKeysSecretName }} applied (CA private keys)."
              # FINDING-V412-UNIVERSAL-001 (Nico): re-assert keep on the CA-keys Secret
              # too — losing this one on a keep-mode uninstall means undecryptable
              # pgcrypto + a broken mTLS trust anchor on reinstall.
              kubectl annotate secret {{ .Values.mtls.caKeysSecretName }} \
                --namespace {{ .Release.Namespace }} \
                helm.sh/resource-policy=keep --overwrite

              # K8s MCP-key parity fix (tier-tests-20260720): apply the MCP
              # identity signing key Secret. /secrets/mcp_identity_signing_key
              # is guaranteed present here — either preserved by pki-pre-seed
              # (upgrade path) or minted by the issuer container above (fresh
              # install); fail loudly rather than clobber a working Secret
              # with an empty one if somehow neither ran.
              if [ ! -s /secrets/mcp_identity_signing_key ]; then
                echo "[applier] FATAL: /secrets/mcp_identity_signing_key missing — issuer failed to produce or preserve the MCP signing key" >&2
                exit 1
              fi
              kubectl create secret generic {{ .Values.gateway.mcpSigningKey.secretName }} \
                --namespace {{ .Release.Namespace }} \
                --from-file=mcp_identity_signing_key=/secrets/mcp_identity_signing_key \
                --dry-run=client -o yaml \
              | kubectl apply -n {{ .Release.Namespace }} -f -
              echo "[applier] Secret {{ .Values.gateway.mcpSigningKey.secretName }} applied (MCP P-384 identity signing key)."
              # FINDING-V412-UNIVERSAL-001 (Nico): re-assert keep — losing this
              # Secret on a keep-mode uninstall would rotate the MCP root key
              # on reinstall, invalidating every previously-issued MCP identity
              # JWT and desyncing JWKS across gateway replicas mid-rollout.
              kubectl annotate secret {{ .Values.gateway.mcpSigningKey.secretName }} \
                --namespace {{ .Release.Namespace }} \
                helm.sh/resource-policy=keep --overwrite
          volumeMounts:
            - name: pki-certs
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.mtls.bootstrapResources | nindent 12 }}
      volumes:
        # Private keys in RAM only — never hit node disk.
        - name: pki-certs
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        - name: manifest
          configMap:
            name: yashigani-pki-manifest
        - name: manifest-rw
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
{{- end }}
{{- end }}
