{{- /* Last updated: 2026-05-07T00:00:00+01:00 */ -}}
{{- if .Values.caddy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yashigani-caddy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.caddy.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: yashigani-caddy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yashigani-caddy
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.mtls.enabled }}
      annotations:
        # Trigger rolling update when PKI Secret resourceVersion changes.
        # See gateway.yaml for full rationale.
        checksum/pki-certs: {{ lookup "v1" "Secret" .Release.Namespace .Values.mtls.secretName | default dict | dig "metadata" "resourceVersion" "" | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yashigani.serviceAccountName" . }}
      securityContext:
        # YSG-RISK-008: caddy runs as UID 1000 (caddy user baked into the
        # official image). NET_BIND_SERVICE retained to bind :80/:443 without
        # root. ROFS: /data and /config are emptyDir mounts so read-only root
        # is safe — all filesystem writes go to volume mounts.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup triggers chgrp on Secret volumes so UID 1000 (caddy) can
        # read /run/secrets/* at mode 0440. Without this, files stay root:root
        # and caddy errors: open /run/secrets/caddy_client.crt: permission denied.
        # YSG-RISK-008 omitted this; parity fix per G9 K8s restore round-trip.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: "{{ .Values.caddy.image.repository }}:{{ .Values.caddy.image.tag }}"
          imagePullPolicy: {{ .Values.caddy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add:
                - NET_BIND_SERVICE
                # YSG-RISK-061 (v2.24.1): NET_ADMIN required for iptables
                # egress restriction in caddy-entrypoint.sh. Scoped to the
                # container's network namespace — does not affect the host.
                # K8s NetworkPolicy (networkpolicy-caddy-egress.yaml) provides
                # an equivalent kernel-enforced egress allowlist. Both controls
                # are complementary: iptables = in-process depth; NetworkPolicy
                # = infra-layer enforcement. Accepted by Tiago 2026-05-25.
                - NET_ADMIN
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            {{- if .Values.caddy.internalMetricsListener.enabled }}
            - name: metrics-gw
              containerPort: {{ .Values.caddy.internalMetricsListener.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.caddy.internalMetricsListenerBackoffice.enabled }}
            - name: metrics-bo
              containerPort: {{ .Values.caddy.internalMetricsListenerBackoffice.port }}
              protocol: TCP
            {{- end }}
            {{- if and .Values.caddy.adminRelay.enabled .Values.mtls.enabled }}
            # v4.1 SU-SEAM-1d-04: mesh-mTLS admin relay (see configmaps.yaml
            # :2019 site block). NOT the raw admin API (MUST-4 — that stays on
            # the pod-local unix socket): mTLS require_and_verify + backoffice
            # SPIFFE pin + POST /load only. NetworkPolicy admits backoffice only.
            - name: admin-relay
              containerPort: {{ .Values.caddy.adminRelay.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: YASHIGANI_TLS_DOMAIN
              value: {{ .Values.global.tlsDomain | quote }}
            # YSG-RISK-061 (v2.24.1): operator ACME/egress allowlist.
            # Comma-separated host:port pairs added to the iptables OUTPUT allowlist
            # in caddy-entrypoint.sh. Empty string = default only (LE + OCSP).
            - name: YASHIGANI_CADDY_EGRESS_ALLOWLIST
              value: {{ .Values.caddy.egressAllowlist | default "" | quote }}
            {{- if .Values.mtls.enabled }}
            # EX-231-10 Layer B: CADDY_INTERNAL_HMAC is read from the same
            # pki-certs Secret that carries the mTLS leaf certs. Caddy injects
            # it as X-Caddy-Verified-Secret on every upstream proxy call.
            - name: CADDY_INTERNAL_HMAC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
                  key: caddy_internal_hmac
            {{- end }}
            {{- if .Values.fips.mode }}
            # Nico N-001 (v2.24.4): FIPS_MODE propagation.
            # Routes openssl dgst calls through the OpenSSL FIPS Provider.
            # REQUIRES a FIPS-configured base image (CMVP #4985) — default
            # caddy:2.11.2-alpine does NOT contain the FIPS Provider. Do NOT
            # set fips.mode=true without swapping to a FIPS-configured image.
            - name: FIPS_MODE
              value: "1"
            {{- end }}
            {{- if .Values.agentBundles.openclaw.enabled }}
            # FP-06 Phase 2: Slack operator-config secrets → Caddy parse-time env.
            # CHANNEL 1 (incoming-webhook path pin) and CHANNEL 2 (bot-token pin).
            # Sourced from K8s Secret yashigani-openclaw-slack-secrets (secrets.yaml).
            # optional: true → if Secret/key absent, env var not set → Caddy default
            # "" → enforcement expression short-circuits false (inert-until-set).
            # Byte-parity with compose: compose reads from /run/secrets/ files via
            # caddy-entrypoint.sh; K8s injects the same vars directly from the Secret.
            # Caddyfile uses {$YASHIGANI_OPENCLAW_SLACK_*:} in both runtimes.
            - name: YASHIGANI_OPENCLAW_SLACK_WEBHOOK_PATH
              valueFrom:
                secretKeyRef:
                  name: yashigani-openclaw-slack-secrets
                  key: webhook_path
                  optional: true
            - name: YASHIGANI_OPENCLAW_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yashigani-openclaw-slack-secrets
                  key: bot_token
                  optional: true
            {{- end }}
          # Retro #3al — probe the public :80 listener instead of the admin
          # endpoint at :2019. Caddy's admin API is bound to localhost only;
          # exposing it on 0.0.0.0 to satisfy the kubelet would expose the
          # entire config-mutation surface. Use the dedicated /healthz on
          # :80 introduced in the configmaps.yaml :80 block (returns 204).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.caddy.resources | nindent 12 }}
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            # S4 (P1 W3 Phase 2a): agent Caddyfile snippet directory.
            # Populated by the yashigani-caddy-agents ConfigMap (empty at base
            # install). The Caddyfile ends with `import /etc/caddy/agents/*.caddy`
            # which picks up per-agent route snippets as agents are onboarded.
            # Read-only: snippets are written by ringfence-init codegen, not Caddy.
            - name: caddy-agents
              mountPath: /etc/caddy/agents
              readOnly: true
            # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21): broker-owned
            # DYNAMIC MCP route directory (see configmaps.yaml S4 sentinel
            # comment). RO here — the caddy-config-broker sidecar below is
            # the sole writer.
            - name: caddy-agents-dynamic
              mountPath: /etc/caddy/agents-dynamic
              readOnly: true
            # MUST-4 / v2.24.1: admin unix socket lives here.
            # readOnlyRootFilesystem requires an explicit writable mount for
            # the socket directory — Caddy creates admin.sock at startup.
            - name: caddy-admin-sock
              mountPath: /run/caddy
            {{- if .Values.mtls.enabled }}
            # Mesh mTLS — Caddy presents caddy_client.{crt,key} to gateway/
            # backoffice/policy upstreams and validates them against ca_root.
            # Required for the public :443 listener (Option B parity with
            # Docker/Podman) AND for the SPIFFE-gated :8444/:8445 metrics
            # listeners. Read-only, mode 0440 so UID 65532 (caddy) can read.
            - name: pki-certs
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
            {{- /* SEAM-1d-04: per-MCP SVID Secret volumes.
                 Each Shape-C agent emits a mcpSvid.<key> entry in its values
                 file (codegen _gen_values_yaml_shape_c).  Helm merges map
                 keys addtively across -f values files, so multiple agents each
                 get their own Secret projected into the Caddy Pod at their
                 own mountPath.  GID model: fsGroup=1000 (pod security context
                 above) + defaultMode=0440 → Caddy (UID/GID 1000) can read the
                 key. No supplementalGroups[2003] needed in K8s (unlike compose
                 group_add — K8s uses fsGroup instead). */ -}}
            {{- range $key, $svid := .Values.mcpSvid }}
            - name: mcp-svid-{{ $key }}
              mountPath: {{ $svid.mountPath }}
              readOnly: true
            {{- end }}
        {{- if and .Values.caddy.configBroker.enabled .Values.caddy.adminRelay.enabled .Values.mtls.enabled }}
        # FINDING-V412-CADDYADMIN-002 REWORK (Captain, 2026-07-21): route-
        # registering broker for the :2019 admin relay's POST/DELETE /route
        # DATA contract — see docker/caddy/config_broker.py module docstring
        # (the R1+R2 rework replacing the old raw-/load-body-validating
        # design, Su 5443f11f, after Laura's final re-attack proved it FAILED
        # live under no-new-privileges). Co-located in this pod (not a
        # separate Deployment) so it can reach caddy's pod-local admin socket
        # via the shared caddy-admin-sock emptyDir AND write into the shared
        # caddy-agents-dynamic emptyDir — unix sockets and emptyDirs cannot
        # span pods.
        - name: caddy-config-broker
          image: "{{ .Values.caddy.configBroker.image.repository }}:{{ .Values.caddy.configBroker.image.tag }}"
          imagePullPolicy: {{ .Values.caddy.configBroker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            # Loopback-only by BROKER_LISTEN_HOST below — no K8s Service or
            # NetworkPolicy ingress rule ever targets this containerPort;
            # documentation only (matches the convention in this file).
            - name: config-broker
              containerPort: {{ .Values.caddy.configBroker.port }}
              protocol: TCP
          env:
            - name: BROKER_LISTEN_MODE
              value: "tcp"
            - name: BROKER_LISTEN_HOST
              value: "127.0.0.1"
            - name: BROKER_LISTEN_PORT
              value: {{ .Values.caddy.configBroker.port | quote }}
            # FINDING-V412-CADDYADMIN-002-b (Captain, 2026-07-21): this
            # broker NEVER adapts the monolith itself (see config_broker.py
            # "ENV-VAR-FREE SELF-CHECKS" — the real monolith references
            # ~12 `{$VAR}` placeholders only real Caddy's own environment
            # carries; adapting it here without those vars hard-fails
            # `caddy adapt`, which broke /healthz + every reload on the
            # real install). It reads this file as RAW BYTES and forwards
            # it verbatim to the real admin socket — real Caddy does the
            # actual adapt server-side with its OWN real environment.
            - name: BROKER_CADDYFILE
              value: "/etc/caddy/Caddyfile"
            - name: BROKER_AGENTS_DYNAMIC_DIR
              value: "/etc/caddy/agents-dynamic"
            - name: BROKER_REAL_ADMIN_SOCKET
              value: "/run/caddy/admin.sock"
          resources:
            {{- toYaml .Values.caddy.configBroker.resources | nindent 12 }}
          volumeMounts:
            # RO — read as raw bytes only, never adapted (see env comment
            # above). The caddy-agents ConfigMap mount is REMOVED here
            # (FINDING-V412-CADDYADMIN-002-b) — this broker no longer
            # resolves any `import` itself, so it no longer needs it.
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            # Broker-owned DYNAMIC MCP route directory — RW here (the sole
            # writer), RO in the caddy container above.
            - name: caddy-agents-dynamic
              mountPath: /etc/caddy/agents-dynamic
            # Pod-local admin socket — shared with the caddy container via
            # this emptyDir (same volume, both containers in one pod).
            - name: caddy-admin-sock
              mountPath: /run/caddy
        {{- end }}
      {{- if .Values.mtls.enabled }}
      # /run/secrets PKI mount collides with SA-token at
      # /var/run/secrets/kubernetes.io/serviceaccount (since /var/run→/run).
      # Caddy doesn't talk to the K8s API, so dropping the SA token is fine.
      automountServiceAccountToken: false
      {{- end }}
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        # MUST-4 / v2.24.1: writable dir for the admin unix socket.
        # emptyDir is ephemeral and pod-local — socket is never shared.
        # Iris-F2 / LAURA-002 (LOW): memory-backed + bounded to match compose
        # tmpfs /run/caddy:size=1m,mode=0700. medium:Memory gives tmpfs
        # semantics (no host-disk writes); sizeLimit:1Mi caps runaway growth.
        - name: caddy-admin-sock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21): broker-owned
        # DYNAMIC MCP route directory — pod-local, RW ONLY for the
        # caddy-config-broker sidecar, RO for the caddy container. Memory-
        # backed + bounded, same posture as caddy-admin-sock above (small,
        # rendered-text-only content — never secret material).
        - name: caddy-agents-dynamic
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: caddyfile
          configMap:
            name: yashigani-caddy-config
        # S4 (P1 W3 Phase 2a): agent snippet directory.
        # Base ConfigMap is empty (no agents onboarded). Caddy logs a non-fatal
        # warning for the empty glob and continues normally. Populated by
        # ringfence-init onboarding flow as agents are added.
        - name: caddy-agents
          configMap:
            name: yashigani-caddy-agents
            defaultMode: 0444
        {{- if .Values.mtls.enabled }}
        - name: pki-certs
          secret:
            secretName: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
            defaultMode: 0440
            # YSG-RISK-053 (K8s parity with compose fix f7d792d5): items: scoping —
            # caddy gets its own mesh leaf + the two trust anchors the Caddyfile
            # references (ca_bundle for upstream verify, ca_intermediate for
            # client_auth). caddy_internal_hmac is consumed via the
            # CADDY_INTERNAL_HMAC env secretKeyRef (parse-time {$VAR} in the
            # Caddyfile), never the file. No other service's leaf key and no
            # bootstrap tokens are projected.
            items:
              - key: caddy_client.crt
                path: caddy_client.crt
              - key: caddy_client.key
                path: caddy_client.key
              - key: ca_bundle.crt
                path: ca_bundle.crt
              - key: ca_intermediate.crt
                path: ca_intermediate.crt
        {{- end }}
        {{- /* SEAM-1d-04: per-MCP SVID Secret volumes (parity with compose group_add model).
             Created by the approve transaction (mcp_onboard.py Phase 1c).
             defaultMode: 0440 + fsGroup: 1000 → Caddy reads key without world-readable (0444). */ -}}
        {{- range $key, $svid := .Values.mcpSvid }}
        - name: mcp-svid-{{ $key }}
          secret:
            secretName: {{ $svid.secretName }}
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: yashigani-caddy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  type: {{ .Values.caddy.service.type }}
  selector:
    app.kubernetes.io/name: yashigani-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.caddy.service.httpPort }}
      targetPort: 80
      protocol: TCP
    - name: https
      port: {{ .Values.caddy.service.port }}
      targetPort: 443
      protocol: TCP
{{- if and .Values.caddy.adminRelay.enabled .Values.mtls.enabled }}
---
# v4.1 SU-SEAM-1d-04: dedicated ClusterIP Service for the mesh-mTLS admin
# relay. DELIBERATELY separate from the yashigani-caddy Service above — that
# one is type LoadBalancer (public edge); putting :2019 on it would publish
# the admin relay on the external LB IP. This Service is ClusterIP-only, so
# the relay is reachable exclusively on the pod network. Defence-in-depth:
# ClusterIP-only → NetworkPolicy (backoffice pods only) → mTLS
# require_and_verify → backoffice SPIFFE URI pin → POST/DELETE /route only.
# The raw admin API remains unix-socket-only inside the caddy pod (MUST-4).
# backoffice dials https://yashigani-caddy-admin:2019/route
# (mcp_onboard._register_route_via_broker_relay, FINDING-V412-CADDYADMIN-002);
# the caddy leaf carries the yashigani-caddy-admin DNS SAN
# (service_identities.yaml) so hostname verification passes against the
# internal CA.
apiVersion: v1
kind: Service
metadata:
  name: yashigani-caddy-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: yashigani-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: admin-relay
      port: {{ .Values.caddy.adminRelay.port }}
      targetPort: {{ .Values.caddy.adminRelay.port }}
      protocol: TCP
{{- end }}
{{- end }}
