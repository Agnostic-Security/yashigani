{{- /* Last updated: 2026-05-27T00:00:00+00:00 */ -}}
{{- if .Values.gateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yashigani-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: yashigani-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yashigani-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.mtls.enabled }}
      annotations:
        # Trigger a rolling update of all cert-consuming workloads when the PKI
        # Secret changes (e.g. after helm upgrade rotates leaves under a new run
        # of the bootstrap Job).  lookup returns nil on fresh install (Secret not
        # yet created by the bootstrap Job hook); default "" prevents template
        # errors and the empty annotation is harmless on first deploy.
        checksum/pki-certs: {{ lookup "v1" "Secret" .Release.Namespace .Values.mtls.secretName | default dict | dig "metadata" "resourceVersion" "" | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yashigani.serviceAccountName" . }}
      # B14 (v2.25.0 P2 TOM-K8S-002): automountServiceAccountToken is conditional.
      # When poolManager.k8sBackend.enabled=true the gateway ServiceAccount token
      # must be mounted so pool/backend.py can call load_incluster_config() and
      # reach the K8s API server (CoreV1Api.create_namespaced_pod). When the k8s
      # backend is disabled the token is never consumed and mounting it is an
      # unnecessary attack surface — Checkov CKV_K8S_43 / ASVS V14.3.2.
      automountServiceAccountToken: {{ if .Values.poolManager.k8sBackend.enabled }}true{{ else }}false{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        # fsGroup triggers chgrp on Secret volumes so UID 1001 can read
        # /run/secrets/*. Without this, mode 0440 files stay root:root.
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.mtls.enabled }}
      # YSG-GW-SUBPATH-MOUNT fix (tier-tests-20260720, dispatch by Maxine, traced
      # by coordinator): the `secrets` volume used to be the mTLS Secret mounted
      # DIRECTLY (read-only, items-scoped) at /run/secrets. license_key and
      # mcp_identity_signing_key were then subPath-mounted from SEPARATE Secrets
      # on top of that same path. kubelet/containerd cannot create a subPath
      # mountpoint at a path that doesn't already exist as a real file/dir inside
      # a Secret-projected volume's symlink farm — every gateway pod with a
      # license configured (i.e. every real deployment) hit RunContainerError:
      # `error mounting ".../volume-subpaths/license/gateway/4" to rootfs at
      # "/run/secrets/license_key" ... not a directory`.
      # Fix: mirror backoffice.yaml's pattern exactly — `secrets` becomes a
      # writable emptyDir (Memory-backed), seeded by this initContainer copying
      # the items-scoped PKI Secret (+ license + MCP signing key, when present)
      # from read-only source mounts. subPath goes away entirely; every file
      # just lands in /secrets-rw via `cp -L`, so kubelet never needs a subPath
      # mountpoint inside a Secret volume. Items-scoping (YSG-RISK-053 K8s
      # parity) is preserved — only the same five PKI keys, plus license_key /
      # mcp_identity_signing_key when their features are enabled, are ever
      # projected into the gateway's /run/secrets tree.
      initContainers:
        - name: copy-pki-to-writable
          image: "{{ .Values.mtls.kubectlImage.repository }}:{{ .Values.mtls.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.mtls.kubectlImage.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp -L /pki-ro/* /secrets-rw/
              if [ -d /license-ro ]; then
                cp -L /license-ro/license_key /secrets-rw/
              fi
              if [ -d /mcp-signing-key-ro ]; then
                cp -L /mcp-signing-key-ro/mcp_identity_signing_key /secrets-rw/
              fi
              chmod 0400 /secrets-rw/*
          volumeMounts:
            - name: pki-ro
              mountPath: /pki-ro
              readOnly: true
            {{- if .Values.licensing.licenseKey }}
            - name: license-ro
              mountPath: /license-ro
              readOnly: true
            {{- end }}
            {{- if .Values.mtls.enabled }}
            # K8s parity fix (tier-tests-20260720): mount unconditionally
            # whenever the PKI plane is on — NOT gated on
            # agentBundles.filesystemMcp.enabled. The MCP JWT issuer wires on
            # every production gateway startup regardless of MCP bundle
            # config (registry.py build_registry_from_env — shared issuer
            # built whenever a durable_store is available), so the signing
            # key is a hard production requirement, not an MCP-bundle extra.
            - name: mcp-signing-key-ro
              mountPath: /mcp-signing-key-ro
              readOnly: true
            {{- end }}
            - name: secrets
              mountPath: /secrets-rw
      {{- end }}
      containers:
        - name: gateway
          image: "{{ include "yashigani.ownImage" (dict "registry" .Values.global.imageRegistry "owner" .Values.global.imageOwner "repo" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # BUG-2 (v2.23.4): internal mesh port — plain HTTP, data-network-only.
            # Open WebUI connects here; protected by K8s NetworkPolicy (no egress
            # to 8080 from open-webui; only 8081 allowed via allow-open-webui-egress).
            - name: http-mesh
              containerPort: 8081
              protocol: TCP
          env:
            # LIC-001: YASHIGANI_ENV is hardcoded to "production" to prevent
            # operators from disabling license integrity checks via --set.
            # Non-license uses of the environment label (telemetry, OTel
            # resource attributes) use YASHIGANI_ENVIRONMENT_LABEL instead,
            # which still reads from global.environment.
            - name: YASHIGANI_ENV
              value: "production"
            - name: YASHIGANI_ENVIRONMENT_LABEL
              value: {{ .Values.global.environment | quote }}
            - name: YASHIGANI_KMS_PROVIDER
              value: "docker"
            - name: YASHIGANI_SERVICE_NAME
              value: "gateway"
            {{- $gwEnv := .Values.gateway.env | default dict }}
            - name: YASHIGANI_UPSTREAM_URL
              value: {{ $gwEnv.upstreamUrl | quote }}
            - name: YASHIGANI_OPA_URL
              value: {{ $gwEnv.opaUrl | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ $gwEnv.ollamaUrl | quote }}
            - name: REDIS_HOST
              value: {{ $gwEnv.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ if .Values.mtls.enabled }}"6380"{{ else }}{{ $gwEnv.redisPort | quote }}{{ end }}
            # Budget Redis — separate instance, code default "budget-redis"
            # wouldn't resolve in-cluster. K8s service is yashigani-budget-redis.
            - name: BUDGET_REDIS_HOST
              value: "yashigani-budget-redis"
            - name: BUDGET_REDIS_PORT
              value: {{ if .Values.mtls.enabled }}"6380"{{ else }}"6379"{{ end }}
            {{- if .Values.mtls.enabled }}
            - name: REDIS_USE_TLS
              value: "true"
            - name: YASHIGANI_SERVICE_MANIFEST_PATH
              value: "/etc/yashigani/service_identities.yaml"
            - name: YASHIGANI_INTERNAL_CA_DIR
              value: "/run/secrets"
            # MI-6 (multi-instance / YSG-RISK-061): per-instance SPIFFE trust domain
            # for the app-layer validators. Default yashigani.internal (single
            # instance). Compose parity: x-common-env YASHIGANI_SPIFFE_TRUST_DOMAIN.
            - name: YASHIGANI_SPIFFE_TRUST_DOMAIN
              value: {{ .Values.global.spiffeTrustDomain | default "yashigani.internal" | quote }}
            {{- end }}
            - name: YASHIGANI_AGENT_ROUTING_ENABLED
              value: {{ $gwEnv.agentRoutingEnabled | quote }}
            - name: YASHIGANI_AGENT_PATH_PREFIX
              value: {{ $gwEnv.agentPathPrefix | quote }}
            - name: YASHIGANI_AGENT_TOKEN_MIN_LENGTH
              value: {{ $gwEnv.agentTokenMinLength | quote }}
            - name: YASHIGANI_DEPLOYMENT_STREAM
              value: {{ $gwEnv.deploymentStream | quote }}
            # --- Orchestration caps (build-sheet §9 — MF3 helm parity). Mirrors
            # docker-compose.yml x-gateway env exactly so Docker and K8s gateways
            # are config-equivalent. MAX_DEPTH=9 is the §0.1 9-level hop invariant.
            - name: YASHIGANI_ORCH_MAX_DEPTH
              value: {{ $gwEnv.orchMaxDepth | quote }}
            - name: YASHIGANI_ORCH_MAX_ITERS
              value: {{ $gwEnv.orchMaxIters | quote }}
            - name: YASHIGANI_ORCH_DEADLINE_S
              value: {{ $gwEnv.orchDeadlineS | quote }}
            - name: YASHIGANI_ORCH_MAX_FANOUT
              value: {{ $gwEnv.orchMaxFanout | quote }}
            # LAURA-ORCH-001(b): strict low budget for injection-originated
            # (tool-result justified) hops; over-budget result-steered hops are
            # refused (fail-closed).
            - name: YASHIGANI_ORCH_INJECTION_BUDGET
              value: {{ $gwEnv.orchInjectionBudget | quote }}
            # ORCH-PHASE2 (Design A, letta-as-brain): per-letta-turn HTTP timeout
            # (seconds). A letta agentic turn does multi-step reasoning + its own
            # gateway LLM call (~2 min on the 3B brain); must sit above per-turn
            # latency and below DEADLINE_S so the whole-loop deadline governs.
            - name: YASHIGANI_ORCH_LETTA_TURN_TIMEOUT_S
              value: {{ $gwEnv.orchLettaTurnTimeoutS | quote }}
            # SELFCALL_BASE — internal mesh self-call target (http-mesh port 8081,
            # same-pod loopback, internal bearer, NetworkPolicy-isolated).
            - name: YASHIGANI_ORCH_SELFCALL_BASE
              value: {{ $gwEnv.orchSelfcallBase | quote }}
            {{- /*
              Fix-6 (Captain): YASHIGANI_MCP_SERVERS — JSON array of onboarded MCP
              servers.  Read by build_registry_from_env() at gateway startup.
              Set gateway.mcpServers in values.yaml (default: empty list = no MCP).
              Example values.yaml entry:
                gateway:
                  mcpServers:
                    - agent_name: filesystem-mcp
                      upstream_url: http://filesystem-mcp:8000
                      tenant_id: acme
                      is_filesystem_agent: true
            */}}
            - name: YASHIGANI_MCP_SERVERS
              value: {{ .Values.gateway.mcpServers | default list | toJson | quote }}
            # Iris F-2: MCP broker OPA AsyncClient reads this CA path
            # (src/yashigani/mcp/_opa.py:_make_opa_http_client).  Without it on
            # K8s, OPA HTTPS verify falls through to system trust store and
            # every tools/call fails closed.  Companion to docker-compose.yml.
            - name: YASHIGANI_CA_CERT
              value: "/run/secrets/ca_root.crt"
            {{- if .Values.mtls.enabled }}
            # M-01 fix: mTLS OTLP endpoint (grpcs://). Gateway presents its
            # leaf cert. Python OTEL exporter goes through Python ssl —
            # Pattern A trust anchor (ca_root.crt) per gate #58a evidence.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "grpcs://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: "/run/secrets/ca_root.crt"
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: "/run/secrets/gateway_client.crt"
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: "/run/secrets/gateway_client.key"
            {{- else }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $gwEnv.otelEndpoint | quote }}
            {{- end }}
            - name: SKLEARN_MODEL_PATH
              value: {{ $gwEnv.sklearnModelPath | quote }}
            # YSG-RISK-076 / DP-Y-003 §3.4 — semantic-intent import classifier sidecar.
            # Default ON: every MCP tool import is screened by the Ollama-backed
            # semantic-intent classifier before operator approval (tool-poisoning /
            # day-one-poison close). Uses same OLLAMA_BASE_URL backend as PII classifier.
            # Set to "false" in values.yaml or via --set to disable.
            - name: YASHIGANI_SEMANTIC_INTENT_SIDECAR
              value: {{ .Values.gateway.semanticIntentSidecar | default "true" | quote }}
            # v4.1.2 fix (RESTART-013 MCP leg, Gap A / helm parity) — document-content
            # enforcement (doc-OPA data protection). Compose parity:
            # docker-compose.yml gateway env YASHIGANI_DOCUMENT_ENFORCEMENT_ENABLED /
            # YASHIGANI_DOCUMENT_MODEB_PROXY_ENABLED. Both default false (ships
            # dark); documents/proxy_modeb.is_modeb_proxy_active() requires BOTH
            # true before the MCP tool-call document bridge engages on the
            # gateway's hot egress path (deliberate double opt-in — see
            # values.yaml documentEnforcement block and proxy_modeb.py module
            # docstring). Previously absent from this template entirely, so the
            # RESTART-013 document pipeline was dead code on every Helm/K8s
            # install regardless of values.yaml documentEnforcement.enabled.
            - name: YASHIGANI_DOCUMENT_ENFORCEMENT_ENABLED
              value: {{ .Values.documentEnforcement.enabled | default false | quote }}
            - name: YASHIGANI_DOCUMENT_MODEB_PROXY_ENABLED
              value: {{ .Values.documentEnforcement.modeBProxyEnabled | default false | quote }}
            # FLAG-3 fix: per-instance /egress/eval LLM rate cap (EgressLimitEnforcer).
            # Compose parity: docker-compose.yml gateway env YASHIGANI_EGRESS_LIMIT_*.
            # mode: "cap" (default) deny+fail-closed; "monitor" meter-only, never deny.
            - name: YASHIGANI_EGRESS_LIMIT_MODE
              value: {{ .Values.gateway.egressLimitMode | default "cap" | quote }}
            - name: YASHIGANI_EGRESS_LIMIT_CALLS
              value: {{ .Values.gateway.egressLimitCalls | default "200" | quote }}
            - name: YASHIGANI_EGRESS_LIMIT_WINDOW_SECONDS
              value: {{ .Values.gateway.egressLimitWindowSeconds | default "60" | quote }}
            - name: YASHIGANI_SECRETS_DIR
              value: "/run/secrets"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecretName | default "yashigani-postgres-secrets" }}
                  key: postgres_password
            {{- if .Values.mtls.enabled }}
            # mTLS DSN — verify-ca + client cert, via pgbouncer.
            - name: YASHIGANI_DB_DSN
              # ca_bundle.crt: libpq (psycopg2) used by run_migrations() advisory
              # lock can't verify chain-bundle certs with ca_root.crt alone.
              # openssl error 20 "unable to get local issuer certificate".
              # ca_bundle.crt = ca_root.crt + ca_intermediate.crt concatenated.
              # Internal K8s gate finding.
              value: "postgresql://yashigani_app:$(POSTGRES_PASSWORD)@yashigani-pgbouncer:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/gateway_client.crt&sslkey=/run/secrets/gateway_client.key"
            - name: YASHIGANI_DB_DSN_DIRECT
              # Direct-to-postgres DSN, bypassing pgbouncer. Used by run_migrations()
              # advisory lock. pgbouncer transaction-pool routes each connection to
              # a different postgres backend — session-scoped pg_advisory_lock
              # cannot serialise across replicas via pgbouncer. Direct connection
              # puts both replicas on the same backend (internal K8s integration finding).
              # ca_bundle.crt: same libpq chain-verify fix as YASHIGANI_DB_DSN.
              value: "postgresql://yashigani_app:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/gateway_client.crt&sslkey=/run/secrets/gateway_client.key"
            # v2.25.2 (Lu wire-sink-gate P1): DDL / Alembic migrations run as the
            # admin superuser yashigani_admin (NOT the demoted runtime role
            # yashigani_app). run_migrations() prefers the admin DSNs; the runtime
            # asyncpg pool keeps YASHIGANI_DB_DSN (yashigani_app). Same cert +
            # password — boundary is role privilege. DDL goes direct to postgres.
            - name: YASHIGANI_DB_DSN_ADMIN
              value: "postgresql://yashigani_admin:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/gateway_client.crt&sslkey=/run/secrets/gateway_client.key"
            - name: YASHIGANI_DB_DSN_ADMIN_DIRECT
              value: "postgresql://yashigani_admin:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/gateway_client.crt&sslkey=/run/secrets/gateway_client.key"
            {{- else }}
            - name: YASHIGANI_DB_DSN
              value: "postgresql://yashigani_app:$(POSTGRES_PASSWORD)@yashigani-pgbouncer:5432/yashigani"
            - name: YASHIGANI_DB_DSN_ADMIN
              value: "postgresql://yashigani_admin:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani"
            - name: YASHIGANI_DB_DSN_ADMIN_DIRECT
              value: "postgresql://yashigani_admin:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani"
            {{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecretName | default "yashigani-redis-secrets" }}
                  key: redis_password
            {{- if .Values.mtls.enabled }}
            # EX-231-10 Layer B: gateway middleware reads CADDY_INTERNAL_HMAC at
            # lifespan startup and rejects requests without a matching
            # X-Caddy-Verified-Secret header → 401. Secret is in pki-certs.
            - name: CADDY_INTERNAL_HMAC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
                  key: caddy_internal_hmac
            {{- end }}
            # YSG-COMPOSE-ENV-001 Helm parity: gateway reads YASHIGANI_INTERNAL_BEARER
            # from env (os.environ.get) — must be injected via secretKeyRef, not only
            # present in yashigani-agent-bearer for agent-bundle shims.
            - name: YASHIGANI_INTERNAL_BEARER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalBearer.existingSecretName | default "yashigani-agent-bearer" }}
                  key: yashigani_internal_bearer
            {{- if .Values.fips.mode }}
            # Nico N-001 (v2.24.4): FIPS_MODE propagation.
            # Routes openssl dgst calls through the OpenSSL FIPS Provider.
            # REQUIRES a FIPS-configured base image (CMVP #4985) — default
            # python:3.14.0-slim does NOT contain the FIPS Provider. Do NOT
            # set fips.mode=true without swapping to a FIPS-configured image.
            - name: FIPS_MODE
              value: "1"
            {{- end }}
            {{- if .Values.auditLog.enabled }}
            # B7 fix (v2.25.0 P2): audit env vars injected for PVC-backed audit log.
            # SOC 2 CC7.2 / ISO 27001 A.8.15 / NIST AU-9/AU-11 / CMMC AU.L2-3.3.4/8/9 /
            # EU AI Act Art.12. Council finding B7: Lu P0-#3.
            - name: YASHIGANI_AUDIT_LOG_PATH
              value: {{ .Values.auditLog.logPath | quote }}
            - name: YASHIGANI_AUDIT_MAX_FILE_SIZE_MB
              value: {{ .Values.auditLog.maxFileSizeMB | quote }}
            - name: YASHIGANI_AUDIT_RETENTION_DAYS
              value: {{ .Values.auditLog.retentionDays | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.gateway.existingSecretName | default "yashigani-gateway-secrets" }}
          {{- if .Values.mtls.enabled }}
          # Startup probe: grants up to 30×10s = 5min for FastText + OTEL +
          # uvicorn TLS bind to come up before liveness starts. Cheap socket
          # connect (no TLS handshake) so we just confirm uvicorn is bound.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8080))"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import ssl,urllib.request;c=ssl.create_default_context(cafile='/run/secrets/ca_root.crt');c.load_cert_chain('/run/secrets/gateway_client.crt','/run/secrets/gateway_client.key');urllib.request.urlopen('https://localhost:8080/healthz',context=c)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import ssl,urllib.request;c=ssl.create_default_context(cafile='/run/secrets/ca_root.crt');c.load_cert_chain('/run/secrets/gateway_client.crt','/run/secrets/gateway_client.key');urllib.request.urlopen('https://localhost:8080/healthz',context=c)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          {{- else }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: varlog
              mountPath: /var/log/yashigani
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- if .Values.mtls.enabled }}
            - name: service-manifest
              mountPath: /etc/yashigani
              readOnly: true
            {{- end }}
            # YSG-GW-SUBPATH-MOUNT fix: license_key and mcp_identity_signing_key
            # are no longer subPath-mounted here — the copy-pki-to-writable
            # initContainer above copies both (when enabled) into the writable
            # `secrets` emptyDir alongside the PKI material, so both land at
            # /run/secrets/license_key and /run/secrets/mcp_identity_signing_key
            # (loader.py candidate 2 / _jwt.py YASHIGANI_MCP_SIGNING_KEY_PATH
            # default) via the single `secrets` volumeMount below — no subPath,
            # no "not a directory" mount failure.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        # B7 fix (v2.25.0 P2): replace emptyDir with PVC when auditLog.enabled.
        # emptyDir is wiped on pod restart — operator-visible audit log file sink
        # is lost. PVC persists across restarts for SOC 2 / ISO 27001 / NIST AU-9.
        # Council finding B7: Lu P0-#3.
        - name: varlog
          {{- if .Values.auditLog.enabled }}
          persistentVolumeClaim:
            claimName: yashigani-gateway-audit-log
          {{- else }}
          emptyDir:
            sizeLimit: 50Mi
          {{- end }}
        - name: secrets
          {{- if .Values.mtls.enabled }}
          # YSG-GW-SUBPATH-MOUNT fix: writable emptyDir now (was a direct Secret
          # mount) — seeded by the copy-pki-to-writable initContainer from
          # pki-ro/license-ro/mcp-signing-key-ro below. Memory-backed, matching
          # backoffice.yaml's equivalent /run/secrets emptyDir. The main
          # container still mounts this readOnly:true (readOnlyRootFilesystem
          # posture unchanged — gateway never writes to /run/secrets itself,
          # unlike backoffice which also writes bootstrap credentials here).
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
          {{- else }}
          emptyDir:
            sizeLimit: 10Mi
          {{- end }}
        {{- if .Values.mtls.enabled }}
        # Read-only source for the initContainer copy — the mTLS Secret,
        # items-scoped exactly as before (YSG-RISK-053 K8s parity unchanged).
        - name: pki-ro
          secret:
            secretName: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
            # 0440 + fsGroup: pod (1001) can read, others blocked.
            defaultMode: 0440
            # YSG-RISK-053 (K8s parity with compose fix f7d792d5): items: scoping —
            # gateway gets its own leaf + own bootstrap token + the two trust
            # anchors it uses (ca_root for Python ssl / OTLP / redis / OPA,
            # ca_bundle for libpq DSN chain verify). caddy_internal_hmac comes
            # via the CADDY_INTERNAL_HMAC env secretKeyRef, never the file.
            # No other service's leaf key or bootstrap token is projected.
            items:
              - key: gateway_client.crt
                path: gateway_client.crt
              - key: gateway_client.key
                path: gateway_client.key
              - key: gateway_bootstrap_token
                path: gateway_bootstrap_token
              - key: ca_root.crt
                path: ca_root.crt
              - key: ca_bundle.crt
                path: ca_bundle.crt
        - name: service-manifest
          configMap:
            name: yashigani-pki-manifest
        {{- end }}
        {{- if .Values.licensing.licenseKey }}
        # Petra P0-1 (v2.24.4): licence Secret volume — read-only source for the
        # initContainer copy (YSG-GW-SUBPATH-MOUNT fix; was subPath-mounted
        # directly at /run/secrets/license_key, which broke — see initContainer
        # comment above). items-scoped to the single key actually needed.
        - name: license-ro
          secret:
            secretName: yashigani-license
            defaultMode: 0440
            items:
              - key: license_key
                path: license_key
        {{- end }}
        {{- if .Values.mtls.enabled }}
        # K8s parity fix (tier-tests-20260720, supersedes K8s SB-2): standalone
        # MCP identity signing key volume — read-only source for the
        # initContainer copy (YSG-GW-SUBPATH-MOUNT fix; was subPath-mounted
        # directly, which broke — see initContainer comment above). Rendered
        # unconditionally whenever mtls.enabled (the PKI plane, which the
        # bootstrap Job also guards) — NOT gated on
        # agentBundles.filesystemMcp.enabled; see the initContainer mount
        # comment above for why. Defaults to the chart-managed Secret minted
        # by mtls-bootstrap-job.yaml (zero operator pre-creation); set
        # existingSecretName to override with an operator/KMS-synced Secret.
        - name: mcp-signing-key-ro
          secret:
            secretName: {{ .Values.gateway.mcpSigningKey.existingSecretName | default .Values.gateway.mcpSigningKey.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.gateway.mcpSigningKey.secretKey | quote }}
                path: mcp_identity_signing_key
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: yashigani-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: yashigani-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: 8080
      protocol: TCP
    # BUG-2 (v2.23.4): expose internal mesh port so open-webui service DNS resolves.
    - name: http-mesh
      port: 8081
      targetPort: 8081
      protocol: TCP
{{- end }}
