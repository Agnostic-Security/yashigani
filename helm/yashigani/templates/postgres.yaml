{{- if .Values.postgres.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yashigani-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  serviceName: yashigani-postgres
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: yashigani-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yashigani-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.mtls.enabled }}
      annotations:
        # Trigger rolling update when PKI Secret resourceVersion changes.
        # See gateway.yaml for full rationale.
        checksum/pki-certs: {{ lookup "v1" "Secret" .Release.Namespace .Values.mtls.secretName | default dict | dig "metadata" "resourceVersion" "" | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yashigani.serviceAccountName" . }}
      # /run/secrets mount collision — see redis.yaml note.
      automountServiceAccountToken: false
      securityContext:
        # FINDING-V412-K8S-PG-SSL (Captain, 2026-07-24): the postgres image is
        # now pgvector/pgvector:0.8.2-pg16 (Debian bookworm, HAS the openssl
        # CLI that 05-enable-ssl.sh's fail-closed chain-of-continuity check
        # requires — postgres:16-alpine does not ship openssl at all). This
        # image's postgres user is UID/GID 999 (Debian convention), NOT
        # Alpine's UID/GID 70. Compose already standardised on this same
        # image + digest (docker-compose.yml, "gate V232-SMOKE-018" comment)
        # with `user: "999:999"` for the identical reason: pgvector has no
        # USER directive (defaults to root at PID1), and cap_drop:[ALL]
        # strips CAP_SETUID/SETGID/FOWNER so the entrypoint's own gosu/setpriv
        # root→postgres privilege-drop dance fails ("Operation not
        # permitted"). Pinning runAsUser/runAsGroup/fsGroup to 999 here starts
        # the container AS uid 999 directly (K8s enforces this at container
        # creation, not via an in-container setuid step), matching compose.
        #
        # HISTORICAL (pre-2026-07-24, postgres:16-alpine/UID 70): mounted
        # Secret volumes (default mode 0440 root:fsGroup) combined with a
        # UID that didn't match the image's real "postgres" user caused
        # either Permission denied reads OR (when the values.release.yaml
        # override swapped in pgvector while this securityContext still said
        # 70) a real cross-UID chown attempt in 05-enable-ssl.sh
        # ("chown postgres:postgres" resolving to UID 999 while the running
        # process was UID 70) — requires CAP_CHOWN, which is dropped, so it
        # failed "Operation not permitted". Matching UID/GID exactly (this
        # fix) makes every chown in the script a same-UID no-op that needs no
        # capability at all; 05-enable-ssl.sh additionally removes the
        # explicit chown calls outright (see that file) as defense-in-depth
        # against any future image/UID drift regressing this class of bug.
        #
        # fsGroup: 999 chowns Secret + PVC volumes to GID 999 (postgres),
        # giving the postgres user read access via group membership without
        # broadening permissions beyond the pod.
        # YSG-RISK-008: runAsNonRoot enforced at K8s level. readOnlyRootFilesystem
        # is NOT set — postgres writes PGDATA (PVC), /var/run/postgresql
        # (socket), /tmp. Full ROFS would break initdb. Documented exception.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # NEW-K8S-POSTGRES-FSGROUP-SSLKEY-001 (found live during 4.1.2
        # k3s/Cilium e2e, 2026-07-28): default fsGroupChangePolicy is
        # "Always" — kubelet recursively re-chowns/re-chmods EVERY file on
        # EVERY volume (Secret AND the PGDATA PVC) on EVERY pod (re)start to
        # match fsGroup, which ADDS a group-read/write bit even to files
        # already owned by the matching UID:GID. server.key is written by
        # 05-enable-ssl.sh on first init with a strict chmod 0600 (required:
        # postgres refuses to start if a key file OWNED BY THE RUNNING
        # POSTGRES USER carries ANY group/other bits at all — stricter than
        # the "owned by root, group-read OK" case). On every restart with an
        # existing PGDATA (initdb.d scripts — including 05-enable-ssl.sh —
        # are skipped by the postgres entrypoint once the data dir is
        # non-empty, so nothing re-applies the 0600), the "Always" fsGroup
        # walk silently widens server.key's mode, and postgres then FATALs:
        # "private key file "server.key" has group or world access" —
        # database refuses to start at all, every restart, forever, until
        # PGDATA is wiped. Fix: fsGroupChangePolicy: OnRootMismatch — kubelet
        # skips the recursive walk once the volume root's group ownership
        # already matches fsGroup (true after the first start), so
        # server.key's mode set by 05-enable-ssl.sh is never touched again.
        fsGroupChangePolicy: OnRootMismatch
        # YSG-SECRETS-DIST-002 CLOSED: postgres_password delivered via secretKeyRef
        # env var in K8s. supplementalGroups: [2002] was vestigial (no file-read
        # path in K8s). Removed per Laura A1 amendment — GID 2002 narrowed to
        # langflow-only on Compose path; K8s never needed it.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # YSG-RISK-008: drop ALL capabilities. postgres:16-alpine does not
            # use setuid/setgid or raw sockets — only POSIX file I/O and TCP.
            # readOnlyRootFilesystem is NOT set (PGDATA + socket writes needed).
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "yashigani"
            # v2.25.2 (Lu wire-sink-gate P1): bootstrap superuser is the DDL/admin
            # identity yashigani_admin; runtime services connect as the demoted
            # NOSUPERUSER role yashigani_app (migration 0001/0015). Compose parity.
            - name: POSTGRES_USER
              value: "yashigani_admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecretName | default "yashigani-postgres-secrets" }}
                  key: postgres_password
            # Retro #3ao — point PGDATA at a subdirectory of the PV root.
            # local-path / many CSI drivers leave a non-empty PV root
            # (lost+found, .snapshot, mountpoint marker file). The postgres
            # entrypoint then sees a "non-empty data dir" and prints
            # "PostgreSQL Database directory appears to contain a database;
            # Skipping initialization" — but the dir doesn't actually contain
            # a database, so role yashigani_app is never created and every
            # consumer hits "role does not exist". Using a subdir we own
            # avoids the collision entirely.
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          {{- if .Values.mtls.enabled }}
          # mTLS mode: pg_hba.conf rewrites to hostssl+clientcert=verify-ca
          # for anything non-local, which pg_isready cannot satisfy without
          # cert flags. Hit the local unix socket instead (pg_hba keeps
          # `local all all trust` so the probe just checks the process is
          # accepting connections).
          #
          # Internal K8s integration evidence: without a startupProbe,
          # the liveness probe kicks in 70s after pod start. initdb + the
          # init scripts in /docker-entrypoint-initdb.d (including
          # 05-enable-ssl.sh which copies certs into PGDATA + appends ssl=on
          # to postgresql.conf) can take 60-90s on Docker Desktop K8s, so
          # liveness fires mid-init, K8s restarts the pod, second start sees
          # non-empty PGDATA -> init scripts skipped -> ssl=off ->
          # pgbouncer→postgres TLS handshake never establishes ->
          # backoffice CrashLoopBackOff. The startupProbe holds liveness +
          # readiness back until postgres has accepted at least one
          # connection, giving init scripts up to 300s to complete.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "/var/run/postgresql", "-U", "yashigani_admin", "-d", "yashigani"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "/var/run/postgresql", "-U", "yashigani_admin", "-d", "yashigani"]
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "/var/run/postgresql", "-U", "yashigani_admin", "-d", "yashigani"]
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- else }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "yashigani_admin", "-d", "yashigani"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "yashigani_admin", "-d", "yashigani"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.mtls.enabled }}
            - name: pki-certs
              mountPath: /run/secrets
              readOnly: true
            # YSG-RISK-049 (v2.24.0): mount pgbouncer_authenticator_password into
            # a SEPARATE directory /run/secrets/pgbouncer-auth/ to avoid the
            # containerd subPath overlap bug (BUG-NEW-002).
            # Background: mounting pki-certs to /run/secrets (a directory with ~80
            # files) and then using subPath to overlay a single file at
            # /run/secrets/pgbouncer_authenticator_password fails on k3s v1.35.5+
            # containerd 2.2.3: "not a directory" — containerd tries to use the
            # projected path as a bind-mount target but the parent dir is already
            # owned by the pki-certs volume. Fix: mount to a non-overlapping path.
            # 10-pgbouncer-auth.sh reads from /run/secrets/pgbouncer-auth/pgbouncer_authenticator_password.
            # fsGroup: 70 chowns the projected file to GID 70 (postgres GID).
            - name: pgbouncer-auth-secret
              mountPath: /run/secrets/pgbouncer-auth
              readOnly: true
            # Retro #3an — mount the WHOLE ConfigMap as a directory, not via
            # subPath. With subPath the postgres entrypoint occasionally sees
            # the wrong file mode (depending on CSI driver) and silently
            # skips the SSL init step, which is exactly what we hit on the
            # previous K8s gate (pg_hba.conf had zero hostssl rows). A full
            # directory mount keeps defaultMode honoured everywhere.
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: pki-certs
          secret:
            secretName: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
            defaultMode: 0440
            # YSG-RISK-053 (K8s parity with compose fix f7d792d5): items: scoping —
            # own leaf + CA public certs only (05-enable-ssl.sh builds the
            # ssl_ca_file from ca_root.crt + ca_intermediate.crt); no other leaf
            # keys / bootstrap tokens / caddy_internal_hmac.
            items:
              - key: postgres_client.crt
                path: postgres_client.crt
              - key: postgres_client.key
                path: postgres_client.key
              - key: ca_root.crt
                path: ca_root.crt
              - key: ca_intermediate.crt
                path: ca_intermediate.crt
              # FINDING-V412-RESTART-012 note: ca_root.attested_sha256 is
              # deliberately NOT in this items list. K8s has no equivalent of
              # install.sh's --pki-action=rotate-root ceremony yet, so root
              # rotation on K8s is unimplemented and 05-enable-ssl.sh's
              # YASHIGANI_PG_ATTEST_DIR (default /run/secrets-pki-attest) will
              # never resolve here — any future root-CHANGE on K8s fails
              # closed exactly as it did before this fix (REJECTED: no
              # attestation found), which is correct. If K8s root rotation is
              # ever built, mirror the docker/podman isolation: a dedicated
              # Secret/volume mounted ONLY into the postgres pod, never into
              # this pki-certs Secret (which backoffice/gateway also consume)
              # — do NOT add ca_root.attested_sha256 to a shared items list.
        # YSG-RISK-049: pgbouncer_authenticator_password for 10-pgbouncer-auth.sh init script.
        # Same secret as pgbouncer pod — auto-generated by secrets.yaml on first install,
        # preserved on upgrade via helm lookup. Operator-overridable via pgbouncer.authSecretName.
        - name: pgbouncer-auth-secret
          secret:
            secretName: {{ .Values.pgbouncer.authSecretName | default "yashigani-pgbouncer-auth-secret" }}
            defaultMode: 0440
        - name: init-scripts
          configMap:
            name: yashigani-postgres-init
            defaultMode: 0555
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: yashigani-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  clusterIP: None
  selector:
    app.kubernetes.io/name: yashigani-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
{{- end }}
