{{- /* Last updated: 2026-05-27T00:00:00+01:00 — fix(helm): add /api/v1/admin/* route — B4 — helm parity for /api/v1/admin/* backoffice route absent since v2.23.3 */ -}}
{{/* ConfigMaps for services that need mounted config files */}}

{{- if .Values.policy.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-policy-bundle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  # B6 fix (v2.25.0 P2): replace inline rego with .Files.Get references.
  # The prior inline blocks were a 144-line subset of the canonical policy files.
  # GAP-001: models_list_decision MISSING. GAP-002: catch-all sensitivity_rank
  # (rank=4 for unknown labels) MISSING. GAP-3/SEC-5: _effective_sensitivity_rank
  # MAX-rule MISSING. agent_response_allowed MISSING.
  # compose DENIES these inputs; K8s helm bundle silently ALLOWED them.
  # Fix: .Files.Get loads canonical policy/*.rego files at helm template time.
  # files/policy/*.rego are byte-identical copies of the canonical policy/*.rego,
  # enforced by sha256 in tests/contracts/test_helm_opa_bundle_parity.py — that
  # test asserts EVERY policy/*.rego is mirrored here AND mounted in policy.yaml,
  # and fails if a new policy file is added to policy/ but not to this bundle.
  # Council finding B6: Lu P0-#1.
  # LAURA-OPA-002 (v2.25.2): mcp.rego was absent from this list and from the
  # policy.yaml subPath mounts, so K8s OPA never loaded the MCP package — every
  # data.yashigani.mcp.* query was undefined -> broker fail-closed -> MCP broken
  # on K8s. Added below. The claimed parity test did not exist; it does now.
  yashigani.rego: |
{{ .Files.Get "files/policy/yashigani.rego" | indent 4 }}
  v1_routing.rego: |
{{ .Files.Get "files/policy/v1_routing.rego" | indent 4 }}
  rbac.rego: |
{{ .Files.Get "files/policy/rbac.rego" | indent 4 }}
  agents.rego: |
{{ .Files.Get "files/policy/agents.rego" | indent 4 }}
  mcp.rego: |
{{ .Files.Get "files/policy/mcp.rego" | indent 4 }}
  document.rego: |
{{ .Files.Get "files/policy/document.rego" | indent 4 }}
  clients_aggregate.rego: |
{{ .Files.Get "files/policy/clients_aggregate.rego" | indent 4 }}
  # LAURA-30-001 (2026-06-14): OPA management-API authorisation policy.
  # Loaded by OPA as package system.authz (--authorization=basic). Stored under
  # a flat ConfigMap key (system-authz.rego) and subPath-mounted at the path
  # OPA recurses at startup (/policies/system/authz.rego). The system/ subdir
  # is preserved in the mountPath so OPA loads it as data.system.authz
  # (package name must match directory path for OPA's bundle loader).
  system-authz.rego: |
{{ .Files.Get "files/policy/system/authz.rego" | indent 4 }}
{{- end }}

{{- if .Values.otelCollector.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-otel-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  otel-collector.yml: |
    # M-01 fix (2026-04-27): OTLP receivers upgraded to mTLS.
    # Trust anchor: ca_bundle.crt (root+intermediate). Go x509 (OTEL Collector)
    # verifies client certs (leaf+intermediate chain bundles) against the CA pool.
    # Internal K8s gate finding: using ca_bundle.crt for consistency with
    # all other Go/libssl consumers (pgbouncer, Caddy).
    {{- if .Values.mtls.enabled }}
    # mTLS enabled: receivers require client cert auth.
    {{- end }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            {{- if .Values.mtls.enabled }}
            tls:
              cert_file: /run/secrets/otel-collector_client.crt
              key_file: /run/secrets/otel-collector_client.key
              client_ca_file: /run/secrets/ca_bundle.crt
            {{- end }}
          http:
            endpoint: "0.0.0.0:4318"
            {{- if .Values.mtls.enabled }}
            tls:
              cert_file: /run/secrets/otel-collector_client.crt
              key_file: /run/secrets/otel-collector_client.key
              client_ca_file: /run/secrets/ca_bundle.crt
            {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlp/jaeger:
        # EX-231-09 fix (v2.23.2): switched from insecure: true to mTLS.
        # otel-collector presents its leaf cert; Jaeger verifies against
        # ca_bundle.crt (root+intermediate, K8s Go x509 pattern).
        endpoint: "yashigani-jaeger:4317"
        {{- if .Values.mtls.enabled }}
        tls:
          cert_file: /run/secrets/otel-collector_client.crt
          key_file: /run/secrets/otel-collector_client.key
          ca_file: /run/secrets/ca_bundle.crt
        {{- else }}
        tls:
          insecure: true
        {{- end }}
      # v2.23.3: otelcol-contrib 0.151.0 removed the 'loki' exporter type.
      # Loki 3.x accepts OTLP natively at /otlp/v1/logs — use otlphttp instead.
      # Resource attributes (service.name, deployment.environment) map to Loki
      # stream labels automatically via Loki 3.x OTLP label discovery.
      otlphttp/loki:
        endpoint: "https://yashigani-loki:3100"
        {{- if .Values.mtls.enabled }}
        tls:
          cert_file: /run/secrets/otel-collector_client.crt
          key_file:  /run/secrets/otel-collector_client.key
          ca_file:   /run/secrets/ca_intermediate.crt
        {{- end }}
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
{{- end }}

{{- if .Values.jaeger.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-jaeger-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  jaeger.yml: |
    # Jaeger v2 all-in-one configuration (K8s deployment).
    # Migrated from v1 env-var config to v2 YAML config (OpenTelemetry Collector format).
    # EX-231-09: OTLP gRPC collector port mTLS-enabled (Pattern B — Go x509).
    # CA: ca_bundle.crt (root+intermediate — K8s Go x509 convention).
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: basic
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        logs:
          level: info

    extensions:
      healthcheckv2:
        # use_v2: false is required. When use_v2: true, healthcheckv2 does NOT expose
        # HTTP routes — every path (including /health/status) returns 404 or no response.
        # use_v2: false enables the HTTP server on :13133 serving /health/status (JSON 200).
        # Su verified live: patched true→false, pod served health correctly. B-K8S-5 follow-up.
        use_v2: false
        http:
          endpoint: 0.0.0.0:13133

      jaeger_query:
        storage:
          traces: in_memory_storage

      jaeger_storage:
        backends:
          in_memory_storage:
            memory:
              max_traces: 100000

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            {{- if .Values.mtls.enabled }}
            tls:
              cert_file: /run/secrets/jaeger_client.crt
              key_file: /run/secrets/jaeger_client.key
              # Pattern B: ca_bundle.crt (root+intermediate) for Go x509 K8s consumers.
              client_ca_file: /run/secrets/ca_bundle.crt
            {{- end }}
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      jaeger_storage_exporter:
        trace_storage: in_memory_storage
{{- end }}

{{- if .Values.alertmanager.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
    receivers:
      - name: default
{{- end }}

{{- if .Values.loki.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  loki.yml: |
    # retro #84 (v2.23.2): mTLS enabled for Loki ingest + query paths.
    # Server cert: /run/secrets/loki_client.crt/key (PKI Secret).
    # Trust anchor: /run/secrets/ca_intermediate.crt (Pattern B).
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      {{- if .Values.mtls.enabled }}
      # retro #84: mTLS — Loki presents its leaf cert; clients must present
      # a cert signed by the internal intermediate CA (Pattern B).
      http_tls_config:
        cert_file: /run/secrets/loki_client.crt
        key_file:  /run/secrets/loki_client.key
        client_ca_file: /run/secrets/ca_intermediate.crt
        client_auth_type: RequireAndVerifyClientCert
      grpc_tls_config:
        cert_file: /run/secrets/loki_client.crt
        key_file:  /run/secrets/loki_client.key
        client_ca_file: /run/secrets/ca_intermediate.crt
        client_auth_type: RequireAndVerifyClientCert
      {{- end }}
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2020-10-24"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
{{- end }}

{{- if .Values.caddy.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-caddy-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
      local_certs
      # MUST-4 / v2.24.1: admin TCP :2019 removed — unix socket only.
      # Filesystem permissions are the auth gate. Liveness agent uses exec
      # probe via caddy CLI or curl --unix-socket; kubelet pod-IP probes use
      # the :80 /healthz listener below (unchanged). No TCP admin surface
      # exposed to any pod network or host port.
      # |0666: K8s emptyDir /run/caddy is caddy-pod-local (no backoffice unix-
      # socket sharing on K8s — separate pods; see SEAM-1d-04 / Phase-3 K8s
      # asymmetry). 0666 matches compose parity; contained to caddy pod only.
      # v4.1 SU-SEAM-1d-04: the MCP approve transaction reaches this socket
      # from the backoffice pod via the mesh-mTLS :2019 admin relay site block
      # below (POST /load only, backoffice SPIFFE URI only) — the raw admin
      # endpoint itself remains unix-socket-only per MUST-4.
      admin unix//run/caddy/admin.sock|0666
      servers {
        timeouts {
          read_body   10s
          read_header 5s
          write       30s
          idle        120s
        }
      }
    }
    # Retro #3al — explicit :80 listener so kubelet probes (which target
    # pod-IP, not the global tlsDomain) get a deterministic answer. Caddy's
    # admin TCP endpoint removed (MUST-4); unix socket is in-container only.
    # The :80 listener gives kubelet a cheap GET / -> 308 plus a
    # /healthz that returns 204 No Content for a tighter probe.
    :80 {
      handle /healthz {
        respond "" 204
      }
      handle {
        redir https://{host}{uri} permanent
      }
    }
    # ────────────────────────────────────────────────────────────────────────
    # Internal mTLS snippet — used by every reverse_proxy that targets a
    # service terminating mTLS (gateway:8080, backoffice:8443). Caddy
    # presents caddy_client.{crt,key} and verifies the upstream against
    # ca_bundle.crt (root+intermediate). Internal K8s gate finding:
    # Caddy Go TLS also fails to verify chain-bundle upstreams with only
    # ca_intermediate.crt as the trust anchor — x509: certificate signed by
    # unknown authority. ca_bundle.crt (root+intermediate) resolves this.
    # ────────────────────────────────────────────────────────────────────────
    {{- if .Values.mtls.enabled }}
    # K8s service names (yashigani-gateway / yashigani-backoffice) don't
    # match the cert SANs (gateway / backoffice — sourced from
    # service_identities.yaml). Override SNI via tls_server_name so the
    # handshake validates against the right SAN. Two snippets, one per
    # upstream, since Caddy snippets can't take parameters in v2.
    (internal-mtls-gateway) {
      transport http {
        tls
        tls_trust_pool file /run/secrets/ca_bundle.crt
        tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
        tls_server_name gateway
      }
    }
    (internal-mtls-backoffice) {
      transport http {
        tls
        tls_trust_pool file /run/secrets/ca_bundle.crt
        tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
        tls_server_name backoffice
      }
    }
    # 4.0 monitoring-proxy: mTLS snippets for Grafana and Loki.
    # K8s service names (yashigani-grafana / yashigani-loki) differ from cert
    # SANs (grafana / loki — sourced from service_identities.yaml); override SNI.
    (internal-mtls-grafana) {
      transport http {
        tls
        tls_trust_pool file /run/secrets/ca_bundle.crt
        tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
        tls_server_name grafana
      }
    }
    (internal-mtls-loki) {
      transport http {
        tls
        tls_trust_pool file /run/secrets/ca_bundle.crt
        tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
        tls_server_name loki
      }
    }
    {{- end }}
    # ────────────────────────────────────────────────────────────────────────
    # EX-231-10 Layer B — Caddy HMAC shared-secret marker.
    # Last updated: 2026-04-29T17:45:00+01:00
    #
    # caddy_internal_hmac is written by the mtls-bootstrap Job into the
    # yashigani-pki-certs Secret and mounted at /run/secrets/caddy_internal_hmac
    # in Caddy, gateway, and backoffice pods. Caddy reads it via the
    # CADDY_INTERNAL_HMAC env var (sourced from the K8s Secret via envFrom or
    # explicit env mapping in caddy.yaml). See compose-side design rationale in
    # docker/Caddyfile.selfsigned.
    # IMPORTANT: {$CADDY_INTERNAL_HMAC} is parse-time env substitution. Do NOT
    # use {env.CADDY_INTERNAL_HMAC} — request-time placeholder, not resolved in
    # header_up directives (Round 1 failure root cause, 2026-04-29).
    # ────────────────────────────────────────────────────────────────────────
    (inject-caddy-verified) {
      # Inject the per-install shared secret via parse-time env substitution.
      # NOTE: `header_up -X-Caddy-Verified-Secret` (delete) is intentionally
      # absent. In Caddy v2, header_up operations apply in order: set, then
      # delete — meaning delete runs AFTER set and removes the injected value.
      # `header_up X val` (without + prefix) is a SET operation that replaces
      # any existing client-supplied value, which is the correct behaviour.
      # Parity with docker/Caddyfile.selfsigned (lines 97-117) and
      # docker/Caddyfile.acme (lines 76-84). Bug introduced in Helm-only
      # Caddyfile during #58c — fixed at b85aad1 closure (2026-04-30).
      header_up X-Caddy-Verified-Secret {$CADDY_INTERNAL_HMAC}
    }
    # ────────────────────────────────────────────────────────────────────────
    # Strip orchestration-context headers at the public edge (LAURA/IRIS drift).
    # X-Yashigani-Orchestration-* carry the agent-orchestration identity context
    # (depth, principal, root-request-id) the gateway uses for model-RBAC. A real
    # external user proved they can FORGE X-Yashigani-Orchestration-Depth at the
    # public edge to bypass model-RBAC. These headers are LEGITIMATE only on the
    # internal mesh self-call path (gateway:8081), exactly like X-OpenWebUI-User-*.
    # Imported into EVERY public handle that reaches the gateway (direct or via
    # the OWUI catch-all). Single-source snippet = no per-handle drift.
    # CRITICAL: this MUST stay byte-parity with the docker/Caddyfile.* renders —
    # the un-patched render (esp. this K8s one) is where the bypass persists.
    # Pairs with Tom's gateway-side identity-gate (the two halves ship together).
    # ────────────────────────────────────────────────────────────────────────
    (strip-orchestration-headers) {
      request_header -X-Yashigani-Orchestration-Depth
      request_header -X-Yashigani-Orchestration-Principal
      request_header -X-Yashigani-Orchestration-Root-Request-Id
      # Defence-in-depth catch for any future X-Yashigani-Orchestration-* header.
      request_header -X-Yashigani-Orchestration-*
    }
    # ────────────────────────────────────────────────────────────────────────
    # Strip internal-trust headers at the public edge (T-1 belt-and-suspenders).
    # CRITICAL: MUST stay byte-parity with docker/Caddyfile.{selfsigned,ca,acme}.
    # Three classes of header MUST NOT arrive from external clients unchallenged:
    #   X-Yashigani-User-Id / X-Yashigani-Identity-Id — set by the trusted internal
    #     backoffice forwarder on the mesh path (gateway:8081).
    #   X-Caddy-Verified-Secret — set ONLY by Caddy (inject-caddy-verified) on every
    #     reverse_proxy upstream call (YSG-RISK-108 / EX-231-10 Layer B). Stripping
    #     here prevents an external client from forging the value before Caddy's
    #     `header_up set` overwrites it on the upstream call.
    # Applied at the public-site level inside :443 — no per-handle drift.
    # NOT applied on :8444/:8445 (internal-mesh listeners) where the trusted
    # forwarder legitimately sets these headers.
    # X-Yashigani-User-Id     — 3.x identity forward header
    # X-Yashigani-Identity-Id — 4.0 identity forward header (Tom's rename, 4.0 port)
    # ────────────────────────────────────────────────────────────────────────
    (strip-identity-headers) {
      request_header -X-Yashigani-User-Id
      request_header -X-Yashigani-Identity-Id
      # YSG-RISK-108 / EX-231-10 Layer B — strip any client-supplied Caddy secret.
      request_header -X-Caddy-Verified-Secret
    }
    # Bind on :443 (any Host) so port-forward / NodePort / IP-based tests
    # work regardless of how the cluster operator routes the public domain.
    # Internal K8s integration finding: use explicit PKI cert (caddy_client.crt/key)
    # instead of `tls internal`. Caddy's internal CA issued a cert bound to
    # 'localhost', causing HTTP 421 Misdirected Request for IP-based connections
    # (e.g. port-forward to 127.0.0.1). caddy_client.crt has IP Address:127.0.0.1
    # in its SANs (mtls-bootstrap Job generates it with that SAN via service_identities.yaml).
    :443 {
      {{- if .Values.mtls.enabled }}
      # Site-level mTLS (Caddy v2 requires `client_auth` at the server block,
      # not inside `handle`). `verify_if_given` accepts non-mTLS browser
      # connections AND extracts SPIFFE URI from a presented client cert when
      # one is given. Per-path SPIFFE forwarding stays in `handle` blocks.
      # Internal K8s integration evidence.
      # Explicit cert (not `tls internal`) — Caddy internal auto-cert
      # binds to 'localhost' only; our PKI cert has IP Address:127.0.0.1 SAN.
      tls /run/secrets/caddy_client.crt /run/secrets/caddy_client.key {
        # TLS 1.3 minimum + GCM-only ciphers. Project security baseline.
        # Closes QA finding. Consistent with docker/Caddyfile.acme.
        protocols tls1.3
        ciphers TLS_AES_256_GCM_SHA384 TLS_AES_128_GCM_SHA256
        curves x25519mlkem768 x25519 secp384r1 secp256r1
        client_auth {
          mode verify_if_given
          trust_pool file /run/secrets/ca_bundle.crt
        }
      }
      {{- else }}
      tls /run/secrets/caddy_client.crt /run/secrets/caddy_client.key {
        protocols tls1.3
        ciphers TLS_AES_256_GCM_SHA384 TLS_AES_128_GCM_SHA256
        curves x25519mlkem768 x25519 secp384r1 secp256r1
      }
      {{- end }}
      # X-Frame-Options scoped: monitoring embed paths (Grafana/Alertmanager) must
      # be iframeable from the admin shell (same origin). XFO: DENY on those
      # responses blocks the embed. CSP frame-ancestors 'self' (@lenient_subapp)
      # is the primary guard; this matcher ensures XFO is also absent on embed
      # paths for legacy browsers.
      @not_embed not path /admin/grafana/* /admin/alertmanager/*
      header @not_embed X-Frame-Options "DENY"
      header {
        X-Content-Type-Options    "nosniff"
        Referrer-Policy           "no-referrer"
        # CSP is set per-path below (NOT here) — a global SET would produce a
        # second CSP header when the per-path @redoc_ui override also fires.
        # LAURA-2255-006 / LAURA-30-009: double CSP header on /admin/api-redoc
        # and /redoc was caused by a global CSP here + @redoc_ui below both
        # setting the header. Fixed by moving all CSP to named-matcher directives.
        Cross-Origin-Opener-Policy "same-origin"
        -Server
      }
      # CSP matchers — strict-by-default (4.0 / RISK-102 / SC-NEW-001)
      # Source of truth: docker/Caddyfile.csp — Helm inlines an equivalent block
      # because ConfigMaps cannot import external files at runtime.
      # Parity enforced by scripts/check-caddyfile-csp-parity.sh.
      # Four matchers: @lenient_subapp @redoc_ui @strict_legacy @strict_tt
      # @lenient_ui catch-all REMOVED — new paths no longer silently inherit lenient.
      # /admin/loki/* added: Loki query API (JSON, no UI); excluded from @strict_legacy.
      @lenient_subapp path /admin/grafana/* /admin/wazuh/* /admin/prometheus/* /admin/loki/* /admin/alertmanager/*
      @redoc_ui path /admin/api-redoc /redoc
      @strict_legacy {
        path /admin/* /admin-legacy/ /admin-legacy/* /auth/* /me/* /dashboard/* /scim/* /api/v1/admin/* /static/* /login /login/* /docs /openapi.json
        not path /admin/ /admin4/
        not path /admin/grafana/* /admin/wazuh/* /admin/prometheus/* /admin/loki/* /admin/alertmanager/*
        not path /admin/api-redoc /redoc
      }
      @strict_tt path /admin/ /admin4/ /chat/* /user/* /flow/* /agents/* /builder/* /workflows/*
      # frame-src 'self': explicit (default-src 'self' already implies it);
      # admin pages iframe /admin/grafana/ and /admin/loki/ — same-origin.
      header @strict_legacy Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; report-uri /admin/csp-report; report-to default"
      header @strict_tt     Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types yashigani-render dompurify lit-html drawflow-label; report-uri /api/v1/csp-report; report-to default"
      # frame-ancestors 'self': admin-gated same-origin embeds (Grafana/Alertmanager
      # iframed from the admin shell). 'none' blocked the embed — fixed here.
      header @lenient_subapp Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'none'"
      header @redoc_ui      Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; report-uri /admin/csp-report; report-to default"
      # T-1 edge strip: remove any client-supplied identity-forwarding headers
      # before they reach any handle block (backoffice or gateway). Site-level
      # placement covers ALL paths — no per-handle drift. Internal mesh listeners
      # (:8444/:8445) are separate site blocks and are NOT affected.
      import strip-identity-headers
      handle /healthz {
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      # V10.3.5 sender-constrained tokens: client cert is verified at the
      # site-level `tls` block (above). Per-path: extract SPIFFE URI from the
      # validated peer cert and forward it as a header to the gateway.
      handle /v1/* {
        {{- if .Values.mtls.enabled }}
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID {http.request.tls.client.san.uris.0}
        {{- end }}
        # Track C (F-B) anti-spoof: strip any client-supplied forwarded-user
        # identity headers on the public /v1 path so an external caller cannot
        # impersonate an OWUI user. ONLY OWUI (internal, via gateway:8081) may
        # set these; the gateway honours them solely under the internal bearer.
        request_header -X-OpenWebUI-User-Email
        request_header -X-OpenWebUI-User-Id
        request_header -X-OpenWebUI-User-Name
        request_header -X-OpenWebUI-User-Role
        request_header -X-Forwarded-User
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /agents/* {
        {{- if .Values.mtls.enabled }}
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID {http.request.tls.client.san.uris.0}
        {{- end }}
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /mcp/* {
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      # Iris Seam 15 (PR #145): gateway:8080 serves GET /openapi.json and
      # GET /docs (Swagger UI). Without explicit handles these fell through
      # to the Open WebUI catch-all and were functionally unreachable.
      # N2 (2.25.5): /redoc added — ReDoc navigable API map, same auth gate.
      handle /openapi.json {
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /docs {
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /redoc {
        import strip-orchestration-headers
        reverse_proxy https://yashigani-gateway:8080 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-gateway
          {{- end }}
          import inject-caddy-verified
        }
      }
      # ── Grafana — admin-authenticated access via /admin/grafana/* ───────────
      # 4.0 monitoring-proxy: same-origin admin-gated proxy, handle (no strip)
      # + GF_SERVER_SERVE_FROM_SUB_PATH=true + GF_SERVER_ROOT_URL on Grafana side.
      # Wazuh not in Helm (compose-only — see values.yaml wazuh.enabled=false).
      {{- if .Values.grafana.enabled }}
      handle /admin/grafana/* {
        # Normalise misrouted asset requests (browser resolves relative refs against
        # dashboard path; strip spurious /d/<uid>/ prefix).
        @grafana_misroute path_regexp gmis ^/admin/grafana/d/(?:[^/]+/)*?((?:public|api|apis|avatar|d-solo|render)/.+)$
        rewrite @grafana_misroute /admin/grafana/{http.regexp.gmis.1}
        forward_auth https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
          uri /auth/verify-admin
          copy_headers X-Yashigani-Identity-Id  # 4.1 SEC-GAP-1 — identity rail
          @unauthorized status 401
          handle_response @unauthorized {
            redir * /admin/login?next=/admin/grafana/ 302
          }
        }
        reverse_proxy https://yashigani-grafana:3443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-grafana
          {{- end }}
          # Strip Grafana's own X-Frame-Options / CSP so the edge CSP governs
          # and same-origin iframe embedding from /admin/* works.
          header_down -X-Frame-Options
          header_down -Content-Security-Policy
        }
      }
      {{- end }}
      # ── Loki — admin-authenticated access via /admin/loki/* ─────────────────
      # Exposes Loki HTTP query API for direct admin use (primary: Grafana datasource).
      # Loki has no UI; @lenient_subapp CSP covers this path.
      {{- if .Values.loki.enabled }}
      handle /admin/loki/* {
        forward_auth https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
          uri /auth/verify-admin
          copy_headers X-Yashigani-Identity-Id  # 4.1 SEC-GAP-1 — identity rail
          @unauthorized status 401
          handle_response @unauthorized {
            redir * /admin/login 302
          }
        }
        reverse_proxy https://yashigani-loki:3100 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-loki
          {{- end }}
        }
      }
      {{- end }}
      # ── Alertmanager — admin-authenticated access via /admin/alertmanager/* ──
      # Alertmanager serves plain HTTP on port 9093 (no mTLS). forward_auth gate
      # mirrors the grafana/loki pattern (verify-admin). @lenient_subapp CSP
      # covers this path; X-Frame-Options + CSP stripped from upstream so same-
      # origin iframe embedding from /admin/ works.
      {{- if .Values.alertmanager.enabled }}
      handle_path /admin/alertmanager/* {
        forward_auth https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
          uri /auth/verify-admin
          copy_headers X-Yashigani-Identity-Id  # 4.1 SEC-GAP-1 — identity rail
          @unauthorized status 401
          handle_response @unauthorized {
            redir * /admin/login 302
          }
        }
        reverse_proxy http://alertmanager:9093 {
          header_down -X-Frame-Options
          header_down -Content-Security-Policy
        }
      }
      {{- end }}
      handle /admin/* {
        {{- if .Values.mtls.enabled }}
        # SIDE-001 (2026-05-19): inject Caddy's own SPIFFE identity on the
        # Caddy→backoffice leg so require_spiffe_id("/admin/agents") can verify
        # the caller.  Browser sessions arrive at Caddy without a client cert;
        # Caddy presents caddy_client.crt to backoffice via internal-mtls.
        # require_spiffe_id trusts x-spiffe-id when x-spiffe-id-peer-cert is
        # absent (uvicorn does not expose the ASGI TLS peer_cert extension).
        # MI-6: the per-instance "spiffe://<trust-domain>/caddy" matches the ACL
        # entry in service_identities.yaml endpoint_acls["/admin/agents"].
        # trust-domain = .Values.global.spiffeTrustDomain (default yashigani.internal).
        # Parity with docker/Caddyfile.{selfsigned,ca,acme} (commit 8a1dbf5).
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID "spiffe://{{ .Values.global.spiffeTrustDomain | default "yashigani.internal" }}/caddy"
        {{- end }}
        reverse_proxy https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
        }
      }
      # ── Admin API — /api/v1/admin/* (PKI, HIBP, secrets, WebAuthn) ─────────
      # B4 (v2.25.0 P2): absent from Helm Caddyfile since v2.23.3 when this
      # route was added to the compose Caddyfiles (Ava SWEEP-16 / ASVS V9.1 /
      # API5 BFLA). Without this block, Caddy returns 404 on all /api/v1/admin/*
      # requests on K8s; the open-webui catch-all cannot route API calls.
      # Parity with docker/Caddyfile.{selfsigned,ca,acme} line ~319/297/266.
      # SPIFFE injection: same pattern as /admin/* — Caddy injects its own
      # identity so require_spiffe_id() on backoffice can verify the caller.
      handle /api/v1/admin/* {
        {{- if .Values.mtls.enabled }}
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID "spiffe://{{ .Values.global.spiffeTrustDomain | default "yashigani.internal" }}/caddy"
        {{- end }}
        reverse_proxy https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /auth/* {
        reverse_proxy https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /me/* {
        reverse_proxy https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /static/* {
        reverse_proxy https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
        }
      }
      handle /login {
        reverse_proxy https://yashigani-backoffice:8443 {
          {{- if .Values.mtls.enabled }}
          import internal-mtls-backoffice
          {{- end }}
          import inject-caddy-verified
        }
      }
      {{- if .Values.agentBundles.openclaw.enabled }}
      # ── openclaw inbound webhooks — /webhooks/{slack,telegram} ─────────────
      # v4.1 Phase 1c (LAURA-I1-03 / FP-05). K8s render of the single-source
      # docker/Caddyfile.openclaw-webhooks (yashigani-* service names; see the
      # compose snippet for the full design rationale AND the
      # /auth/verify-webhook contract). Exact POST paths only; forward_auth
      # signature verify fails closed (any non-2xx from the verifier = deny);
      # replay dedupe + rate-limit live in the verifier; 1MB body cap;
      # /webhooks/* falls through to 404 — openclaw's wider :18789 surface is
      # never published.
      handle /webhooks/slack {
        route {
          @not_post not method POST
          respond @not_post "Method Not Allowed" 405
          request_body {
            max_size 1MB
          }
          forward_auth https://yashigani-backoffice:8443 {
            {{- if .Values.mtls.enabled }}
            import internal-mtls-backoffice
            {{- end }}
            import inject-caddy-verified
            uri /auth/verify-webhook?provider=slack
          }
          reverse_proxy http://yashigani-openclaw:18789 {
            header_up X-Forwarded-Proto https
            header_up X-Real-IP {remote_host}
          }
        }
      }
      handle /webhooks/telegram {
        route {
          @not_post not method POST
          respond @not_post "Method Not Allowed" 405
          request_body {
            max_size 1MB
          }
          forward_auth https://yashigani-backoffice:8443 {
            {{- if .Values.mtls.enabled }}
            import internal-mtls-backoffice
            {{- end }}
            import inject-caddy-verified
            uri /auth/verify-webhook?provider=telegram
          }
          reverse_proxy http://yashigani-openclaw:18789 {
            header_up X-Forwarded-Proto https
            header_up X-Real-IP {remote_host}
          }
        }
      }
      handle /webhooks/* {
        respond "Not Found" 404
      }
      {{- end }}
      # ── 4.0 catch-all — ui4 portal redirect + backoffice proxy ─────────────
      # OWUI removed in 4.0. / → /chat; unmatched paths → backoffice (ui4).
      # Backoffice owns its own session auth — no forward_auth needed here.
      # Mirrors docker/Caddyfile.{selfsigned,ca,acme} catch-all handle block.
      handle {
        import strip-orchestration-headers
        @root_path path /
        handle @root_path {
          redir * /chat 302
        }
        handle {
          reverse_proxy https://yashigani-backoffice:8443 {
            {{- if .Values.mtls.enabled }}
            import internal-mtls-backoffice
            {{- end }}
            import inject-caddy-verified
            header_up X-Forwarded-Proto https
            header_up X-Real-IP {remote_host}
          }
        }
      }
    }
    {{- if .Values.caddy.internalMetricsListener.enabled }}
    # ────────────────────────────────────────────────────────────────────────
    # EX-231-08 (+ #81) — SPIFFE-gated internal observability listeners.
    # Last updated: 2026-04-24T13:47:12+01:00
    # See docker/Caddyfile.acme for the full comment block.
    # Requires ca_intermediate.crt + caddy_client.{crt,key} mounted at /run/secrets.
    #
    # NOTE (retro #81-b): this Helm ConfigMap hand-codes a stripped Caddyfile
    # that is deliberately NOT full-parity with docker/Caddyfile.acme. Full
    # parity is a separate v2.23.2 work item (#76) — do not merge the two
    # files until that item lands.
    #
    # Split-listener design (was: single :8444 with Host-header matcher):
    #   :8444 -> yashigani-gateway:8080
    #   :8445 -> yashigani-backoffice:8443
    # Prometheus v3.x rejects setting Host via http_headers, so each upstream
    # gets its own port. Both listeners enforce the identical SPIFFE URI gate.
    # ────────────────────────────────────────────────────────────────────────
    :{{ .Values.caddy.internalMetricsListener.port }} {
      tls /run/secrets/caddy_client.crt /run/secrets/caddy_client.key {
        client_auth {
          mode require_and_verify
          trust_pool file /run/secrets/ca_bundle.crt
        }
        protocols tls1.3
        ciphers TLS_AES_256_GCM_SHA384 TLS_AES_128_GCM_SHA256
        curves x25519mlkem768 x25519 secp384r1 secp256r1
      }
      @metrics path /internal/metrics
      handle @metrics {
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID {http.request.tls.client.san.uris.0}
        reverse_proxy https://yashigani-gateway:8080 {
          transport http {
            tls
            tls_trust_pool file /run/secrets/ca_bundle.crt
            tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
            tls_server_name gateway
          }
          import inject-caddy-verified
        }
      }
      handle {
        respond "Not Found" 404
      }
    }
    {{- end }}
    {{- if .Values.caddy.internalMetricsListenerBackoffice.enabled }}
    # Parallel listener for the backoffice upstream — identical SPIFFE gate,
    # identical strip-before-set header discipline. #81 split-listener design.
    :{{ .Values.caddy.internalMetricsListenerBackoffice.port }} {
      tls /run/secrets/caddy_client.crt /run/secrets/caddy_client.key {
        client_auth {
          mode require_and_verify
          trust_pool file /run/secrets/ca_bundle.crt
        }
        protocols tls1.3
        ciphers TLS_AES_256_GCM_SHA384 TLS_AES_128_GCM_SHA256
        curves x25519mlkem768 x25519 secp384r1 secp256r1
      }
      @metrics path /internal/metrics
      handle @metrics {
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID {http.request.tls.client.san.uris.0}
        reverse_proxy https://yashigani-backoffice:8443 {
          transport http {
            tls
            tls_trust_pool file /run/secrets/ca_bundle.crt
            tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
            tls_server_name backoffice
          }
          import inject-caddy-verified
        }
      }
      handle {
        respond "Not Found" 404
      }
    }
    {{- end }}
    {{- if and .Values.caddy.adminRelay.enabled .Values.mtls.enabled }}
    # ─────────────────────────────────────────────────────────────────────────
    # v4.1 SU-SEAM-1d-04 (Su, ebe5f141) — mesh-mTLS caddy admin relay (:2019).
    # K8s-only route-registration path for the MCP approve transaction
    # (mcp_onboard.register_mcp_route / _register_route_via_broker_relay).
    # On compose runtimes backoffice reaches caddy-config-broker over a
    # dedicated unix socket; on K8s caddy and backoffice are SEPARATE PODS —
    # a unix socket cannot span pods (emptyDir is pod-local; same-node
    # co-location / RWX PVC is not the arch).
    #
    # MUST-4 compatibility: this does NOT re-expose the raw admin TCP endpoint.
    # The admin API itself stays bound to the caddy-pod-local unix socket
    # (global options above), reachable ONLY by the co-located
    # caddy-config-broker sidecar. This is an ordinary Caddy HTTPS site block
    # that:
    #   1. terminates mesh mTLS — client_auth require_and_verify against the
    #      internal CA bundle.  Identity-less clients are refused at the TLS
    #      handshake, before any HTTP surface exists.
    #   2. admits ONLY POST/DELETE /route AND ONLY the backoffice SPIFFE URI.
    #      The verified client-cert URI SAN is stamped into
    #      X-Yashigani-Verified-Spiffe (bare SET — replaces any client-sent
    #      value; same discipline as the :8444/:8445 X-SPIFFE-ID stamp) and
    #      matched with an exact `header` matcher.  Deliberately NOT a CEL
    #      `expression` on the SAN placeholder: caddy 2.11.x cannot convert
    #      the *url.URL placeholder value to CEL ("unsupported conversion to
    #      ref.Val: (*url.URL)") and 500s EVERY request through the matcher —
    #      proven live 2026-07-06 (SU-SEAM-1d-04 verification; the :18790
    #      @caller_not_openclaw expression shares this defect — flagged
    #      separately; fail-closed there since != that errors never admits).
    #      Every other method/path/identity gets 403.  No /config, /stop,
    #      /pki, /load, or other raw admin routes are ever proxied — /route
    #      is the ONLY surface backoffice can reach.
    #   3. proxies to the caddy-config-broker sidecar (loopback, same pod).
    # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21) REWORK: this relay
    # used to proxy a raw POST /load body (the entire monolith Caddyfile,
    # backoffice-reread-and-reposted) to the broker for CONTENT validation
    # against a startup-computed baseline (FINDING-V412-CADDYADMIN-001 R1
    # fix). Laura's final re-attack proved the compose twin of that design
    # FAILED live under the real no-new-privileges security context
    # (BLOCKER-A: the broker's own `caddy adapt` EPERM'd — every legitimate
    # reload 502'd; see docker/caddy/config_broker.py module docstring). The
    # corrected contract eliminates the raw-body path entirely: backoffice
    # now sends narrow typed DATA (tenant_id/server_id/mesh_port/shim_port)
    # to POST/DELETE /route; the broker independently re-validates every
    # field, renders the MCP-front wrap from its OWN fixed template (never
    # backoffice-supplied text), and writes it into a pod-local emptyDir
    # Caddy imports (see caddy.yaml caddy-agents-dynamic volume) — R1 is
    # closed by construction (no code path from backoffice-controlled input
    # to arbitrary Caddy directives), not by content-filtering a body that
    # no longer exists.
    # Defence-in-depth stack: NetworkPolicy (backoffice pods only) → mesh mTLS
    # (require_and_verify) → SPIFFE URI pin (backoffice leaf only) → method+
    # path pin (POST/DELETE /route only) → broker field-level validation.
    # ─────────────────────────────────────────────────────────────────────────
    :{{ .Values.caddy.adminRelay.port }} {
      tls /run/secrets/caddy_client.crt /run/secrets/caddy_client.key {
        client_auth {
          mode require_and_verify
          trust_pool file /run/secrets/ca_bundle.crt
        }
        protocols tls1.3
        ciphers TLS_AES_256_GCM_SHA384 TLS_AES_128_GCM_SHA256
        curves x25519mlkem768 x25519 secp384r1 secp256r1
      }
      # Stamp the VERIFIED client-cert URI SAN. Bare SET (no + prefix)
      # replaces any client-supplied value — a client cannot forge this
      # header past the stamp (see inject-caddy-verified rationale above).
      # request_header runs before handle in Caddy's directive order, so the
      # header matcher below sees the stamped value.
      request_header X-Yashigani-Verified-Spiffe {http.request.tls.client.san.uris.0}
      @backoffice_route {
        method POST DELETE
        path /route
        header X-Yashigani-Verified-Spiffe "spiffe://{{ .Values.global.spiffeTrustDomain | default "yashigani.internal" }}/backoffice"
      }
      handle @backoffice_route {
        reverse_proxy 127.0.0.1:{{ .Values.caddy.configBroker.port }} {
          # Don't leak the mesh-identity stamp into the broker path.
          header_up -X-Yashigani-Verified-Spiffe
        }
      }
      handle {
        respond "Forbidden" 403
      }
    }
    {{- end }}
    {{- if .Values.ollama.enabled }}
    # ─────────────────────────────────────────────────────────────────────────
    # v4.1 Phase 1b-ii (LAURA-I1-01) — Ollama inference-plane mesh front (:11435)
    # K8s parity for docker/Caddyfile.ollama-front. Per retro #81-b this Helm
    # ConfigMap Caddyfile is a hand-coded K8s variant (yashigani-ollama service
    # name, ca_bundle.crt trust anchor) — the compose snippet is the design
    # single-source; this block is the K8s render of the same front.
    #
    # WHY: Ollama's :11434 must be reachable ONLY through a mesh-mTLS Caddy front.
    # The K8s NetworkPolicy (allow-ollama-ingress) is flipped to admit ONLY the
    # Caddy pod on :11434 — the gateway/backoffice reach Ollama exclusively via
    # this listener presenting their mesh leaf. Closes the LAURA-I1-01 L3 bypass.
    # ─────────────────────────────────────────────────────────────────────────
    :11435 {
      tls /run/secrets/caddy_client.crt /run/secrets/caddy_client.key {
        client_auth {
          mode require_and_verify
          trust_pool file /run/secrets/ca_bundle.crt
        }
        protocols tls1.3
        ciphers TLS_AES_256_GCM_SHA384 TLS_AES_128_GCM_SHA256
        curves x25519mlkem768 x25519 secp384r1 secp256r1
      }
      handle_path /ollama/* {
        request_header -X-SPIFFE-ID
        request_header X-SPIFFE-ID {http.request.tls.client.san.uris.0}
        # Ollama has no TLS (mtls_capable:false) — plain HTTP upstream. The
        # identity boundary is the mesh mTLS Caddy verifies above.
        reverse_proxy http://yashigani-ollama:11434 {
          header_up X-Forwarded-Proto https
          header_up X-Real-IP {remote_host}
          # Rewrite Host to localhost — ollama's checkHostMiddleware accepts
          # "localhost" universally. K8s parity with docker/Caddyfile.ollama-front.
          header_up Host "localhost"
          transport http {
            read_timeout 300s
            write_timeout 300s
          }
        }
      }
      handle {
        respond "Not Found" 404
      }
    }
    {{- end }}
    {{- if .Values.agentBundles.openclaw.enabled }}
    # ─────────────────────────────────────────────────────────────────────────
    # v4.1 Phase 1c (LAURA-I1-03) — openclaw egress gateway (:18790)
    # SINGLE-SOURCE RENDER (v4.1 unified-sidecar must-fix #9, Captain C5).
    # The listener is loaded via .Files.Get from the byte-identical mirror
    #   helm/yashigani/files/Caddyfile.openclaw-egress
    # of the CANONICAL docker/Caddyfile.openclaw-egress (full Laura threat-model
    # rationale FP-01..FP-07 lives there).  Mirror maintained by
    #   scripts/sync-caddyfile-egress-helm.sh
    # Drift gate: tests/contracts/test_openclaw_egress_single_source.py
    # (byte parity + no-reinlined-copy + caddy adapt/validate on THIS rendered
    # ConfigMap).  DO NOT hand-edit routes here — edit the canonical file.
    #
    # The ONLY K8s deltas are the four documented `replace` substitutions below
    # plus this (internal-mtls) snippet shim: compose defines the snippet in
    # the Caddyfile.{selfsigned,ca,acme} monoliths with the ca_intermediate.crt
    # anchor; K8s uses the full-chain ca_bundle.crt.  versions 1.1 matches
    # compose (R4: Caddy v2.11.x drops header_up-set headers on h2 upstream
    # connections — the X-SPIFFE-ID stamp would be lost).
    #
    # HONEST ASYMMETRY vs compose: K8s NetworkPolicy cannot FQDN-pin Caddy's
    # own outbound (yashigani-caddy-acme-egress already grants public :443);
    # compose adds a per-IP iptables mirror in caddy-entrypoint.sh. On K8s the
    # fixed upstreams in the rendered block are the destination control.
    # Reachability to :18790 is scoped to openclaw pods by allow-caddy-ingress
    # (networkpolicy.yaml) — the K8s equivalent of the compose
    # openclaw_ringfence 2-member bridge.
    # ─────────────────────────────────────────────────────────────────────────
    (internal-mtls) {
      transport http {
        tls
        tls_trust_pool file /run/secrets/ca_bundle.crt
        tls_client_auth /run/secrets/caddy_client.crt /run/secrets/caddy_client.key
        versions 1.1
      }
    }
    {{- $egressTd := .Values.global.spiffeTrustDomain | default "yashigani.internal" }}
    {{- $egressTgBotId := .Values.agentBundles.openclaw.telegramBotId | default "" }}
    {{- $egress := .Files.Get "files/Caddyfile.openclaw-egress" }}
    {{- if not $egress }}
    {{- fail "helm/yashigani/files/Caddyfile.openclaw-egress is missing — run scripts/sync-caddyfile-egress-helm.sh (single-source mirror of docker/Caddyfile.openclaw-egress)" }}
    {{- end }}
    {{- /* Delta 1: K8s Service name — compose service `gateway` → `yashigani-gateway`. */}}
    {{- $egress = $egress | replace "https://gateway:8080" "https://yashigani-gateway:8080" }}
    {{- /* Delta 2: K8s trust anchor is the full-chain bundle. */}}
    {{- $egress = $egress | replace "/run/secrets/ca_intermediate.crt" "/run/secrets/ca_bundle.crt" }}
    {{- /* Delta 3: SPIFFE trust domain — compose composes it via parse-time env; K8s templates it. */}}
    {{- $egress = $egress | replace "spiffe://yashigani.internal/" (printf "spiffe://%s/" $egressTd) }}
    {{- /* Delta 4: telegram bot-ID pin default from values (a pod env var still wins if set). */}}
    {{- if $egressTgBotId }}
    {{- $egress = $egress | replace "{$YASHIGANI_OPENCLAW_TELEGRAM_BOT_ID:}" (printf "{$YASHIGANI_OPENCLAW_TELEGRAM_BOT_ID:%s}" $egressTgBotId) }}
    {{- end }}
    {{- $egress | nindent 4 }}
    {{- end }}
    # ─────────────────────────────────────────────────────────────────────────
    # S4 — Agent import sentinel (P1 W3 Phase 2a)
    # Last updated: 2026-05-29T00:00:00+00:00
    #
    # DESIGN: onboarded-agent Caddyfile snippets are generated by the
    # ringfence-init codegen engine and mounted from the yashigani-caddy-agents
    # ConfigMap at /etc/caddy/agents/<agent>.caddy in the Caddy pod. Each
    # snippet is a top-level `:443 { handle_path ... }` site block. Caddy
    # merges multiple `:443` blocks at parse time — agent routes are appended
    # after the base routes defined above, so they never shadow base handles.
    #
    # IDEMPOTENCY: Caddy `import` with a wildcard glob is idempotent — if the
    # directory contains no .caddy files (no agents onboarded yet), Caddy logs
    # a warning and continues normally.
    #
    # NEVER regenerate the Caddyfile monolith — agent routes live in snippets.
    # ─────────────────────────────────────────────────────────────────────────
    import /etc/caddy/agents/*.caddy

    # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21) — broker-owned
    # DYNAMIC MCP route directory. The static agents/ import above is
    # ConfigMap-mounted (Helm/kubectl-managed only — R2 has NO K8s equivalent,
    # zero chart RBAC rules grant any workload ServiceAccount configmaps
    # access). MCP wrap routes registered by the live approve-transaction
    # (mcp_onboard.py, via the :2019 relay above) are rendered and written
    # EXCLUSIVELY by the caddy-config-broker sidecar into a pod-local emptyDir
    # (caddy.yaml caddy-agents-dynamic volume) — RW only for the broker
    # sidecar, RO for the caddy container, never reachable from any other pod
    # (backoffice included).
    import /etc/caddy/agents-dynamic/*.caddy
{{- end }}

{{/*
── Partition maintenance script ConfigMap ──────────────────────────────────────
  The partition_maintenance.py script is NOT baked into the gateway image
  (only the gateway service entrypoint lives there). Mount it via ConfigMap so
  the CronJob can invoke it without requiring an image rebuild.
  See: partition-cronjob.yaml for mount and command usage.
  Finding D regression fix 2026-05-01.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yashigani.fullname" . }}-partition-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-maintenance
data:
  partition_maintenance.py: |
    #!/usr/bin/env python3
    """
    Yashigani DB Partition Maintenance
    ====================================
    Ensures the current month + next `months_ahead` months of audit_events and
    inference_events partitions exist.

    Safe to run repeatedly — CREATE TABLE IF NOT EXISTS semantics.
    Called from pg_cron or the Kubernetes CronJob on the 1st of each month at 00:05 UTC.

    Usage:
        DATABASE_URL=postgresql://user:pass@host/db python scripts/partition_maintenance.py
        python scripts/partition_maintenance.py --months-ahead 6

    Last updated: 2026-05-01T23:47:00+01:00
    mTLS fix: extract sslrootcert/sslcert/sslkey from DSN, build ssl.SSLContext
    for asyncpg (asyncpg does not parse libpq ssl params from DSN query string).
    """
    from __future__ import annotations

    import argparse
    import asyncio
    import logging
    import os
    import re
    import ssl
    import sys
    from datetime import date
    from urllib.parse import urlparse, parse_qs, urlencode, urlunparse

    logger = logging.getLogger(__name__)

    # Identifier quoting: only allow identifiers that are safe ASCII alphanumeric +
    # underscore, matching the naming convention enforced by _PARTITIONED_TABLES and
    # _partition_name().  This is a defence-in-depth guard — asyncpg DDL params
    # bind date literals; we use safe quoting for the identifier tokens.
    _SAFE_IDENT_RE = re.compile(r"^[a-zA-Z_][a-zA-Z0-9_]*$")


    def _quote_ident(name: str) -> str:
        """Quote a PostgreSQL identifier safely."""
        if not _SAFE_IDENT_RE.match(name):
            raise ValueError(
                f"Identifier {name!r} contains characters outside [a-zA-Z0-9_] "
                "and cannot be safely quoted — possible injection attempt."
            )
        escaped = name.replace('"', '""')
        return f'"{escaped}"'


    _PARTITIONED_TABLES = ["audit_events", "inference_events"]


    def _partition_range(year: int, month: int) -> tuple[date, date]:
        """Return (start_inclusive, end_exclusive) for a monthly partition."""
        start = date(year, month, 1)
        if month == 12:
            end = date(year + 1, 1, 1)
        else:
            end = date(year, month + 1, 1)
        return start, end


    def _partition_name(table: str, year: int, month: int) -> str:
        return f"{table}_{year}_{month:02d}"


    def _build_ssl_context(dsn: str) -> tuple[str, ssl.SSLContext | None]:
        """Extract libpq SSL params from DSN query string, build ssl.SSLContext.

        asyncpg does not parse sslrootcert/sslcert/sslkey from the DSN query
        string — it expects an ssl.SSLContext object or the string 'require'.
        This helper pulls the params out and returns a clean DSN + context.

        F-V232-002 (V14.4.1): sslmode=require (no server-cert validation)
        is intentionally unsupported.  Only verify-ca and verify-full are
        accepted.  Any other sslmode causes a hard failure so that
        misconfigured DSNs are caught at startup rather than silently
        bypassing TLS certificate validation.
        """
        parsed = urlparse(dsn)
        params = parse_qs(parsed.query, keep_blank_values=True)
        sslmode = params.pop("sslmode", [None])[0]
        sslrootcert = params.pop("sslrootcert", [None])[0]
        sslcert = params.pop("sslcert", [None])[0]
        sslkey = params.pop("sslkey", [None])[0]

        # Rebuild DSN without the extracted params
        new_query = urlencode({k: v[0] for k, v in params.items()})
        clean_dsn = urlunparse(parsed._replace(query=new_query))

        if sslmode is None or sslmode == "disable":
            return clean_dsn, None

        if sslmode not in ("verify-ca", "verify-full"):
            raise ValueError(
                f"F-V232-002: sslmode='{sslmode}' is not permitted. "
                "Only verify-ca and verify-full are accepted — sslmode=require "
                "disables server certificate validation and is a security "
                "violation per V14.4.1. Update the DSN to use sslmode=verify-ca."
            )

        ctx = ssl.create_default_context(cafile=sslrootcert)
        if sslcert and sslkey:
            ctx.load_cert_chain(certfile=sslcert, keyfile=sslkey)
        # verify-ca: validate cert against CA but skip hostname check
        # (hostname is validated at the mTLS/SPIFFE layer).
        # verify-full: validate cert AND hostname (used for external postgres).
        if sslmode == "verify-ca":
            ctx.check_hostname = False
        # verify-full leaves check_hostname=True (default) — nothing to patch.
        return clean_dsn, ctx


    async def ensure_partitions(conn_dsn: str, months_ahead: int = 3) -> dict[str, list[str]]:
        """
        Ensure partitions exist for the current month through months_ahead months forward.
        Returns a dict mapping table name to list of partition names ensured.
        """
        try:
            import asyncpg
        except ImportError:
            logger.error("asyncpg is required. pip install asyncpg")
            sys.exit(1)

        clean_dsn, ssl_ctx = _build_ssl_context(conn_dsn)
        conn_kwargs: dict = {"ssl": ssl_ctx} if ssl_ctx is not None else {}
        conn = await asyncpg.connect(clean_dsn, **conn_kwargs)
        created: dict[str, list[str]] = {t: [] for t in _PARTITIONED_TABLES}

        try:
            today = date.today().replace(day=1)
            for i in range(months_ahead + 1):
                month_offset = today.month - 1 + i
                year = today.year + month_offset // 12
                month = month_offset % 12 + 1
                start, end = _partition_range(year, month)

                for table in _PARTITIONED_TABLES:
                    name = _partition_name(table, year, month)
                    # Safe identifier quoting — _quote_ident rejects any name
                    # that doesn't match [a-zA-Z_][a-zA-Z0-9_]* before the
                    # statement is composed (CWE-89, YSG-RISK-001 #3ar).
                    # Date literals are formatted directly as ISO-8601 strings
                    # (YYYY-MM-DD). asyncpg bind parameters ($1/$2) are NOT
                    # supported in DDL statements like CREATE TABLE — the server
                    # reports "expects 0 arguments" and fails. The date values
                    # come from Python date arithmetic (not user input) so
                    # direct string interpolation is safe here.
                    q_name = _quote_ident(name)
                    q_table = _quote_ident(table)
                    await conn.execute(
                        f"CREATE TABLE IF NOT EXISTS {q_name}"
                        f" PARTITION OF {q_table}"
                        f" FOR VALUES FROM ('{start.isoformat()}') TO ('{end.isoformat()}')"
                    )
                    created[table].append(name)
                    logger.info("Partition %s: OK", name)
        finally:
            await conn.close()

        return created


    def main() -> None:
        logging.basicConfig(
            level=logging.INFO,
            format="%(asctime)s %(levelname)s %(message)s",
        )

        parser = argparse.ArgumentParser(
            description="Create missing audit/inference log partitions"
        )
        parser.add_argument(
            "--months-ahead",
            type=int,
            default=3,
            help="Number of future months to pre-create (default: 3)",
        )
        args = parser.parse_args()

        dsn = os.environ.get("DATABASE_URL")
        if not dsn:
            logger.error("DATABASE_URL environment variable is required")
            sys.exit(1)

        created = asyncio.run(ensure_partitions(dsn, months_ahead=args.months_ahead))

        total = sum(len(v) for v in created.values())
        print(f"Partition maintenance complete: {total} partition(s) ensured.")
        for table, names in created.items():
            for name in names:
                print(f"  {name}: OK")


    if __name__ == "__main__":
        main()

{{- /* B-K8S-4: yashigani-prometheus-web-config ConfigMap removed.
  web-config.yml is now a second key in yashigani-prometheus-config (prometheus.yaml),
  served via the whole-dir /etc/prometheus mount. Separate ConfigMap + subPath
  is blocked on containerd: subPath into an already-mounted dir is not allowed.
*/ -}}

{{- if and .Values.grafana.enabled .Values.mtls.enabled }}
{{/*
── Grafana provisioning ConfigMap ─────────────────────────────────────────────
  retro #83: datasource provisioning YAMLs with mTLS config.
  Mounted at /etc/grafana/provisioning in the Grafana StatefulSet.
  $__file{} references resolved at runtime from /run/secrets (pki-certs volume).
  Trust anchor: ca_intermediate.crt (Pattern B — never ca_root.crt).
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-grafana-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-grafana-provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  datasources_prometheus.yml: |
    # retro #83: Grafana → Prometheus datasource over mTLS (Pattern B).
    # TA-1/TA-2: mTLS prevents impersonation and eavesdropping on obs network.
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: https://{{ include "yashigani.fullname" . }}-prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
          tlsAuth: true
          tlsAuthWithCACert: true
          tlsSkipVerify: false
        secureJsonData:
          tlsCACert: $__file{/run/secrets/ca_intermediate.crt}
          tlsClientCert: $__file{/run/secrets/grafana_client.crt}
          tlsClientKey: $__file{/run/secrets/grafana_client.key}
  datasources_loki.yml: |
    # retro #83: Grafana → Loki datasource over mTLS (Pattern B).
    # NOTE: Loki TLS termination enabled by parallel PR #84.
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: https://{{ include "yashigani.fullname" . }}-loki:3100
        isDefault: false
        version: 1
        editable: false
        jsonData:
          maxLines: 1000
          tlsAuth: true
          tlsAuthWithCACert: true
          tlsSkipVerify: false
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"
        secureJsonData:
          tlsCACert: $__file{/run/secrets/ca_intermediate.crt}
          tlsClientCert: $__file{/run/secrets/grafana_client.crt}
          tlsClientKey: $__file{/run/secrets/grafana_client.key}
  datasources_jaeger.yml: |
    # retro #83: Jaeger query/UI port (16686) remains HTTP on obs-internal.
    # EX-231-09 closed otel-collector → Jaeger gRPC (4317) mTLS separately.
    # Jaeger UI TLS deferred to v2.24 (RETRO-84).
    apiVersion: 1
    datasources:
      - name: Jaeger
        type: jaeger
        uid: jaeger
        access: proxy
        url: http://{{ include "yashigani.fullname" . }}-jaeger:16686
        isDefault: false
        version: 1
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: false
            customQuery: false
            query: '{service="${__tags.service}"}'
          tracesToMetrics:
            datasourceUid: prometheus
            tags: [{key: "service.name", value: "service"}]
            queries:
              - name: "Request Rate"
                query: "rate(yashigani_gateway_requests_total[$__rate_interval])"
{{- end }}
{{- /*
  Backup script ConfigMap (MP.L2-3.8.9)
  DRIFT-B5-BACKUP-EMBEDDED-COPY fix (v2.25.0 P2 FIX-3):
  The prior inline backup.sh had 7 documented divergences from canonical
  scripts/backup.sh (Iris audit): missing header/usage block, missing color
  output, missing operator runbook error messages, missing post-encrypt
  file-existence guard (Iris item 6 — `if [[ ! -f "${TMP_OUTPUT}" ]]`),
  and unified extra-warn semantics.

  Fix: replace inline with .Files.Get "files/scripts/backup.sh" (same pattern
  as B6 OPA rego, commit d1d9433). helm/yashigani/files/scripts/backup.sh is a
  byte-identical copy of scripts/backup.sh; sha256 parity enforced in
  tests/contracts/test_helm_p2_fix3_backup_files_get.py.

  Single source of truth: scripts/backup.sh. The files/ copy must track it.
  CronJob entrypoint (backup-cronjob.yaml): `bash /scripts/backup.sh` — no CLI
  args, env-var-only invocation. The canonical script's env var defaults are
  identical to what the CronJob env block sets.

  See: backup-cronjob.yaml for mount and command usage.
  Last updated: 2026-05-28T00:00:00+01:00
*/}}
{{- if .Values.backup.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yashigani.fullname" . }}-backup-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    yashigani.io/finding: "MP.L2-3.8.9"
    yashigani.io/cwe: "CWE-312"
    yashigani.io/drift-fix: "DRIFT-B5-BACKUP-EMBEDDED-COPY"
data:
  backup.sh: |
{{ .Files.Get "files/scripts/backup.sh" | indent 4 }}
{{- end }}
