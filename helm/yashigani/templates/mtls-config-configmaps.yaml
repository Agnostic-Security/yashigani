{{- if .Values.mtls.enabled }}
{{- /*
  ConfigMaps holding the mTLS-aware configs for postgres + pgbouncer.
  Source of truth: docker/postgres/05-enable-ssl.sh and docker/pgbouncer/
  pgbouncer.ini — shipped into the chart via `.Files.Get`.
*/ -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-postgres-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-postgres
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  05-enable-ssl.sh: |
{{ .Files.Get "files/postgres-05-enable-ssl.sh" | indent 4 }}
  10-pgbouncer-auth.sh: |
{{ .Files.Get "files/10-pgbouncer-auth.sh" | indent 4 }}
  # NEW-K8S-POSTGRES-MISSING-AGENT-DBS-001 (found live during 4.1.2 k3s/Cilium
  # e2e, 2026-07-28): this ConfigMap only ever shipped 05-/10- — the compose
  # side ALSO mounts docker/postgres/init-agent-dbs.sh at
  # /docker-entrypoint-initdb.d/11-agent-dbs.sh (docker-compose.yml), which
  # creates the yashigani_app role (idempotently, ahead of migration 0001)
  # and the `letta` database + pgvector extension + schema grants. The K8s
  # path never had an equivalent, so on a fresh PGDATA the `letta` database
  # was never created: letta's own Alembic migration then FATALs "database
  # letta does not exist", CrashLoopBackOff forever (a stateful init-time
  # gap — restarting the pod never re-runs docker-entrypoint-initdb.d once
  # PGDATA is non-empty, same class of one-shot-init issue as the SSL/server
  # key fixes above). Byte-identical mirror of
  # docker/postgres/init-agent-dbs.sh (verified via diff) — no K8s-specific
  # divergence needed (pure psql SQL, no UID/chown operations).
  11-agent-dbs.sh: |
{{ .Files.Get "files/init-agent-dbs.sh" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yashigani-pgbouncer-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pgbouncer
    {{- include "yashigani.labels" . | nindent 4 }}
data:
  # pgbouncer.ini: rendered with K8s service name substitution. The shipped
  # static file (helm/yashigani/files/pgbouncer.ini) declares `host=postgres`
  # for Compose; K8s ClusterIP service is `<release>-postgres` (typically
  # `yashigani-postgres`). Internal K8s integration evidence: without
  # this substitution, pgbouncer logs `DNS lookup failed: postgres` and
  # backoffice exits 3 on lifespan timeout.
  pgbouncer.ini: |
{{ .Files.Get "files/pgbouncer.ini" | replace "host=postgres " (printf "host=%s-postgres " (include "yashigani.fullname" .)) | indent 4 }}
{{- end }}
