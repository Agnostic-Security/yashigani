{{- /* Last updated: 2026-05-07T00:00:00+01:00 — fix: YASHIGANI_AGENT_UPSTREAM_HOSTNAMES wired from agentBundles.upstreamHostnames */ -}}
{{- if .Values.backoffice.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yashigani-backoffice
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-backoffice
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backoffice.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: yashigani-backoffice
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yashigani-backoffice
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.mtls.enabled }}
      annotations:
        # Trigger rolling update when PKI Secret resourceVersion changes.
        # See gateway.yaml for full rationale.
        checksum/pki-certs: {{ lookup "v1" "Secret" .Release.Namespace .Values.mtls.secretName | default dict | dig "metadata" "resourceVersion" "" | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yashigani.serviceAccountName" . }}
      # /run/secrets mount collision — see redis.yaml note.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        # fsGroup: chgrp Secret volumes so UID 1001 can read them.
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # YSG-RISK-122 (Ava, live k8s @ ca720724): yashigani-backoffice was
      # observed scheduled 7s before yashigani-redis-0 — headless-Service DNS
      # for a StatefulSet pod is only resolvable once kube-dns registers the
      # pod IP, which can exceed backoffice's own in-process retry budget
      # (entrypoint.py: 5 attempts, 1/2/4/8/16s backoff, ~31s). When that
      # budget is exhausted, backoffice previously left RBAC / the agent
      # registry / the permission store / budget enforcement disabled for the
      # pod's entire lifetime (fixed at the Python layer in
      # backoffice/redis_selfheal.py — this initContainer is defense-in-depth
      # only, making the race far less likely rather than depending solely on
      # the runtime self-heal). docker/podman compose ordering
      # (`depends_on: service_healthy`) already prevents this; k8s Deployments
      # have no equivalent construct, hence this initContainer. Reuses the
      # already-pulled backoffice image (has python3) — no new image surface.
      #
      # Unconditional (NOT gated on mtls.enabled) because the boot race exists
      # regardless of whether mTLS is on — DNS propagation timing is the same
      # either way; only the copy-pki-to-writable initContainer below is
      # mTLS-specific.
      initContainers:
        {{- if (.Values.backoffice.waitForRedis).enabled | default true }}
        - name: wait-for-redis
          image: "{{ include "yashigani.ownImage" (dict "registry" .Values.global.imageRegistry "owner" .Values.global.imageOwner "repo" .Values.backoffice.image.repository "tag" .Values.backoffice.image.tag) }}"
          imagePullPolicy: {{ .Values.backoffice.image.pullPolicy }}
          command: ["python3", "-c"]
          args:
            - |
              import os, socket, sys, time
              host = os.environ["WAIT_REDIS_HOST"]
              port = int(os.environ["WAIT_REDIS_PORT"])
              interval = float(os.environ.get("WAIT_REDIS_INTERVAL_S", "2"))
              attempt = 0
              while True:
                  attempt += 1
                  try:
                      with socket.create_connection((host, port), timeout=3):
                          print(f"wait-for-redis: {host}:{port} reachable after {attempt} attempt(s)", flush=True)
                          sys.exit(0)
                  except OSError as exc:
                      if attempt % 5 == 1:
                          print(f"wait-for-redis: {host}:{port} not yet reachable (attempt {attempt}): {exc}", flush=True)
                      time.sleep(interval)
          env:
            - name: WAIT_REDIS_HOST
              value: "yashigani-redis"
            - name: WAIT_REDIS_PORT
              value: {{ if .Values.mtls.enabled }}"6380"{{ else }}"6379"{{ end }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: wait-for-budget-redis
          image: "{{ include "yashigani.ownImage" (dict "registry" .Values.global.imageRegistry "owner" .Values.global.imageOwner "repo" .Values.backoffice.image.repository "tag" .Values.backoffice.image.tag) }}"
          imagePullPolicy: {{ .Values.backoffice.image.pullPolicy }}
          command: ["python3", "-c"]
          args:
            - |
              import os, socket, sys, time
              host = os.environ["WAIT_REDIS_HOST"]
              port = int(os.environ["WAIT_REDIS_PORT"])
              interval = float(os.environ.get("WAIT_REDIS_INTERVAL_S", "2"))
              attempt = 0
              while True:
                  attempt += 1
                  try:
                      with socket.create_connection((host, port), timeout=3):
                          print(f"wait-for-budget-redis: {host}:{port} reachable after {attempt} attempt(s)", flush=True)
                          sys.exit(0)
                  except OSError as exc:
                      if attempt % 5 == 1:
                          print(f"wait-for-budget-redis: {host}:{port} not yet reachable (attempt {attempt}): {exc}", flush=True)
                      time.sleep(interval)
          env:
            # Mirrors the BUDGET_REDIS_HOST/PORT override added to the main
            # container's env block below (YSG-RISK-122 finding: this override
            # was previously MISSING on backoffice — the code default
            # "budget-redis" does not resolve in-cluster, service is
            # yashigani-budget-redis. gateway.yaml already had this override).
            - name: WAIT_REDIS_HOST
              value: "yashigani-budget-redis"
            - name: WAIT_REDIS_PORT
              value: {{ if .Values.mtls.enabled }}"6380"{{ else }}"6379"{{ end }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
      {{- if .Values.mtls.enabled }}
        # Backoffice bootstrap writes admin_initial_password + redis_password
        # + grafana_admin_password into YASHIGANI_SECRETS_DIR (default
        # /run/secrets). In docker-compose, /run/secrets is a tmpfs overlay
        # populated by docker secrets — writable. Under K8s a Secret mount is
        # readOnly at the kernel level, breaking write_docker_secrets(). Copy
        # the PKI cert material into a writable emptyDir at startup.
        - name: copy-pki-to-writable
          # alpine/k8s is already cached on the node (used by pki-bootstrap
          # Job). Reusing it avoids another image pull + keeps the chart's
          # image surface small.
          image: "{{ .Values.mtls.kubectlImage.repository }}:{{ .Values.mtls.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.mtls.kubectlImage.pullPolicy | default "IfNotPresent" }}
          # Retro #3ap — also seed admin1/admin2 bootstrap material so
          # _bootstrap_admin_accounts in src/yashigani/backoffice/app.py can
          # find admin1_username, admin_initial_password, admin1_totp_secret,
          # admin2_username, admin2_password, admin2_totp_secret.
          command:
            - sh
            - -c
            - |
              set -e
              cp -L /pki-ro/* /secrets-rw/
              if [ -d /admin-bootstrap-ro ]; then
                # tolerate empty admin-bootstrap mount (existingSecretName=empty
                # placeholder pattern OR adminBootstrap.enabled=false at upgrade
                # time on a release that already seeded admins).
                for f in /admin-bootstrap-ro/*; do
                  [ -e "$f" ] || continue
                  cp -L "$f" /secrets-rw/
                done
              fi
              # YSG-PGB-SCRAM-x86 fix (tier-tests-20260720): _sync_app_role_password()
              # (src/yashigani/db/__init__.py) reads ${YASHIGANI_SECRETS_DIR}/postgres_password
              # as a FILE to replace migration 0001's literal SCRAM placeholder
              # ('PLACEHOLDER_REPLACED_BY_BOOTSTRAP') on the yashigani_app role. Compose
              # bind-mounts docker/secrets/postgres_password into /run/secrets — this file
              # never existed in K8s (postgres_password was env-var-only via secretKeyRef),
              # so the sync silently no-op'd (caught OSError, logged, returned) and
              # yashigani_app's real postgres password stayed on the placeholder forever.
              # Every downstream SCRAM auth (asyncpg/psql -> pgbouncer -> postgres) then
              # fails "SASL authentication failed" — this is NOT a pgbouncer bug (confirmed
              # live: identical failure on pgbouncer 1.25.1 AND 1.25.2, auth_query AND
              # static userlist.txt, direct-to-postgres AND via pgbouncer).
              cp -L /postgres-secret-ro/postgres_password /secrets-rw/
              # NEW-K8S-BACKOFFICE-LICENSE-SUBPATH-001 (found live during 4.1.2
              # k3s/Cilium e2e, 2026-07-28): same bug class as
              # YSG-GW-SUBPATH-MOUNT (gateway.yaml) — the license Secret used
              # to be subPath-mounted directly at /run/secrets/license_key
              # (nested inside the ALREADY-mounted `secrets` emptyDir).
              # kubelet/containerd cannot create a subPath mountpoint at a
              # path that doesn't already exist as a real file/dir inside
              # another volume's mount: every backoffice pod with a license
              # configured hit RunContainerError "create target of file
              # bind-mount: mknod regular file .../run/secrets/license_key:
              # read-only file system". gateway.yaml was fixed for this exact
              # pattern (tier-tests-20260720) with a comment claiming it
              # "mirrors backoffice.yaml's pattern exactly" — but backoffice's
              # own initContainer was never actually given the matching
              # license_key copy step, so the broken subPath mount silently
              # remained. Fix: copy license_key here too, same as gateway.
              if [ -d /license-ro ]; then
                cp -L /license-ro/license_key /secrets-rw/
              fi
              chmod 0400 /secrets-rw/*
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pki-ro
              mountPath: /pki-ro
              readOnly: true
            {{- if .Values.adminBootstrap.enabled }}
            - name: admin-bootstrap-ro
              mountPath: /admin-bootstrap-ro
              readOnly: true
            {{- end }}
            # YSG-PGB-SCRAM-x86 fix: postgres_password as a file, matching the
            # compose bind-mount, so _sync_app_role_password() can replace the
            # migration-0001 SCRAM placeholder on yashigani_app.
            - name: postgres-secret-ro
              mountPath: /postgres-secret-ro
              readOnly: true
            {{- if .Values.licensing.licenseKey }}
            - name: license-ro
              mountPath: /license-ro
              readOnly: true
            {{- end }}
            - name: secrets
              mountPath: /secrets-rw
      {{- end }}
      containers:
        - name: backoffice
          image: "{{ include "yashigani.ownImage" (dict "registry" .Values.global.imageRegistry "owner" .Values.global.imageOwner "repo" .Values.backoffice.image.repository "tag" .Values.backoffice.image.tag) }}"
          imagePullPolicy: {{ .Values.backoffice.image.pullPolicy }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8443
              protocol: TCP
          env:
            # LIC-001: YASHIGANI_ENV is hardcoded to "production" to prevent
            # operators from disabling license integrity checks via --set.
            # Non-license uses of the environment label (telemetry, OTel
            # resource attributes) use YASHIGANI_ENVIRONMENT_LABEL instead,
            # which still reads from global.environment.
            - name: YASHIGANI_ENV
              value: "production"
            - name: YASHIGANI_ENVIRONMENT_LABEL
              value: {{ .Values.global.environment | quote }}
            - name: YASHIGANI_KMS_PROVIDER
              value: "docker"
            - name: YASHIGANI_SERVICE_NAME
              value: "backoffice"
            # v2.23.2 #47 — Backup status + verify mount path.
            # Always set; Python falls back gracefully if the dir is empty/absent.
            - name: YASHIGANI_BACKUPS_DIR
              value: "/data/backups"
            {{- if .Values.adminBootstrap.enabled }}
            # Retro #3ap — pull the generated admin1 username out of the
            # adminBootstrap Secret. _bootstrap_admin_accounts in app.py uses
            # this as the username it creates the admin1 row with. Compose
            # parity: install.sh rewrites .env's YASHIGANI_ADMIN_USERNAME on
            # generate; we get the same effect here without a writable .env.
            - name: YASHIGANI_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminBootstrap.existingSecretName | default .Values.adminBootstrap.secretName }}
                  key: admin1_username
                  optional: true
            {{- end }}
            - name: REDIS_HOST
              value: "yashigani-redis"
            - name: REDIS_PORT
              value: {{ if .Values.mtls.enabled }}"6380"{{ else }}"6379"{{ end }}
            # YSG-RISK-122 finding: this override was MISSING on backoffice —
            # entrypoint.py's budget_enforcer init defaults BUDGET_REDIS_HOST
            # to "budget-redis" (correct for compose, where the service is
            # literally named budget-redis), which does NOT resolve in-cluster
            # (k8s Service is yashigani-budget-redis). Without this override,
            # backoffice's /admin/budget/usage/* was 503 unconditionally under
            # k8s, independent of the boot-race timing — gateway.yaml already
            # carried this exact override; backoffice did not.
            - name: BUDGET_REDIS_HOST
              value: "yashigani-budget-redis"
            - name: BUDGET_REDIS_PORT
              value: {{ if .Values.mtls.enabled }}"6380"{{ else }}"6379"{{ end }}
            {{- if .Values.mtls.enabled }}
            - name: REDIS_USE_TLS
              value: "true"
            - name: YASHIGANI_SERVICE_MANIFEST_PATH
              value: "/etc/yashigani/service_identities.yaml"
            - name: YASHIGANI_INTERNAL_CA_DIR
              value: "/run/secrets"
            # MI-6 (multi-instance / YSG-RISK-061): per-instance SPIFFE trust domain
            # for the app-layer validators. Default yashigani.internal (single
            # instance). Compose parity: x-common-env YASHIGANI_SPIFFE_TRUST_DOMAIN.
            - name: YASHIGANI_SPIFFE_TRUST_DOMAIN
              value: {{ .Values.global.spiffeTrustDomain | default "yashigani.internal" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecretName | default "yashigani-postgres-secrets" }}
                  key: postgres_password
            - name: YASHIGANI_DB_DSN
              # ca_bundle.crt (root+intermediate) for libpq/psycopg2 consumers.
              # asyncpg also uses this DSN but asyncpg goes through Python ssl
              # which can build the chain with root alone. Using ca_bundle.crt
              # is safe for both consumers. Internal K8s gate finding:
              # libpq (psycopg2) fails with ca_root.crt alone when pgbouncer
              # serves a chain-bundle cert (openssl error 20 "unable to get
              # local issuer certificate").
              value: "postgresql://yashigani_app:$(POSTGRES_PASSWORD)@yashigani-pgbouncer:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/backoffice_client.crt&sslkey=/run/secrets/backoffice_client.key"
            - name: YASHIGANI_DB_DSN_DIRECT
              # Direct-to-postgres DSN, bypassing pgbouncer. Used ONLY by
              # bootstrap-class operations that need a session-scoped postgres
              # advisory lock (run_migrations, admin-account bootstrap). pgbouncer
              # in transaction-pool mode routes each new connection to a
              # different postgres backend, so session-scoped advisory locks
              # acquired THROUGH pgbouncer don't serialise across replicas:
              # replicas land on different backends, both "acquire" the same
              # key independently, no exclusion. Connecting direct to
              # postgres-the-process puts both replicas' lock connections on
              # the same backend, where pg_advisory_lock actually serialises.
              # Evidence captured during internal K8s integration testing.
              # ca_bundle.crt: postgres also serves chain-bundle cert; libpq
              # requires bundle CA to verify (internal integration finding).
              value: "postgresql://yashigani_app:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/backoffice_client.crt&sslkey=/run/secrets/backoffice_client.key"
            # v2.25.2 (Lu wire-sink-gate P1): DDL / Alembic run as the admin
            # superuser yashigani_admin; runtime pool stays on yashigani_app.
            - name: YASHIGANI_DB_DSN_ADMIN
              value: "postgresql://yashigani_admin:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/backoffice_client.crt&sslkey=/run/secrets/backoffice_client.key"
            - name: YASHIGANI_DB_DSN_ADMIN_DIRECT
              value: "postgresql://yashigani_admin:$(POSTGRES_PASSWORD)@yashigani-postgres:5432/yashigani?sslmode=verify-ca&sslrootcert=/run/secrets/ca_bundle.crt&sslcert=/run/secrets/backoffice_client.crt&sslkey=/run/secrets/backoffice_client.key"
            {{- end }}
            # v2.25.2 (Lu wire-sink-gate P2 — irrevocable signed chain): the daily
            # audit-chain checkpoint scheduler runs in backoffice. The ECDSA signing
            # key is mounted RO via the audit-signing Secret (backoffice ONLY — NOT
            # mounted into gateway/runtime), so a held yashigani_app credential
            # cannot forge a signed checkpoint. Absent key => unsigned (still
            # tamper-evident). Gated on a values flag so air-gapped/community
            # deployments without the Secret still schedule (unsigned) checkpoints.
            {{- if .Values.audit.signingKey.enabled }}
            - name: YASHIGANI_AUDIT_SIGNING_KEY_PATH
              value: "/run/audit-signing/audit_signing.key"
            - name: YASHIGANI_AUDIT_SIGNING_SPIFFE_ID
              value: "spiffe://{{ .Values.global.spiffeTrustDomain | default "yashigani.internal" }}/audit/checkpoint-signer"
            {{- end }}
            - name: YASHIGANI_OPA_URL
              value: "https://yashigani-policy:8181"
            # YSG-RISK-125 fix (compose<->k8s name-resolution parity): user_ui.py
            # and user_agents.py's chat/agent proxy default to
            # os.environ.get("YASHIGANI_GATEWAY_MESH_URL", "http://gateway:8081/v1")
            # — the bare "gateway" hostname only resolves in Compose, where the
            # service is literally named "gateway". On k8s the Service is
            # "yashigani-gateway" (see gateway.yaml Service, http-mesh port
            # 8081); without this override every /user/chat/completions and
            # /user/agents/* call fails DNS resolution ([Errno -2] Name or
            # service not known) and every chat target (letta/langflow/
            # openclaw/direct model) returns gateway_unreachable.
            - name: YASHIGANI_GATEWAY_MESH_URL
              value: "http://yashigani-gateway:8081/v1"
            - name: YASHIGANI_SECRETS_DIR
              value: "/run/secrets"
            # YSG-RISK-120 fix (k8s parity with compose FINDING-V412-RESTART-012):
            # previously /run/secrets was a SINGLE writable emptyDir holding
            # BOTH the CA trust anchors (ca_root.crt/ca_bundle.crt, seeded by
            # the copy-pki-to-writable initContainer) AND the writable
            # bootstrap-credential writes (admin_initial_password etc. via
            # write_docker_secrets(), license_key via /admin/license/activate).
            # A backoffice file-write primitive could rm+rewrite ca_root.crt
            # to an attacker-controlled CA, poisoning every outbound mTLS
            # verify backoffice performs (postgres sslrootcert, redis
            # ssl_ca_certs, healthcheck, OTel). Fixed the same way compose
            # was fixed: when mTLS is enabled, /run/secrets is now mounted
            # readOnly in the main container (see volumeMounts below) and the
            # genuinely-writable files go to a SEPARATE emptyDir at
            # /run/secrets-rw instead. When mTLS is disabled, no PKI
            # initContainer ever runs and no CA material is ever seeded into
            # /run/secrets, so there is nothing to protect — writes stay at
            # the single /run/secrets path as before (Python default
            # /run/secrets-rw would otherwise resolve to a path that doesn't
            # exist in that pod).
            - name: YASHIGANI_SECRETS_RW_DIR
              value: {{ if .Values.mtls.enabled }}"/run/secrets-rw"{{ else }}"/run/secrets"{{ end }}
            {{- if .Values.mtls.enabled }}
            # YSG-RISK-120 fix: loader.py checks YASHIGANI_LICENSE_FILE (candidate
            # 1) before the hardcoded /run/secrets/license_key (candidate 2). A
            # runtime-activated license (POST /admin/license/activate) is written
            # to the writable /run/secrets-rw volume, not the now-readOnly
            # /run/secrets volume that holds the install-time licensing.licenseKey
            # Secret mount — without this override an activated license would be
            # lost on pod restart (fell through to the community-tier default).
            # Fresh installs with no runtime activation yet: this candidate file
            # doesn't exist, loader.py falls through to candidate 2 unchanged.
            - name: YASHIGANI_LICENSE_FILE
              value: "/run/secrets-rw/license_key"
            {{- end }}
            - name: YASHIGANI_DEPLOYMENT_STREAM
              value: {{ (.Values.gateway.env | default dict).deploymentStream | quote }}
            {{- if .Values.mtls.enabled }}
            # M-01 fix: backoffice exports OTLP traces via mTLS. Python OTEL
            # exporter uses Python ssl — Pattern A (ca_root.crt) per gate #58a
            # evidence (Python 3.12/OpenSSL 3.0/Ubuntu 24.04 strict chain).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "grpcs://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: "/run/secrets/ca_root.crt"
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: "/run/secrets/backoffice_client.crt"
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: "/run/secrets/backoffice_client.key"
            {{- end }}
            - name: YASHIGANI_TLS_DOMAIN
              value: {{ .Values.global.tlsDomain | quote }}
            {{- if .Values.backoffice.agentUpstreamHostnames }}
            # v2.23.2 fix — SSRF guard hostname allowlist (TM-V231-004 / Pentest #95).
            # Permits canonical agent bundle service names to register with private
            # upstream URLs. Mirrors Compose YASHIGANI_AGENT_UPSTREAM_HOSTNAMES.
            - name: YASHIGANI_AGENT_UPSTREAM_HOSTNAMES
              value: {{ .Values.backoffice.agentUpstreamHostnames | join "," | quote }}
            {{- end }}
            {{- range $frontID, $front := .Values.agentIngressFronts }}
            {{- if and $front.enabled (eq $front.systemName "langflow") }}
            # v4.1 §2.5 INGRESS-FRONTING: backoffice POST /user/agents/generate
            # (langflow_client.create_flow) dials langflow's Caddy mesh front —
            # never the agent pod directly (§2.6 K8s analogue: langflow ingress
            # NP admits the caddy pod only). Mirrors compose
            # YASHIGANI_LANGFLOW_URL. Port sourced from the codegen overlay
            # values-langflow-ingress.yaml (single source, drift-gated).
            - name: YASHIGANI_LANGFLOW_URL
              value: "https://yashigani-caddy-mesh:{{ int $front.meshPort }}/agents/{{ $front.tenantId }}/{{ $front.systemName }}"
            # TRACK1-F-04 — langflow flow-discovery reconciler. Points at the
            # same mesh front as YASHIGANI_LANGFLOW_URL; reconciler appends
            # /api/v1/flows. Auth: backoffice mTLS leaf (backoffice_client.crt)
            # → forward_auth verify-mcp ALLOW (subject=backoffice, server=langflow).
            # NO new NetworkPolicy needed — caddy↔langflow already allowed by
            # the agentIngressFronts NP (agent-ingress-fronts.yaml).
            - name: YASHIGANI_LANGFLOW_INTERNAL_URL
              value: "https://yashigani-caddy-mesh:{{ int $front.meshPort }}/agents/{{ $front.tenantId }}/{{ $front.systemName }}"
            {{- end }}
            {{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecretName | default "yashigani-redis-secrets" }}
                  key: redis_password
            # v4.1 F-03: backoffice _registry_store() reads YASHIGANI_REDIS_URL and
            # passes it directly to redis.Redis.from_url(). Uses $(REDIS_PASSWORD) via
            # K8s dependent env-var substitution (Kubelet replaces before container
            # start). REDIS_PASSWORD must appear before this entry in the list.
            # Note: if the Redis password contains URL sub-delimiters (e.g. ','), the
            # K8s Redis secret should store a URL-encoded variant as redis_password_urlenc
            # and reference that key instead. Compose uses REDIS_PASSWORD_URLENC written
            # by install.sh; Helm operators must ensure the password is URL-safe OR
            # override this value with a pre-encoded reference.
            - name: YASHIGANI_REDIS_URL
              value: "rediss://:$(REDIS_PASSWORD)@yashigani-redis:6380/3?ssl_cert_reqs=required&ssl_ca_certs=/run/secrets/ca_root.crt&ssl_certfile=/run/secrets/backoffice_client.crt&ssl_keyfile=/run/secrets/backoffice_client.key"
            # v2.23.3 (#59) — W6 fix: YASHIGANI_DB_AES_KEY required for pgcrypto
            # pgp_sym_encrypt on auth_settings table (HIBP API key at rest).
            # Sourced from backoffice secret (same secret as install.sh writes).
            # Key format: 64-char hex (32 bytes) or 44-char base64.
            # Missing key → RuntimeError at lifespan startup (fail-closed per SOP 1).
            - name: YASHIGANI_DB_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backoffice.existingSecretName | default "yashigani-backoffice-secrets" }}
                  key: db_aes_key
            {{- if .Values.mtls.enabled }}
            # EX-231-10 Layer B: backoffice middleware reads CADDY_INTERNAL_HMAC at
            # lifespan startup and rejects requests without a matching
            # X-Caddy-Verified-Secret header → 401. Secret is in pki-certs.
            - name: CADDY_INTERNAL_HMAC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
                  key: caddy_internal_hmac
            {{- end }}
            # YSG-RISK-076 / DP-Y-003 §3.4 — semantic-intent import classifier sidecar
            # (backoffice MCP import screen). Same Ollama backend as the gateway.
            - name: YASHIGANI_SEMANTIC_INTENT_SIDECAR
              value: {{ .Values.backoffice.semanticIntentSidecar | default "true" | quote }}
            # YSG-RISK-128 fix: backoffice never set OLLAMA_BASE_URL at all, so
            # entrypoint.py/routes/models.py fell back to their own Python
            # default "http://ollama:11434" — wrong on two counts on k8s: (1)
            # bare "ollama" doesn't resolve (compose-only hostname convention,
            # same class of gap as YSG-RISK-125), and (2) even
            # "yashigani-ollama:11434" is NetworkPolicy-blocked for backoffice
            # (allow-ollama-ingress only admits the caddy pod — v4.1 Phase
            # 1b-ii / LAURA-I1-01). Reuses gateway.env.ollamaUrl (single
            # source of truth — both services share the same Ollama backend
            # and the same mesh-mTLS front, matching docker-compose.yml where
            # both gateway and backoffice set OLLAMA_BASE_URL to the identical
            # https://caddy:11435/ollama value).
            - name: OLLAMA_BASE_URL
              value: {{ (.Values.gateway.env | default dict).ollamaUrl | quote }}
            # v4.1.2 fix (RESTART-013 MCP leg, Gap A / helm parity) — document
            # enforcement admin routes (routes/documents.py, dp_weaken.py,
            # user_ui.py) read is_document_enforcement_enabled() directly.
            # Compose parity: docker-compose.yml backoffice env
            # YASHIGANI_DOCUMENT_ENFORCEMENT_ENABLED. Backoffice does NOT read
            # the mode-B-proxy flag (gateway-only hot-path gate) — see
            # gateway.yaml for that entry.
            - name: YASHIGANI_DOCUMENT_ENFORCEMENT_ENABLED
              value: {{ .Values.documentEnforcement.enabled | default false | quote }}
            # YSG-RISK-123b fix: same extractor-image wiring as gateway.yaml —
            # backoffice's /user/documents ingress path also spawns per-job
            # extractor pods via KubernetesBackend.run_extractor_job (backend.py),
            # so it needs the SAME registry-aware, freshly-built image reference.
            - name: YASHIGANI_EXTRACTOR_IMAGE
              value: "{{ include "yashigani.ownImage" (dict "registry" .Values.global.imageRegistry "owner" .Values.global.imageOwner "repo" (.Values.documentEnforcement.image.repository | default "yashigani-extractor") "tag" (.Values.documentEnforcement.image.tag | default .Chart.AppVersion)) }}"
            # v4.1 Phase 1d (SEAM Phase-3 wiring, iris-phase1d-audit §5-A):
            # MCP approve-transaction env vars.
            # v4.1 SU-SEAM-1d-04 RESOLVED: the unix-socket admin path cannot
            # span pods (emptyDir is pod-local), so on K8s
            # register_mcp_route() branches on YASHIGANI_CONTAINER_RUNTIME=k8s
            # and POSTs route DATA to Caddy's mesh-mTLS admin relay (:2019
            # site block, configmaps.yaml) via YASHIGANI_CADDY_ADMIN_URL,
            # authenticating with the backoffice ServiceIdentity leaf
            # (internal_httpx_client — no identity-less fallback, fail-closed).
            # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21): backoffice no
            # longer reads or reposts the monolith Caddyfile at all — it sends
            # narrow typed DATA (tenant_id/server_id/mesh_port/shim_port) and
            # the caddy-config-broker sidecar (co-located in the caddy pod)
            # renders + writes + reloads. YASHIGANI_CADDY_BROKER_ROUTE_SOCKET
            # is intentionally NOT set here: it is the compose-only transport
            # (unix sockets cannot span pods).
            - name: YASHIGANI_MCP_ARTIFACT_ROOT
              value: {{ .Values.backoffice.mcpArtifactRoot | default "/mnt/install" | quote }}
            - name: YASHIGANI_CONTAINER_RUNTIME
              value: {{ .Values.containerRuntime | default "k8s" | quote }}
            {{- if and .Values.caddy.enabled .Values.caddy.adminRelay.enabled .Values.mtls.enabled }}
            - name: YASHIGANI_CADDY_ADMIN_URL
              value: "https://yashigani-caddy-admin:{{ .Values.caddy.adminRelay.port }}"
            {{- end }}
            # YSG-COMPOSE-ENV-001 Helm parity: backoffice reads YASHIGANI_INTERNAL_BEARER
            # from env (os.environ.get) — must be injected via secretKeyRef, not only
            # present in yashigani-agent-bearer for agent-bundle shims.
            - name: YASHIGANI_INTERNAL_BEARER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalBearer.existingSecretName | default "yashigani-agent-bearer" }}
                  key: yashigani_internal_bearer
            {{- if .Values.fips.mode }}
            # Nico N-001 (v2.24.4): FIPS_MODE propagation.
            # Routes openssl dgst calls through the OpenSSL FIPS Provider.
            # REQUIRES a FIPS-configured base image (CMVP #4985) — default
            # python:3.14.0-slim does NOT contain the FIPS Provider. Do NOT
            # set fips.mode=true without swapping to a FIPS-configured image.
            - name: FIPS_MODE
              value: "1"
            {{- end }}
            {{- if .Values.fips.cmvpCert }}
            - name: YASHIGANI_CMVP_CERT
              value: {{ .Values.fips.cmvpCert | quote }}
            {{- end }}
            {{- if .Values.auditLog.enabled }}
            # B7 fix (v2.25.0 P2): audit env vars injected for PVC-backed audit log.
            # SOC 2 CC7.2 / ISO 27001 A.8.15 / NIST AU-9/AU-11 / CMMC AU.L2-3.3.4/8/9 /
            # EU AI Act Art.12. Council finding B7: Lu P0-#3.
            - name: YASHIGANI_AUDIT_LOG_PATH
              value: {{ .Values.auditLog.logPath | quote }}
            - name: YASHIGANI_AUDIT_MAX_FILE_SIZE_MB
              value: {{ .Values.auditLog.maxFileSizeMB | quote }}
            - name: YASHIGANI_AUDIT_RETENTION_DAYS
              value: {{ .Values.auditLog.retentionDays | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.backoffice.existingSecretName | default "yashigani-backoffice-secrets" }}
          {{- if .Values.mtls.enabled }}
          # Startup probe: same rationale as gateway — DB pool + anomaly
          # detector + uvicorn TLS bind can exceed the 30s liveness grace.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8443))"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import ssl,urllib.request;c=ssl.create_default_context(cafile='/run/secrets/ca_root.crt');c.load_cert_chain('/run/secrets/backoffice_client.crt','/run/secrets/backoffice_client.key');urllib.request.urlopen('https://localhost:8443/healthz',context=c)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import ssl,urllib.request;c=ssl.create_default_context(cafile='/run/secrets/ca_root.crt');c.load_cert_chain('/run/secrets/backoffice_client.crt','/run/secrets/backoffice_client.key');urllib.request.urlopen('https://localhost:8443/healthz',context=c)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          {{- else }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.backoffice.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: varlog
              mountPath: /var/log/yashigani
            - name: secrets
              mountPath: /run/secrets
              {{- if .Values.mtls.enabled }}
              readOnly: true
              # YSG-RISK-120 fix: this volume holds the CA trust anchors
              # (ca_root.crt/ca_bundle.crt) + own leaf/key + bootstrap token +
              # postgres_password, seeded by the copy-pki-to-writable
              # initContainer above (which mounts it RW). The main container
              # only ever READS these files — mounting readOnly here means a
              # backoffice file-write primitive can no longer rm/rewrite the
              # CA trust anchor it verifies its own outbound mTLS against.
              # Genuinely-writable bootstrap files now live on the separate
              # secrets-rw volume below.
              {{- else }}
              # mTLS disabled: no PKI initContainer runs, no CA material is
              # ever seeded here — stays writable for write_docker_secrets()
              # dev-mode fallback (YASHIGANI_SECRETS_RW_DIR=/run/secrets above).
              {{- end }}
            {{- if .Values.mtls.enabled }}
            - name: secrets-rw
              mountPath: /run/secrets-rw
              # YSG-RISK-120 fix: separate writable emptyDir for the
              # genuinely-writable bootstrap files — write_docker_secrets()
              # dev-mode-fallback credentials (admin_initial_password,
              # grafana_admin_password, redis_password, prometheus_password)
              # and the runtime license-activation write (routes/license.py).
              # Deliberately never seeded with CA/trust material. Mirrors
              # docker-compose.yml's /run/secrets-rw shadow-mount
              # (FINDING-V412-RESTART-012).
            - name: service-manifest
              mountPath: /etc/yashigani
              readOnly: true
            {{- end }}
            {{- if .Values.backoffice.backupsHostPath }}
            # v2.23.2 #47 — Backup status + verify: mount host backups dir read-only.
            - name: backups
              mountPath: /data/backups
              readOnly: true
            {{- end }}
            # NEW-K8S-BACKOFFICE-LICENSE-SUBPATH-001 fix: the license_key subPath
            # mount that used to live here (nested inside the already-mounted
            # `secrets` emptyDir) is REMOVED — it hit the same containerd
            # subPath-mount bug as YSG-GW-SUBPATH-MOUNT (gateway.yaml). The
            # copy-pki-to-writable initContainer now copies license_key into
            # /secrets-rw (see that initContainer's command), so loader.py's
            # candidate 2 (/run/secrets/license_key) resolves via the same
            # already-mounted `secrets` volume with no separate mount needed.
            {{- if .Values.audit.signingKey.enabled }}
            # v2.25.2 (Lu wire-sink-gate P2): audit-chain signing key — RO, backoffice
            # ONLY. Distinct mountPath (/run/audit-signing) NOT under /run/secrets so
            # the gateway (which mounts the PKI secret) never sees it.
            - name: audit-signing
              mountPath: /run/audit-signing
              readOnly: true
            {{- end }}
            # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21): the old
            # caddyfile ConfigMap mount is REMOVED — backoffice no longer
            # reads or reposts the monolith Caddyfile on K8s (the SU-SEAM-
            # 1d-04 route-DATA registration call needs no Caddy content at
            # all; caddy-config-broker renders it server-side from the SAME
            # ConfigMap, mounted only in the caddy pod).
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        # B7 fix (v2.25.0 P2): replace emptyDir with PVC when auditLog.enabled.
        # emptyDir is wiped on pod restart — operator-visible audit log file sink
        # is lost. PVC persists across restarts for SOC 2 / ISO 27001 / NIST AU-9.
        # Council finding B7: Lu P0-#3.
        - name: varlog
          {{- if .Values.auditLog.enabled }}
          persistentVolumeClaim:
            claimName: yashigani-backoffice-audit-log
          {{- else }}
          emptyDir:
            sizeLimit: 50Mi
          {{- end }}
        {{- if .Values.mtls.enabled }}
        # Writable FROM THE INITCONTAINER'S PERSPECTIVE ONLY: seeded by
        # copy-pki-to-writable, then mounted readOnly in the main backoffice
        # container (YSG-RISK-120 fix — see volumeMounts above). Holds CA
        # trust anchors + own leaf/key + bootstrap token + postgres_password.
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        # YSG-RISK-120 fix: separate writable emptyDir for the bootstrap
        # credential writes (admin_initial_password + friends, license_key)
        # that must stay writable by the main container. Never touched by
        # the copy-pki-to-writable initContainer — no CA/trust material is
        # ever seeded here, so this volume being writable carries none of the
        # CA-tamper risk the /run/secrets split above closes.
        - name: secrets-rw
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Read-only mount of the PKI Secret — the initContainer reads from
        # this and copies into the writable /run/secrets emptyDir.
        - name: pki-ro
          secret:
            secretName: {{ .Values.mtls.existingSecretName | default .Values.mtls.secretName }}
            defaultMode: 0440
            # YSG-RISK-053 (K8s parity with compose fix f7d792d5): items: scoping —
            # only these keys are projected into /pki-ro, so the initContainer's
            # `cp -L /pki-ro/*` copies exactly this set into the /run/secrets
            # emptyDir: own leaf + own bootstrap token + the two trust anchors
            # (ca_root for Python ssl / probes / OTLP, ca_bundle for libpq DSN
            # chain verify). caddy_internal_hmac comes via the
            # CADDY_INTERNAL_HMAC env secretKeyRef, never the file. No other
            # service's leaf key or bootstrap token is projected.
            items:
              - key: backoffice_client.crt
                path: backoffice_client.crt
              - key: backoffice_client.key
                path: backoffice_client.key
              - key: backoffice_bootstrap_token
                path: backoffice_bootstrap_token
              - key: ca_root.crt
                path: ca_root.crt
              - key: ca_bundle.crt
                path: ca_bundle.crt
        {{- if .Values.adminBootstrap.enabled }}
        - name: admin-bootstrap-ro
          secret:
            secretName: {{ .Values.adminBootstrap.existingSecretName | default .Values.adminBootstrap.secretName }}
            defaultMode: 0400
            optional: true
        {{- end }}
        # YSG-PGB-SCRAM-x86 fix: postgres_password projected as a file (items-
        # scoped to just this one key — no other postgres secret keys leak into
        # the backoffice /run/secrets tree) so the initContainer can copy it
        # alongside the PKI material for _sync_app_role_password() to read.
        - name: postgres-secret-ro
          secret:
            secretName: {{ .Values.postgres.existingSecretName | default "yashigani-postgres-secrets" }}
            defaultMode: 0440
            items:
              - key: postgres_password
                path: postgres_password
        - name: service-manifest
          configMap:
            name: yashigani-pki-manifest
        {{- else }}
        - name: secrets
          emptyDir:
            sizeLimit: 10Mi
        {{- end }}
        {{- if .Values.backoffice.backupsHostPath }}
        # v2.23.2 #47 — Backup directory hostPath volume (read-only).
        # Set backoffice.backupsHostPath in values.yaml to the absolute host path.
        - name: backups
          hostPath:
            path: {{ .Values.backoffice.backupsHostPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.licensing.licenseKey }}
        # Petra P0-1 (v2.24.4): licence Secret volume — read-only source for the
        # initContainer copy (NEW-K8S-BACKOFFICE-LICENSE-SUBPATH-001 fix; was
        # subPath-mounted directly at /run/secrets/license_key in the main
        # container, which broke — see initContainer comment). items-scoped
        # to the single key actually needed, matching gateway.yaml's
        # license-ro volume (YSG-GW-SUBPATH-MOUNT fix).
        - name: license-ro
          secret:
            secretName: yashigani-license
            defaultMode: 0440
            items:
              - key: license_key
                path: license_key
        {{- end }}
        # FINDING-V412-CADDYADMIN-002 (Captain, 2026-07-21): the caddyfile
        # ConfigMap volume is REMOVED — backoffice no longer reads the
        # monolith Caddyfile at all (see the env/volumeMounts comment above).
        {{- if .Values.audit.signingKey.enabled }}
        # v2.25.2 (Lu wire-sink-gate P2 — irrevocable signed chain): audit-chain
        # checkpoint signing key Secret. Mounted RO into backoffice ONLY (the
        # scheduler runs here) — never into gateway/runtime, so a held
        # yashigani_app DB credential cannot read it / forge a signed checkpoint.
        # Populate the Secret (key audit_signing.key) with the internal-CA ECDSA
        # leaf; see install.sh _provision_audit_signing_key for the compose
        # equivalent. defaultMode 0400 — owner-read only.
        - name: audit-signing
          secret:
            secretName: {{ .Values.audit.signingKey.existingSecretName | default "yashigani-audit-signing" }}
            defaultMode: 0400
            optional: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: yashigani-backoffice
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-backoffice
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "yashigani.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backoffice.service.type }}
  selector:
    app.kubernetes.io/name: yashigani-backoffice
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backoffice.service.port }}
      targetPort: 8443
      protocol: TCP
{{- end }}
