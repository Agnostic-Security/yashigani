{{- if .Values.mtls.enabled }}
{{- /*
  PKI bootstrap + rotation RBAC.

  A dedicated ServiceAccount, scoped strictly to the release namespace,
  so the PKI Job is the ONLY identity in the cluster that can mutate
  the yashigani-pki-certs Secret. Application pods never get this verb.

  The Secret itself is seeded empty by a pre-install hook (see below) so
  the applier never needs the unrestricted `create` verb on secrets —
  it only performs update/patch against the single named resource.

  Internal pre-push review tightened this from an initial version
  that granted unrestricted `create` on all secrets in the namespace.
*/ -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yashigani-pki
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yashigani-pki
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # get/update/patch on the PKI Secrets, plus the MCP identity signing-key
  # Secret (K8s parity fix, tier-tests-20260720 — the bootstrap Job also
  # mints/preserves the MCP JWT root key here; see values.yaml
  # gateway.mcpSigningKey + mtls-bootstrap-job.yaml pki-pre-seed/issuer/applier).
  # All three are pre-seeded as empty placeholders by the -9-weighted hooks
  # below so the applier never needs the unrestricted `create` verb on
  # the secrets resource.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.mtls.secretName | quote }}
      - {{ .Values.mtls.caKeysSecretName | quote }}
      - {{ .Values.gateway.mcpSigningKey.secretName | quote }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yashigani-pki
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: yashigani-pki
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: yashigani-pki
  apiGroup: rbac.authorization.k8s.io
---
# Empty placeholder Secret — created by Helm itself at pre-install,
# overwritten by the bootstrap Job at weight -5. This lets us drop the
# over-broad `create` verb from the RBAC Role above. resource-policy: keep
# means it survives between helm upgrades, preserving live certs.
{{- /* FINDING-V412-UNIVERSAL-001 (Nico/Captain): only seed the empty placeholder
     on a FRESH install. On a keep-mode uninstall the populated Secret survives
     (resource-policy: keep); a reinstall must NOT re-run this pre-install-hook
     Create against the already-existing Secret — Helm's hook Create path has no
     "AlreadyExists -> adopt" fallback (unlike the main manifest apply used by the
     app Secrets), so the hook would fail and abort `helm install`, funnelling the
     operator toward `--remove-volumes` = CA loss (the exact scenario -001 exists
     to prevent). When the Secret already exists, skip the placeholder; the
     bootstrap Job applier updates it in place (get/update/patch RBAC, no create).
     Same lookup-preserve technique used in secrets.yaml / licensing-secret.yaml. */ -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.mtls.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mtls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-9"
    # Once created, never deleted on subsequent upgrades — we don't want
    # to wipe live certs between `helm upgrade` runs. `hook-succeeded`
    # intentionally omitted.
    "helm.sh/resource-policy": keep
type: Opaque
data: {}
{{- end }}
---
# Retro #3aj — placeholder Secret for the CA private keys. Same pattern as
# the leaves Secret (pre-install, keep), but workload pods MUST NOT be able
# to project this volume. Only the bootstrap Job and rotation CronJob
# (running under ServiceAccount yashigani-pki) reference it.
{{- /* FINDING-V412-UNIVERSAL-001 (Nico/Captain): CA-keys placeholder — same
     fresh-install-only guard as the leaves Secret above. Losing this one on a
     failed reinstall is the worst case (undecryptable pgcrypto + broken mTLS
     trust anchor), so it MUST survive keep-mode uninstall -> reinstall. */ -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.mtls.caKeysSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mtls.caKeysSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-9"
    "helm.sh/resource-policy": keep
type: Opaque
data: {}
{{- end }}
---
# K8s MCP-key parity fix (tier-tests-20260720): placeholder Secret for the
# MCP identity signing key, same fresh-install-only / keep-mode guard as the
# two PKI placeholders above. Populated by the bootstrap Job's applier
# container (mtls-bootstrap-job.yaml) with an EC P-384 key minted by the
# issuer initContainer (or preserved from a prior install by pki-pre-seed —
# never rotated by a re-run of this Job). Referenced by gateway.yaml's
# mcp-signing-key-ro volume via gateway.mcpSigningKey.existingSecretName |
# default gateway.mcpSigningKey.secretName.
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.gateway.mcpSigningKey.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.mcpSigningKey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yashigani-pki
    app.kubernetes.io/component: pki
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-9"
    "helm.sh/resource-policy": keep
type: Opaque
data: {}
{{- end }}
{{- end }}
