{{/*
  Petra P0-1 (v2.24.4) — Licence Secret for K8s deployments.

  Root cause: src/yashigani/licensing/loader.py resolves /run/secrets/license_key
  as its second candidate. Docker/Podman compose provides it via bind-mount from
  docker/secrets/license_key. Helm had no equivalent — every K8s install silently
  fell back to COMMUNITY tier. This template closes that gap.

  Render conditions (FINDING-V412-UNIVERSAL-002 fix):
    - When .Values.licensing.licenseKey is non-empty → (re)write the Secret with it.
    - When empty BUT an existing yashigani-license Secret is present (found via
      lookup) → PRESERVE the existing value. This is the common `helm upgrade`
      case: the operator supplies --set licensing.licenseKey=... on first install
      but NOT on every subsequent upgrade. Before this fix, a plain `helm upgrade`
      rendered licenseKey="" → the `{{- if }}` guard skipped the whole Secret →
      Helm PRUNED it → silent COMMUNITY-tier reversion on a licensed install.
    - When empty AND no existing Secret (fresh Community install) → no Secret is
      created and no mount is added, preserving the COMMUNITY-tier fallback.

  This mirrors the upgrade-safety `lookup` pattern every auto-generated Secret in
  secrets.yaml already uses. lookup returns empty during `helm template`/
  `--dry-run=client` (no cluster connection); combined with an empty licenseKey
  that correctly renders nothing, matching prior dry-run behaviour.

  Volume mount: gateway.yaml and backoffice.yaml mount this Secret at
  /run/secrets/license_key (subPath: license_key, readOnly: true) when
  .Values.licensing.licenseKey is non-empty. On the preserve-on-upgrade path the
  Secret already exists, so the mount (rendered from the same non-empty value on
  the install that set it) stays consistent across upgrades.

  LIC-002: YASHIGANI_LICENSE_TIER must NOT be set via env or values.
  Use licensing.licenseKey only.
*/}}
{{- $existingLicense := lookup "v1" "Secret" .Release.Namespace "yashigani-license" }}
{{- if or .Values.licensing.licenseKey $existingLicense }}
---
apiVersion: v1
kind: Secret
metadata:
  name: yashigani-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yashigani.labels" . | nindent 4 }}
  annotations:
    # Petra P0-1 (v2.24.4): K8s parity for Docker/Podman docker/secrets/license_key.
    # loader.py resolution order candidate 2: /run/secrets/license_key.
    yashigani.io/finding: "Petra-P0-1"
    # FINDING-V412-UNIVERSAL-001: keep the licence across a keep-mode
    # `helm uninstall` (plain uninstall.sh) so reinstall/upgrade retains the
    # operator's tier. NUKE mode (uninstall.sh --remove-volumes) deletes it
    # explicitly. Symmetric with the compose keep-vs-nuke contract.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # The key name "license_key" matches the filename loader.py looks for at
  # /run/secrets/license_key (subPath mount on gateway + backoffice).
  # Priority: 1) operator-supplied licensing.licenseKey (verbatim, b64-encoded
  # here), 2) existing Secret value preserved on upgrade (FINDING-V412-UNIVERSAL-002).
  license_key: {{ if .Values.licensing.licenseKey }}{{ .Values.licensing.licenseKey | b64enc | quote }}{{ else }}{{ index $existingLicense.data "license_key" | quote }}{{ end }}
{{- end }}
