# Severity convention (2026-06-27): `severity` is the RESIDUAL risk to THIS deployment,
# not the raw NVD/CVE rating. A real CVE in a component never loaded or invoked on any
# reachable path — e.g. perl-base, libsqlite3, ncurses, perl IO::Compress in the
# python-slim/Debian-13 base image: present but uncalled (YSG-RISK-093, 096-101) — is
# rated `informational`; the raw NVD severity stays in the entry description. These
# clear automatically on base-image rebuild once upstream Debian ships the fix.
