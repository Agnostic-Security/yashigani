  - Kyverno ClusterPolicies in admission-policies.yaml enforce non-root + no-new-privileges + seccomp + AppArmor
    on all namespace pods including pool-managed pods spawned by the gateway SA. Privileged pod creation is blocked
    at admission time regardless of SA permissions.
  - NetworkPolicy default-deny-ingress + default-deny-egress — pool pods can only communicate via the explicitly
