      deployed k8s gateway/backoffice once healthy (kubectl exec into the
      backoffice pod, mirroring the compose Python script's durable-store
      write, but reading each agent's ALREADY-STABLE token from its
      existing K8s Secret rather than generating + writing a new one, since
      no pod restart/token-rotation is needed on k8s — the Secret-delivered
      token is already correctly wired via agent-bundles.yaml's
      tokenSecretName/tokenSecretKey), or (b) a Helm post-install hook Job
      that performs the equivalent registration. Per Captain's own scope
      discipline (installer orchestration-flow changes beyond a Helm
      values/template tweak are Su's domain, not Captain's) this
      implementation is being handed to Su, coordinated via Maxine, rather
      than hand-hacked by Captain. This entry will be updated to
      status: mitigated once Su's fix lands and is live-verified (all 4
      chat targets returning real responses).
  - rationale: >-
      FIXED by Su (code-complete, NOT YET LIVE-VERIFIED — pending Captain's
      redeploy cycle). Implemented Option (a): a new k8s_register_agent_bundles()
      (install.sh, "Step 9c") that kubectl execs into the running backoffice
