    any unexpected pod in the namespace is visible via `kubectl get pods -l yashigani.managed=true`.
  - RBAC is namespace-scoped (Role, not ClusterRole) — no cross-namespace or cluster-admin escalation possible.
  - poolManager.k8sBackend.enabled defaults to false — operators opt in explicitly; Docker/Podman deployments are
    unaffected.
