- id: YSG-RISK-103
  description: >-
    Trusted Types not enforced on any path (greenfield gap). Admin vanilla-JS
    templates use innerHTML calls in dashboard.js, login.js, runtime-settings.js etc.
    without a TT policy gate. New 4.0 user UI paths (/chat/*, /user/*, /flow/*)
    will serve Lit-based components that could be vulnerable to mXSS without TT.
    (CWE-79, ASVS V5.5.3)
  severity: medium
  controls_impacted:
  - ASVS V5.5.3 (DOM XSS / TT)
  - CWE-79 (XSS)
  compensating_controls:
  - Admin paths already have strict-CSP (script-src 'self', no unsafe-inline).
  - 4.0 user paths get full TT enforcement in Phase 1 (@strict_tt matcher).
  status: closed
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-06-27'
  closed_at: '2026-06-27'
  closure_evidence:
  - rationale: >-
      Phase 1: @strict_tt matcher on /chat/* /user/* /flow/* enables
      require-trusted-types-for 'script' + trusted-types yashigani-render.
      yashigani-render policy in static/vendor/shared-layer/safe-render.js is
      the sole registrant; no default policy (fail-closed). Admin paths (vanilla JS)
      deferred to Phase 6 per spec §2.5 sequencing invariant. Partial closure —
      RISK-103 fully closed at Phase 6 when @strict_legacy paths gain TT.
  fix_in_version: v4.0
  last_threat_model_review: '2026-06-27'

- id: YSG-RISK-104
  description: >-
