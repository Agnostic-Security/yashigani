- id: YSG-RISK-077
  description: 'BUG-C7-001: pgbouncer 1.25.1 (edoburu image) has a SCRAM-SHA-256 client-side computation bug on
    ARM64 Linux. When acting as SASL client (auth_user authenticating to postgres), it computes incorrect SCRAM
    proofs — confirmed by verbose debug logging: pgbouncer sends c-proof that does not match the expected RFC 5802
    SCRAM-SHA-256 computation from the correct cleartext password. Affects all ARM64 container runtimes: Mac Podman
    (ARM64 Lima/QEMU VM), K8s ARM64 nodes. Cycle 6 live test "PASS" was on Linux VM Podman (10.89.7.x network) —
    confirmed by IP addresses in postgres logs. Mac Podman uses 10.89.0.x network. The cycle 6 test environment
    did not match the production environment for ARM64 platforms. Root cause is likely a byte-ordering issue in
    pgbouncer 1.25.1 ARM64 SCRAM HMAC computation. Not reported upstream as of 2026-05-25.'
  severity: medium
  controls_impacted:
  - Availability — pgbouncer_authenticator cannot authenticate to postgres on ARM64; all services fail to start
  - Authentication — auth_query pattern broken (YSG-RISK-049) on ARM64 platforms
  compensating_controls:
  - cert auth + pg_ident avoids SCRAM computation entirely (cycle 7 fix — see YSG-RISK-073)
  - cert method (PG16 verify-full + pg_ident CN map) is architecturally stronger than SCRAM+clientcert
  status: closed
  closure_evidence:
  - commit: 542e800
    rationale: 'BUG-C7-001 fix (cycle 7/8): changed auth_user auth method from scram-sha-256+clientcert to cert+pg_ident.
      cert method requires pgbouncer to present its TLS client cert (pgbouncer-auth_client.crt, CN=pgbouncer-auth)
      during the TLS handshake — no SCRAM computation required. postgres verifies chain via ca_root.crt + maps CN
      to pgbouncer_authenticator via pg_ident pgb-auth-map. Platform-independent: TLS handshake is handled by OpenSSL
      (libssl), not pgbouncer SCRAM code. Live test on Mac Podman ARM64 (FULL PRODUCTION install, 13/13 complete):
      postgres log "connection authenticated: identity=CN=pgbouncer-auth,O=Agnostic Security method=cert". Backoffice
      /login 200 OK. No FATAL errors. Evidence: testing_runs/captain_bug_c7_001_scram_fix_20260525/.'
  fix_in_version: v2.24.3
  last_threat_model_review: '2026-05-25'
- id: YSG-RISK-080
  description: >-
