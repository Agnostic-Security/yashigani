- id: YSG-RISK-106
  description: >-
    LAURA-4.0-S1-001: Fail-OPEN OPA bypass in scheduled workflow execution.
    workflow_scheduler._make_scheduled_identity called non-existent
    identity_registry.get_by_id() (AttributeError silently caught), fell back to a
    synthetic identity whose slug was the raw account_id UUID. get_by_slug(UUID) returns
    None, causing fallback to {"identity_id":"internal","kind":"service"} in the router.
    OPA scope key becomes service:internal — human:idnt_* bindings never match.
    All per-user client policies were silently bypassed on every workflow step, while the
    same policies fired correctly on interactive chat/API calls. CVSS 8.2 (HIGH).
    (LAURA-4.0-S1-001, CWE-284, CWE-273)
  severity: high
  controls_impacted:
  - CWE-284 (Improper Access Control)
  - CWE-273 (Improper Check for Dropped Privileges)
  - ASVS V1.4.1 (Access Control Policy)
  - ASVS V4.1.1 (General Access Control)
  status: closed
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-07-02'
  closed_at: '2026-07-02'
  closure_evidence:
  - rationale: >-
      Four-layer fix shipped in single commit referencing LAURA-4.0-S1-001:
      (1) identity/registry.py: added get_by_account_id() with Redis index
      identity:account:{account_id} and link_account_id() to populate the index on login.
      (2) gateway/workflow_scheduler.py: _make_scheduled_identity rewritten fail-closed.
      Primary lookup: get_by_account_id(owner_identity_id); fallback: get(owner_identity_id)
      for SSO users where account_id == identity_id. Any failure returns _IDENTITY_UNRESOLVABLE
      sentinel. _execute_workflow_run blocks immediately on sentinel (run.status=blocked)
      and emits WorkflowRunFailedEvent. The silent except+synthetic-identity path is removed.
      (3) backoffice/routes/auth.py: link_account_id() called after every successful login
      in _register_human_identity_on_login() — backfills existing users on first login
      post-upgrade. Idempotent.
      (4) backoffice/routes/policies.py: bind_policy() normalizes human scope_id from
      email/slug to idnt_ PK at bind time; rejects unresolvable inputs with HTTP 400.
      Tests: 9/9 contract tests pass; 3 new tests (F1/F2/G) fail precisely on bypass regression.
      populate-demo.py: step7c_onboard_users uses SHA-256/6-digit TOTP for user logins;
      step10_bind_policies allows 409 (idempotent re-run after scope normalisation).
  fix_in_version: v4.0
  last_threat_model_review: '2026-07-02'

- id: YSG-RISK-107
  description: >-
    Email-in-header residual on 4.0 native chat path (FIND-4.0-CHAT-001 / LAURA-4.0-S1-001).
    The 4.0 backoffice chat proxy (user_ui.py /user/chat/completions) forwarded
    X-OpenWebUI-User-Email: session.account_id to the gateway, but session.account_id
    is a UUID (not an email). The gateway's _resolve_owui_forwarded_user then attempted
    email_to_slug(UUID), producing an invalid slug that never matched any identity.
    Per-user OPA/RBAC bindings were therefore silently bypassed on the 4.0 native chat
    path: all requests resolved to the owui-users baseline instead of the caller's
    identity. Same bypass class as YSG-RISK-106 (LAURA-4.0-S1-001). (CWE-284, CWE-287)
  severity: high
  controls_impacted:
  - CWE-284 (Improper Access Control)
  - CWE-287 (Improper Authentication)
  - ASVS V1.4.1 (Access Control Policy)
  - ASVS V4.1.1 (General Access Control)
  compensating_controls:
  - OPA org-ceiling deny-by-default applies at the policy layer even on baseline identity.
  - Caddy session gate ensures only authenticated users reach the proxy endpoint.
  - Internal-bearer path means no public spoofing of the forwarded header is possible.
  status: closed
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-07-03'
  closed_at: '2026-07-03'
  closure_evidence:
  - rationale: >-
      user_ui.py /user/chat/completions now resolves caller identity_id via
      identity_registry.get_by_account_id(session.account_id) (Redis key
      identity:account:{account_id} → idnt_ PK) and forwards it as
      X-Yashigani-Identity-Id: <idnt_...>. Fail-closed: if the registry is
      unavailable → 503; if no account→identity mapping exists → 403; if the
      record has no valid idnt_ PK → 503. X-OpenWebUI-User-Email is no longer
      forwarded on the 4.0 chat path.
      Gateway openai_router.py _resolve_yashigani_identity_id_header() reads
      X-Yashigani-Identity-Id on the trusted path (p2_forwarder / _INTERNAL_BEARER)
      and does a direct registry.get(identity_id) lookup (no slug derivation).
      Fail-closed: header present + not found → 403; header present + registry
      unavailable → 503; malformed (non-idnt_ prefix) → 403. Header absent →
      None (falls through to OWUI email / API-key path for backward compat).
      P1 agent branch now strips X-Yashigani-Identity-Id and emits
      AGENT_HEADER_STRIPPED (same treatment as X-OpenWebUI-User-Email).
      Caddy edge-strip of X-Yashigani-Identity-Id deferred to Su's Caddyfile
      task (header is only trusted on the internal-bearer path — defense in depth).
      12 regression tests in tests/regression/v4.0/test_identity_id_header_forwarding.py.
  fix_in_version: v4.0
  last_threat_model_review: '2026-07-03'

- id: YSG-RISK-108
  description: >-
    Mesh-port (:8081) identity-header authn bypass (LAURA-4.0 T-3 / T-4).
    The gateway MCP mesh port accepted unauthenticated POST requests and
    (T-3) promoted X-Forwarded-User to the OPA user_id without verifying the
    internal bearer; (T-4) promoted X-Yashigani-Orchestration-Depth to the
    reserved "gateway:orchestrator" caller_agent_id without verifying the
    internal bearer. An attacker with network access to port 8081 could forge
    a higher-privilege identity context on inbound MCP calls.
    (LAURA-4.0 findings T-3/T-4, CWE-284, CWE-287)
  severity: high
  controls_impacted:
  - CWE-284 (Improper Access Control)
  - CWE-287 (Improper Authentication)
  - ASVS V4.1.1 (General Access Control — mesh-port identity binding)
  compensating_controls:
  - Mesh port :8081 is inside the mTLS mesh (not exposed at the Caddy edge).
  - OPA deny-by-default applies even on forged identities at the policy layer.
  status: closed
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-07-03'
  review_by: '2026-09-30'
  closure_evidence:
  - rationale: >-
      Negative cases (T-3/T-4) hardened in mcp_router_runtime.py:
      unauthenticated caller without YASHIGANI_INTERNAL_BEARER or Caddy secret
      is NOT promoted to gateway:orchestrator (T-4) and X-Forwarded-User is
      NOT trusted (T-3). Regression tests in
      tests/regression/v4.0/test_ysg_risk_108_mesh_port_authn_bypass.py
      (10/10 PASS).
      Positive cases (internal bearer + depth header → promotion) verified in
      test_v31_mcp_caller_identity::test_orch_depth_header_sets_gateway_orchestrator_caller
      and test_v31_mcp_phase34_enforcement::test_e3_gateway_orchestrator_skips_identity_lookup
      (both updated to carry bearer, now PASS). All MCP tests 42/42 PASS.
  residuals: []
  fix_in_version: v4.0
  last_threat_model_review: '2026-07-03'

- id: YSG-RISK-109
  description: >-
    MCP identity JWT signing key is install-wide, not per-tenant.
    src/yashigani/mcp/_jwt.py McpJwtIssuer loads ONE install-wide P-384 key
    (from /run/secrets/mcp_identity_signing_key). The tenant_id argument only
    labels the kid claim (f"mcp-{tenant_id}-{mtime}") — it does NOT select a
    different key. In a multi-tenant deployment all tenants share the same
    physical signing key: a token minted for tenant A can in principle be
    verified using tenant B's key material (same key), and any entity that
    obtains the single root key can forge tokens for every tenant.
    Additionally, registry.py build_registry_from_env() explicitly uses one
    shared McpJwtIssuer for all brokers ("one key per installation, not per
    server" — Iris F-1 comment). The operator-token and step-up JWTs in
    backoffice/routes/auth.py and auth/stepup.py also use the install-wide
    caddy_internal_hmac (HS256) with no per-tenant scoping.
    (ASVS V2.1, CWE-320, CWE-321)
  severity: medium
  controls_impacted:
  - ASVS V2.1 (Cryptographic key management)
  - CWE-320 (Key Management Errors)
  - CWE-321 (Hard-coded Cryptographic Key)
  compensating_controls:
  - ES384 MCP JWTs carry an explicit "tenant" claim; OPA policies verify
    tenant-scoping at every hop.
  - The install-wide key file is mounted 0600 inside the gateway container;
    container hardening (cap_drop ALL, read_only rootfs, seccomp) limits
    exposure.
  - jti nonce dedup (RedisNonceStore) prevents replay even if key is leaked.
  status: partially_closed
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-07-03'
  review_by: '2026-12-31'
  closure_evidence:
  - rationale: >-
      PARTIAL CLOSURE (JWT per-tenant key isolation):
      auth/_jwt.py introduces derive_tenant_ec_key() using HKDF-SHA384:
        IKM  = 48-byte big-endian root key private scalar
        salt = b"yashigani-tenant-jwt-v1"
        info = b"tenant:" + tenant_id
        out  = 64 bytes → reduced mod secp384r1 order n
      McpJwtIssuer._load_or_generate_key() now derives a per-tenant P-384 key
      from the install-wide root before returning it. Two McpJwtIssuer instances
      with the same root but different tenant_ids produce cryptographically
      independent keys; McpJwtVerifier.from_issuer() captures the derived
      public key, so cross-tenant verification fails at the signature check.
      Tests: tests/unit/test_ysg_risk_078_per_tenant_jwt_isolation.py — F1/F2
      prove cross-tenant forgery is rejected; B2/C2 prove determinism.
      Committed: feat(security): per-tenant MCP JWT key isolation (YSG-RISK-109).
  residuals:
  - >-
      ROOT KEY COMPROMISE: derivation is deterministic; if the install-wide
      root key is exfiltrated, all tenant keys can be re-derived. Mitigated
      by KMS-backed root key with HSM binding in production (Nico §2).
  - >-
      REGISTRY ONE-ISSUER DESIGN: registry.py currently builds ONE shared
      McpJwtIssuer (Iris F-1) labeled with first_tenant. After this change
      that issuer uses the first_tenant's derived key, but all brokers still
      sign JWTs with that single derived key. Full per-tenant isolation
      requires registry.py to instantiate separate issuers per tenant_id.
      Deferred: requires editing registry.py (currently disjoint-locked).
  - >-
      INTERNAL BEARER (YASHIGANI_INTERNAL_BEARER): install-wide shared token
      used by agent bundles (letta, langflow, open-webui) as OPENAI_API_KEY
      shim. Per-tenant scoping requires per-tenant shim tokens and changes to
      Caddyfile routing. Deferred to a future hardening sprint.
  - >-
      CADDY_INTERNAL_HMAC (step-up JWTs, operator tokens): auth/stepup.py and
      backoffice/routes/auth.py sign HS256 JWTs with the install-wide
      caddy_internal_hmac. Per-tenant scoping deferred — step-up is admin-plane
      and already protected by AdminSession + mTLS + SPIFFE. Deferred.
  fix_in_version: v4.0
  last_threat_model_review: '2026-07-03'
- id: YSG-RISK-110
  description: >-
    letta bundle (K8s/Helm path) CrashLoopBackOff — IsADirectoryError writing
    openapi_letta.json. letta 0.16.7 (upstream, app.py:162) writes
    openapi_letta.json relative to its CWD (/app) at module import time.
    helm/yashigani/values.yaml's letta.extraVolumeMounts subPath-mounts that
    path from an emptyDir named `letta-runtime`
    (helm/yashigani/templates/agent-bundles.yaml renders the generic
    extraVolumeMounts/extraVolumes list). The emptyDir starts completely
    empty and the subPath target (openapi_letta.json) does not already exist
    in it. This is a well-known kubelet gotcha: when a subPath mount target
    does not already exist in the source volume, kubelet creates the missing
    path as a DIRECTORY (not a file), then bind-mounts that directory onto
    the intended file path inside the container. So /app/openapi_letta.json
    became a directory, and letta's `open(..., "w")` call raised
    IsADirectoryError, crash-looping the entire @letta chat path — blocking
    the specific integration Laura's adversarial probe surfaced this on
    (CWE-706, related to CWE-27 misconfiguration class).
    Found live by Laura's red-team pass against the 4.1.2 k3s/Cilium e2e
    deploy (2026-07-28), on an otherwise fully-green stack (all other 25
    pods healthy, image provenance verified).
  severity: medium
  controls_impacted:
  - Availability — @letta chat path fully broken (the historically critical
    4.1.2 break this exact class of bug caused before)
  - Agent dispatch — letta orchestrating-brain (Design A) path cannot start
  compensating_controls:
  - No security boundary crossed — availability-only impact, contained to the
    letta bundle's own pod (readOnlyRootFilesystem, cap_drop ALL,
    allowPrivilegeEscalation:false all remain intact regardless of this bug).
  - The other 3 agent paths (@langflow, @openclaw, direct model) and OPA
    enforcement are unaffected — this is scoped to letta's own
    openapi_letta.json write, not a shared mesh/gateway component.
  closure_evidence:
  - rationale: >-
      Fix PREPARED and committed in helm/yashigani/templates/agent-bundles.yaml
      + helm/yashigani/values.yaml: added generic `extraInitContainers`
      support to the shared agent-bundles.yaml template (any bundle can now
      declare initContainers), and wired a `pre-touch-letta-openapi-file`
      initContainer (busybox:1.37, non-root UID 65534, readOnlyRootFilesystem,
      cap_drop ALL) that mounts the `letta-runtime` emptyDir at its ROOT
      (not via subPath) and `touch`es openapi_letta.json into existence
      BEFORE the main letta container's subPath mount is established.
      Since the file now pre-exists as a real file in the source volume,
      kubelet correctly bind-mounts a file (not a directory) onto
      /app/openapi_letta.json. Standard, documented K8s workaround for this
      exact subPath-of-nonexistent-path gotcha.
      Verified via `helm lint` + `helm template --show-only
      templates/agent-bundles.yaml` (renders correctly, initContainer +
      volumeMount present) + `kubectl apply --dry-run=server` (validates
      clean against the live cluster's API server with zero mutation).
      NOT YET verified live: Ava was mid-flight on the same deployed stack
      at finding time — applying this fix (helm upgrade / targeted letta
      redeploy) was deliberately held until Ava's e2e pass completed, to
      avoid release-wide churn disrupting her run. Live redeploy + full
      @letta/@langflow/@openclaw/direct-model chat-path verification
      (OPA-enforced) is the immediate next step once cleared to proceed.
  status: mitigated_pending_verify
  pending_verification: >-
    Per Lu's findings audit (2026-07-28): closure_evidence above is static-only
    (helm lint/template/dry-run); no live cluster confirmation. Downgraded from
    `mitigated` — closure requires the deferred clean k8s redeploy (k8s leg
    paused per Tiago for the Docker/Podman legs) confirming all 4 chat targets
    (@letta/@langflow/@openclaw/direct-model) live, with yashigani-letta
    reaching Running with 0 IsADirectoryError crashes.
  fix_in_version: v4.1.2
  last_threat_model_review: '2026-07-28'
- id: YSG-RISK-111
  description: >-
    ollama StatefulSet replica/model asymmetry — half of all chat/inference
    calls hang. helm/yashigani/values.yaml default was ollama.replicaCount: 2
    ("2 replicas for HA"). Each StatefulSet replica gets its OWN PVC via
    volumeClaimTemplates. helm/yashigani/templates/ollama.yaml's
    yashigani-ollama-init Job pulls the configured model via a single set of
    `OLLAMA_HOST=http://yashigani-ollama:11434 ollama pull ...` calls against
    the `yashigani-ollama` Service — a normal ClusterIP Service picks ONE
    backend pod per connection, so the pull lands entirely on ONE replica
    (ollama-0). Every other replica's PVC (ollama-1, ...) keeps an EMPTY
    model catalog. Real inference traffic round-robins across replicas via
    the same Service: roughly half of all @letta/@langflow/@openclaw/
    direct-model chat calls hit the empty-catalog replica and hang/404.
    Found live by Ava's e2e against the 4.1.2 k3s/Cilium deploy (2026-07-28)
    — chat blocked across all 4 targets on an otherwise green stack.
    (CWE-1188 Insecure Default Initialization of Resource — availability
    class, not a security-boundary crossing.)
  severity: medium
  controls_impacted:
  - Availability — ~50% of all LLM inference calls hang/fail depending on
    which replica the Service round-robins a connection to
  - Agent dispatch — @letta/@langflow/@openclaw/direct-model chat all
    affected equally (shared ollama backend)
  compensating_controls:
  - No security boundary crossed — purely an availability/capacity-planning
    defect, contained to the ollama StatefulSet's own model-catalog state.
  closure_evidence:
  - rationale: >-
      Fixed by setting ollama.replicaCount default 2 -> 1 in
      helm/yashigani/values.yaml. Two independent justifications: (1) this is
      also the functionally correct value for any single-GPU deployment (the
      common shape for self-hosted Yashigani — see project sizing notes,
      ~50 users/RTX3060) — a second replica cannot usefully hold the SAME
      model concurrently in the SAME one GPU's VRAM, it only adds
      contention, never capacity; (2) regardless of GPU count, the
      ollama-init Job's pull-via-round-robin-Service design is broken for
      ANY replicaCount > 1 until that Job is rewritten to pull per-pod
      (e.g. iterate StatefulSet stable pod DNS names ollama-0.<headless-svc>,
      ollama-1.<headless-svc>, ... instead of the round-robin Service VIP).
      helm/yashigani/values.single-node.yaml already had replicaCount: 1
      correct as an optional overlay, but install.sh's k8s path never layers
      it in, so every k8s install got the broken default regardless — fixed
      by correcting the chart's own baseline default instead of relying on
      an overlay operators may not know to pass.
      RESIDUAL (not fixed here, documented as a follow-up): true multi-GPU
      multi-replica scale-out requires the ollama-init Job to be rewritten
      to pull the model onto every replica's PVC individually before
      replicaCount > 1 is safe again. ollama.hpa.* values in values.yaml are
      NOT wired to any live HorizontalPodAutoscaler object in this chart
      (no HPA template exists for ollama) — currently inert/dead config, so
      autoscaling cannot reintroduce this bug today, but whoever eventually
      wires HPA up must gate it on the per-pod-pull fix above.
      Staged, NOT yet applied to the live stack — held pending Ava's e2e
      completion + Tom's gateway event-loop-stall fix, to land in one clean
      redeploy rather than mid-flight churn.
  status: mitigated_pending_verify
  pending_verification: >-
    Per Lu's findings audit (2026-07-28): closure_evidence above states the
    replicaCount fix was staged/not yet applied to the live stack at finding
    time. Downgraded from `mitigated` — closure requires the deferred clean
    k8s redeploy (paused per Tiago for the Docker/Podman legs) confirming all
    4 chat targets (@letta/@langflow/@openclaw/direct-model) live with a
    single ollama replica and a fully-populated model catalog.
  fix_in_version: v4.1.2
  last_threat_model_review: '2026-07-28'
- id: YSG-RISK-112
  description: >-
    gateway logs `ERROR:yashigani.db:yashigani_app credential sync skipped —
    cannot read /run/secrets/postgres_password: [Errno 2] No such file or
    directory` repeatedly at startup (once per gateway replica) on the K8s
    path. src/yashigani/db/__init__.py's _sync_app_role_password() (called
    from run_migrations(), which gateway's own entrypoint.py also invokes)
    tries to read postgres_password as a FILE at
    ${YASHIGANI_SECRETS_DIR:-/run/secrets}/postgres_password to replace
    migration 0001's placeholder password on the yashigani_app role.
    K8s delivers postgres_password to gateway ONLY via a secretKeyRef env
    var (POSTGRES_PASSWORD, interpolated into YASHIGANI_DB_DSN via K8s'
    native $(POSTGRES_PASSWORD) env-var substitution) — gateway.yaml's
    copy-pki-to-writable initContainer copies pki-ro/license-ro/
    mcp-signing-key-ro into the writable secrets emptyDir but does NOT copy
    postgres_password the way backoffice.yaml's equivalent initContainer
    does, so the file gateway is looking for never exists on K8s.
    Investigated per Maxine's "confirm cosmetic or file it": NOT purely
    cosmetic. In THIS observed deploy it is non-fatal because backoffice's
    OWN copy of _sync_app_role_password() (which DOES have the file) already
    successfully syncs the real password onto the yashigani_app role before
    gateway's redundant attempt runs — gateway's own DB connections use the
    correct password via the separate env-var-interpolation path regardless
    of this failed file read. But this is a race-dependent, not
    architecturally-guaranteed, safety net: if gateway's migration pass runs
    before backoffice's ever succeeds (e.g. backoffice delayed/crash-looping
    on a future regression), NEITHER replica would ever successfully sync
    the real password, reproducing the exact migration-0001-placeholder
    class of bug this session already saw block letta earlier (password
    authentication failed for user "yashigani_app").
  severity: low
  controls_impacted:
  - Availability — latent race window to the placeholder-password class of
    bug if backoffice's own sync is ever delayed/absent
  - Operational hygiene — logger.error (not warning) severity produces
    alarming, misleading log noise on every gateway startup in normal
    operation
  compensating_controls:
  - backoffice's copy-pki-to-writable initContainer already has the correct
    postgres_password file-copy step and runs its own successful sync,
    which is what actually protects this deploy today.
  - _sync_app_role_password() fails closed/logged (never silently
    half-applies a password change) — the DB role itself is never left in
    an inconsistent state by gateway's failed attempt, only unchanged.
  status: open
  accepted_by: null
  review_by: '2026-08-15'
  fix_in_version: null
  last_threat_model_review: '2026-07-28'
  residuals:
  - >-
      Fix not yet implemented (flagged non-blocking for the current redeploy
      per Maxine): mirror backoffice.yaml's copy-pki-to-writable
      initContainer pattern in gateway.yaml — add postgres-secret-ro volume
      + copy step so gateway's own postgres_password file exists at
      /run/secrets/postgres_password, closing the parity gap and the log
      noise. Deferred to a follow-up dispatch, not required for THIS
      redeploy since backoffice's sync already covers the live risk.
- id: YSG-RISK-114
  description: >-
    Kyverno restrict-root-user ClusterPolicy hard-blocks letta + ollama-init
    at admission time on a clean K8s redeploy — zero pods ever created.
    letta (agent-bundles.yaml podSecurityContext runAsNonRoot:false/
    runAsUser:0 — upstream letta/letta:0.16.7 image requires root for
    /root/.letta persistence) and ollama-init-job.yaml (same documented root
    requirement to pull models into the shared /data volume) are both
    pre-existing, intentionally-accepted root workloads with documented
    compensating controls (seccomp RuntimeDefault, cap_drop ALL,
    allowPrivilegeEscalation:false, NetworkPolicy restricting egress). The
    yashigani-yashigani-restrict-root-user ClusterPolicy
    (validationFailureAction: Enforce, YSG-RISK-008) has ZERO exception
    mechanism for either — every pod create attempt for both workloads was
    denied by the admission webhook: "FailedCreate ... sets runAsUser: 0 at
    pod level. Root containers are not permitted." On earlier attempts this
    session the block did not surface (a startup race — Kyverno's webhook
    was not yet enforcing at the exact moment these pods were first
    created), giving a false impression the policy and these workloads
    coexisted safely; this clean redeploy (Kyverno already warmed up from
    prior runs) proved the coexistence was never actually safe.
    (CWE-693 Protection Mechanism Failure — a security control blocking a
    documented, approved exception path with no carve-out; availability
    impact, not an exploitable weakening.)
  severity: medium
  controls_impacted:
  - Availability — letta (the @letta chat path) and ollama model provisioning
    both fail to deploy at all when this policy is actively enforcing
  compensating_controls:
  - No security weakening — the fix narrowly excludes only the two
    already-documented, already-accepted root workloads by exact label
    selector; every other pod in the namespace remains fully subject to the
    policy.
  status: mitigated
  closure_evidence:
  - rationale: >-
      Kyverno's PolicyException CRD (the standard first-class mechanism for
      this) is unavailable on this cluster: kyverno-admission-controller
      runs with --enablePolicyException=false, a shared cluster-wide Kyverno
      setting outside this chart's ownership (not changed — reconfiguring a
      shared platform component for one workload's convenience was
      rejected as the wrong fix here).
      Fix: added exclude: blocks directly to both restrict-root-pod-level
      and restrict-root-container-level rules in this ClusterPolicy's own
      spec (helm/yashigani/templates/admission-policies.yaml) — core
      Kyverno match/exclude functionality, always available regardless of
      the PolicyException controller flag. Scoped by
      app.kubernetes.io/name selector (In: [letta, yashigani-ollama-init])
      only.
      Applied live (kubectl apply on the ClusterPolicy object directly —
      a chart-owned, namespace-scoped resource, not a pod/secret hand-hack)
      to unblock the in-flight clean redeploy without a second full
      rebuild-and-teardown cycle; source template committed to match, so
      future installs get the fix via helm directly. Verified live:
      yashigani-letta reached 2/2 Running (0 restarts) and
      yashigani-ollama-init reached Completed immediately after the policy
      update, on the very next controller retry — no pod/workload spec
      changed, confirming the admission policy was the sole blocker.
  fix_in_version: v4.1.2
  last_threat_model_review: '2026-07-28'

- id: YSG-RISK-113
  description: >-
    A single unhealthy/slow Ollama backend (no model loaded, or generation
    stalled) blocks the gateway's ASGI event loop and takes down the
    /healthz liveness/readiness probe on that SAME pod, causing kubelet to
    kill an otherwise-healthy gateway replica — availability/DoS class.
    Live-reproduced by Ava on the k8s stack (2026-07-28): a chat/model call
    to an ollama replica with no model hung >90s; gateway log showed
    "could not fetch ollama model list ... available_models=None" followed
    by the chat completion hanging; kubelet restarted the gateway pod
    mid-request (2nd restart observed live).
    Root cause: the request-inspection pipeline (inspection/pipeline.py
    InspectionPipeline.process(), called from gateway/proxy.py:896) and the
    response-inspection pipeline (inspection/pipeline.py
    ResponseInspectionPipeline.inspect(), called from
    gateway/openai_router.py chat_completions + gate_relaxed_final,
    gateway/agent_router.py route_agent_call, and
    gateway/mcp_router_runtime.py _handle_mcp_call_inner) are plain
    SYNCHRONOUS methods. They call inspection/backend_registry.py
    BackendRegistry.classify(), which sequentially tries the active backend
    plus every entry in the fallback chain (inspection/backends/ollama.py
    OllamaBackend.classify() / inspection/classifier.py
    PromptInjectionClassifier.classify()), each performing a genuinely
    BLOCKING httpx.Client call (inspection/_ollama_transport.py
    ollama_post_json/ollama_get_json, default 30s timeout per backend) via
    ollama_sync_client(). These sync calls were invoked DIRECTLY inside
    `async def` FastAPI request handlers with no thread offload
    (asyncio.to_thread / run_in_executor), so each blocking call — and the
    cumulative chain across request-side + response-side inspection plus a
    multi-backend fallback chain — monopolizes the single-threaded asyncio
    event loop for its full duration. `gateway/proxy.py`'s
    `/healthz` (`async def healthz(): return {"status": "ok"}`) is
    otherwise instant and carries no blocking work of its own, but cannot be
    scheduled while the loop is held hostage by the classify() call, so
    kubelet's liveness/readiness probe times out and kills the pod — even
    though the pod's actual dependencies (DB, Redis, OPA) are healthy.
    The same synchronous-classify pattern also existed in
    gateway/orchestrator.py's `_classify_sensitivity()` / `_inspect_result()`
    helpers (agent/MCP-tool-result egress-sensitivity + response-inspection
    legs of the agent orchestrator), called from `_execute_mcp_tool`,
    `_execute_api_call`, `_execute_tool_call`, `_run_letta_brain_loop`, and
    `run_orchestration` — all `async def` — with the same blocking-call
    exposure on the agent-upstream path explicitly in scope for this fix.
  severity: high
  controls_impacted:
  - Availability — CWE-400 (Uncontrolled Resource Consumption) / CWE-833
    (Deadlock-adjacent event-loop starvation) — a single slow/dead backend
    can take down a gateway replica's health probe and trigger a kubelet
    restart mid-request, independent of any actual infra failure.
  - OWASP API4:2023 (Unrestricted Resource Consumption)
  compensating_controls:
  - K8s/Helm normally runs >1 gateway replica behind a Service, so a single
    killed pod does not fully outage the deployment — but under sustained
    Ollama unavailability every replica can be hit in turn, and each restart
    drops in-flight requests on that pod.
  status: closed
  accepted_by: null
  accepted_at: null
  review_by: null
  last_threat_model_review: '2026-07-28'
  closure_evidence:
  - rationale: >-
      (1) Offloaded every blocking classify()/inspect() call to a worker
      thread via asyncio.to_thread() at all call sites: gateway/proxy.py
      (_handle_request → pipeline.process), gateway/openai_router.py
      (chat_completions + gate_relaxed_final →
      response_inspection_pipeline.inspect), gateway/agent_router.py
      (route_agent_call → response_inspection_pipeline.inspect),
      gateway/mcp_router_runtime.py (_handle_mcp_call_inner →
      response_inspection_pipeline.inspect), and gateway/orchestrator.py
      (_classify_sensitivity / _inspect_result converted to `async def`,
      internally awaiting asyncio.to_thread; all 7 call sites across
      _execute_mcp_tool, _execute_api_call, _execute_tool_call,
      _run_letta_brain_loop, run_orchestration updated to `await`). This is
      the primary fix — the event loop is never held by a backend call, so
      /healthz stays responsive regardless of backend health.
      (2) inspection/_ollama_transport.py: explicit httpx.Timeout with a
      fast-failing 5s connect-phase ceiling (_build_timeout /
      _CONNECT_TIMEOUT_CEILING), decoupled from the caller's read timeout,
      so a completely unreachable backend fails in seconds instead of
      waiting out the full read timeout meant for a slow-but-alive model.
      (3) inspection/backend_registry.py: per-backend-name circuit breaker
      (_BREAKER_FAILURE_THRESHOLD=3, _BREAKER_COOLDOWN_SECONDS=30) —
      BackendRegistry._try_backend() skips the network call entirely for a
      backend that just failed repeatedly, bounding worst-case per-request
      latency during a sustained outage instead of re-paying the full
      timeout on every request.
      Verified locally (no k8s deploy): asyncio-based test proves /healthz
      responds in <100ms while a concurrent classify() call is blocked on
      an unresponsive upstream for multiple seconds on the SAME event loop;
      circuit-breaker test proves a backend open-circuited after 3
      failures is skipped without a network call. ruff clean; full gateway
      + orchestrator + inspection unit/regression subset green (792 passed,
      4 pre-existing unrelated failures confirmed present before this fix
      via git stash, 3 skipped).

- id: YSG-RISK-125
  description: >-
    K8s/Helm backoffice path: ALL 4 chat/agent targets (@letta, @langflow,
    @openclaw, direct model) returned {"error":"gateway_unreachable"} from
    POST /user/chat/completions on the otherwise fully-green 4.1.2 k3s/Cilium
    e2e deploy (2026-07-28), post letta+ollama+gateway-event-loop fixes
    (YSG-RISK-110/111/113). Backoffice logs showed
    `user_chat_proxy: gateway unreachable: [Errno -2] Name or service not
    known` — a DNS resolution failure, not a network-policy or mTLS block.
    Root cause: src/yashigani/backoffice/routes/user_ui.py:993 and
    src/yashigani/backoffice/routes/user_agents.py:1944/2167 all resolve the
    gateway's internal mesh URL via
    `os.environ.get("YASHIGANI_GATEWAY_MESH_URL", "http://gateway:8081/v1")`.
    The bare hostname "gateway" is a Compose-only convention (the compose
    service is literally named `gateway`); on k8s the gateway's Service is
    `yashigani-gateway` (helm/yashigani/templates/gateway.yaml, http-mesh
    port 8081). helm/yashigani/templates/backoffice.yaml never set
    YASHIGANI_GATEWAY_MESH_URL at all, so backoffice on k8s ALWAYS fell
    through to the broken compose default and could never resolve gateway's
    hostname — a Compose<->K8s name-resolution parity gap (the same bug
    class Captain's own Verification Protocol #1 sweeps for via
    `host=postgres |host=pgbouncer |host=redis |...` grep patterns, but this
    instance is a Python-level os.environ default rather than a Helm
    template string literal, so the literal grep pattern didn't catch it).
    Found live while verifying Maxine's GO redeploy item (b) — all 4 chat
    targets end-to-end via the node-IP path.
  severity: high
  controls_impacted:
  - Availability — every user-facing chat/agent path (@letta, @langflow,
    @openclaw, direct model) was completely broken on k8s; no chat target
    could ever reach the gateway regardless of any other fix.
  compensating_controls:
  - No security boundary crossed — this is a pure connectivity/name-
    resolution defect, not an authz/authn bypass. The 401 on unauthenticated
    direct /v1/chat/completions calls and OPA policy enforcement on the
    gateway side remain unaffected once connectivity is restored.
  closure_evidence:
  - rationale: >-
      Fixed in helm/yashigani/templates/backoffice.yaml: added an explicit
      `YASHIGANI_GATEWAY_MESH_URL` env var set to
      "http://yashigani-gateway:8081/v1" (matching the actual k8s Service
      name and the http-mesh port already used elsewhere in the chart for
      internal gateway calls), overriding the broken compose-only default.
      Values/template-only change — no image rebuild required. Verified via
      `helm lint` + `helm template --show-only templates/backoffice.yaml`
      (env var renders correctly) before live application via targeted
      `helm upgrade`. Live re-test of all 4 chat targets
      (@letta/@langflow/@openclaw/direct model) via
      POST /user/chat/completions with an authenticated end-user session
      is the immediate next verification step.
  status: mitigated_pending_verify
  pending_verification: >-
    Per Lu's findings audit (2026-07-28): closure_evidence above is helm
    lint/template render verification only; the "immediate next
    verification step" (live chat-target re-test) is not yet done.
    Downgraded from `mitigated` — closure requires the deferred clean k8s
    redeploy (paused per Tiago for the Docker/Podman legs) confirming all 4
    chat targets (@letta/@langflow/@openclaw/direct-model) live via an
    authenticated end-user POST /user/chat/completions session.
  fix_in_version: v4.1.2
  last_threat_model_review: '2026-07-28'

- id: YSG-RISK-126
  description: >-
    K8s/Helm pre-install/pre-upgrade hook Jobs that call the k8s API server
    (admin-bootstrap-job.yaml's `applier` container and mtls-bootstrap-job.yaml's
    `applier` container — both run `kubectl apply` to write the Secret they
    mint) had NO NetworkPolicy egress rule permitting that traffic.
    default-deny-egress (podSelector: {} — applies to every pod in the
    namespace) blocks it; only allow-dns-egress is similarly
    podSelector-less, so these Jobs could resolve DNS but never actually
    connect to the apiserver ClusterIP. Reproduced live (2026-07-28) applying
    the YSG-RISK-125 fix via `helm upgrade`: the admin-bootstrap Job's
    applier container hung with ZERO log output, `kubectl exec` into the
    stuck pod showed `wget https://kubernetes.default.svc:443` timing out,
    and the pod's labels (app.kubernetes.io/component=bootstrap) matched no
    NetworkPolicy in the namespace. Job hit backoffLimit=2 (3 total
    attempts) and failed, aborting the helm upgrade
    ("pre-upgrade hooks failed: resource Job/.../yashigani-admin-bootstrap
    not ready. status: Failed"). The identical failure signature appears
    earlier in this release's own history (revision 2, same message,
    at the time misattributed to an unrelated Kyverno field-manager issue).
    Masked on `helm install` by a startup race: Cilium's eBPF datapath takes
    a few seconds to program after a NetworkPolicy object is created, and a
    fresh install's hook Job pod sometimes completes within that unenforced
    window; on `helm upgrade` against an already-running release the policy
    has been enforcing for its entire lifetime, so the Job reliably hangs.
  severity: high
  controls_impacted:
  - Availability — every `helm upgrade` against a live release with the
    admin-bootstrap or pki-bootstrap Secret NOT already fully populated (i.e.
    every genuinely-first bootstrap, and any future rotation flow) would hang
    and fail the upgrade, independent of any application-layer bug.
  compensating_controls:
  - No security boundary crossed — pure connectivity gap, not an authz bypass.
  - Idempotent "preserve if already populated" design in both bootstrap Jobs
    means an upgrade where the Secrets are ALREADY correctly populated (the
    common case post-initial-install) can be recovered with `--no-hooks`
    without any data loss or security regression, buying time to land this
    fix — used as the immediate workaround for this exact incident.
  status: mitigated
  closure_evidence:
  - rationale: >-
      Fixed in helm/yashigani/templates/networkpolicy.yaml: new NetworkPolicy
      `allow-bootstrap-jobs-apiserver-egress` (inserted after
      allow-dns-egress) — podSelector matchExpressions
      app.kubernetes.io/component In [bootstrap, pki], egress to an ipBlock
      resolved via `lookup "v1" "Service" "default" "kubernetes"` (same
      lookup() precedent already used elsewhere in this chart for CRD/Secret
      detection, so the CIDR is cluster-correct at template time rather than
      a hardcoded guess; falls back to k3s's documented default 10.43.0.1/32
      only when lookup() returns empty, i.e. `helm template`/
      `--dry-run=client` with no live cluster connection). Verified render
      via `helm upgrade --dry-run=server` (confirms the resolved CIDR
      matches the live cluster's actual `kubernetes` Service ClusterIP).
      Verified live: recovered the stuck release via `helm upgrade
      --no-hooks` (bootstrap Secrets already correctly populated from
      earlier revisions — confirmed via the minter initContainer's
      idempotent "already minted" log with preserved original timestamps),
      landing this policy; a subsequent `helm upgrade` WITH hooks enabled
      is the pending full-cycle verification (hooks were skipped on the
      immediate recovery upgrade specifically to land this fix without
      re-hitting the same chicken-and-egg ordering problem in one step).
  fix_in_version: v4.1.2
  last_threat_model_review: '2026-07-28'

- id: YSG-RISK-127
  description: >-
    K8s/Helm: backoffice's user_chat_proxy / user_agents proxy
    (src/yashigani/backoffice/routes/user_ui.py `user_chat_proxy`,
    user_agents.py's forward-to-gateway helpers — the trusted-forwarder
    `/user/chat/completions` and `/user/agents/*` paths, FIND-4.0-CHAT-001)
    forwards every end-user chat/agent call to gateway's internal mesh port
    8081 via `YASHIGANI_INTERNAL_BEARER`. NEITHER `allow-backoffice-egress`
    NOR `allow-gateway-ingress` (helm/yashigani/templates/networkpolicy.yaml)
    had a rule permitting backoffice -> gateway:8081 traffic — under
    default-deny-egress/ingress every one of these calls was silently
    dropped. Manifested as `httpx.ConnectTimeout` (an EMPTY-message
    exception) inside user_ui.py's `_stream_gateway()` generator; the
    ConnectTimeout is NOT a subtype of `httpx.ConnectError`
    (it's a `httpx.TimeoutException` subtype), so it fell through the
    specific `except httpx.ConnectError` handler (which yields the more
    diagnostic "gateway_unreachable" message) into the generic
    `except Exception` handler, surfacing to the end user as an
    uninformative `{"error":"stream_error","message":"Unexpected error
    streaming from gateway."}` with a misleading HTTP 200 (StreamingResponse
    had already started). Confirmed live: `kubectl exec` into a running
    backoffice pod, a direct httpx call to
    `http://yashigani-gateway:8081/v1/chat/completions` raised
    `httpx.ConnectTimeout('')` after the connect timeout elapsed; gateway
    pod logs showed ZERO corresponding request log lines for any of the 4
    chat targets tested (@letta/@langflow/@openclaw/direct model) — the
    traffic never reached the gateway process at all, consistent with a
    silent NetworkPolicy drop rather than an application-level rejection.
    Found immediately after fixing YSG-RISK-125 (the DNS-resolution gap) —
    that fix was necessary but not sufficient; this is the SECOND, separate
    layer blocking the same feature.
  severity: high
  controls_impacted:
  - Availability — every user-facing chat/agent path (@letta, @langflow,
    @openclaw, direct model) remained completely broken on k8s even after
    the YSG-RISK-125 DNS fix, because the traffic was reachable by name but
    still denied at L3/L4 by NetworkPolicy.
  compensating_controls:
  - No security boundary crossed — this widens backoffice's own egress and
    gateway's own ingress ONLY for the exact traffic the trusted-forwarder
    feature is designed to carry (backoffice already holds
    YASHIGANI_INTERNAL_BEARER and is the sole intended caller of this path);
    no other pod gains new access as a result of this change.
  status: mitigated
  closure_evidence:
  - rationale: >-
      Fixed in helm/yashigani/templates/networkpolicy.yaml: added a
      `from: backoffice` entry (port 8081) to `allow-gateway-ingress`'s
      existing port-8081 ingress block (alongside open-webui and the agent
      bundle pods), and a symmetric `to: gateway` entry (port 8081) to
