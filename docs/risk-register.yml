      compose's register_agent_bundles(), idempotent by agent name. Wired
      into the k8s sequence right after k8s_verify_image_provenance and
      before k8s_print_access.

      DIVERGED FROM CAPTAIN'S DIRECT-SERVICE-URL HYPOTHESIS, with evidence:
      checked src/yashigani/gateway/_dispatch_client.py and agent_router.py —
      agent_dispatch_client() unconditionally presents the mesh
      ServiceIdentity client leaf, and the v4.1 §2.5 dispatch-repoint comment
      states registered upstreams MUST be the agent's Caddy ingress front
      (require_and_verify): "a bare client is refused at the TLS handshake
      and every dispatch fails closed." A direct Service URL
      (http://yashigani-<agent>:<port>) bypasses that front and either fails
      closed or silently drops the mTLS peer-auth invariant compose enforces
      (§2.6: Caddy is each agent's sole legitimate ingress peer) — the
      allow-gateway-egress NetworkPolicy Captain found permitting direct
      reach is a transitional allow (UA-10, retired by the split-ringfence
      parity step), not a green light to route through it.

      Registered upstream_url is instead the SAME Caddy-ingress-front shape
      compose uses: https://yashigani-caddy-mesh:<meshPort>/agents/<tenant>/<system>
      (langflow meshPort 9705, letta 9775, openclaw 9671, tenant "default" —
      identical to compose's pinned ports). This front (yashigani-caddy-mesh
      Service + 4 NetworkPolicies) was ALREADY FULLY BUILT in the chart
      (helm/yashigani/templates/agent-ingress-fronts.yaml +
      caddy-agents-configmap.yaml, gated on .Values.agentIngressFronts, with
      ready per-agent codegen overlays values-{langflow,letta,openclaw}-ingress.yaml)
      but was never passed to helm — k8s_helm_install() only ever layered the
      EGRESS-forwarder overlay (values-<agent>-egress.yaml, outbound LLM
      traffic), never the ingress one. Fixed k8s_helm_install() to layer
      both overlays (fail-closed if either is missing, same pattern). Verified
      with `helm template`: all 4 agent-ingress-front NetworkPolicies + the
      yashigani-caddy-mesh Service render correctly for langflow/letta/openclaw
      once the overlay is layered (previously rendered nothing —
      agentIngressFronts stayed {} on every k8s install to date).

      Token handling: no fresh token generated on k8s (unlike compose) — each
      agent's existing stable token is read from its Helm-managed K8s Secret
      (yashigani-<agent>-token, key "token") via `kubectl get secret -o
      jsonpath` + base64 decode, then bcrypt-hashed and upserted. No pod
      restart needed (token was already correctly wired via
      agentBundles.<agent>.tokenSecretName). Piped to the in-pod Python via
      stdin (kubectl exec -i <<<"$agents_json"), not -e/env or a CLI arg, to
      keep the token out of `ps` output and the exec command line.

      Verified: bash -n install.sh clean; shellcheck -x install.sh — zero
      new findings in the touched region (lines ~14051-14453); helm lint +
      helm template clean with all three -egress/-ingress overlay pairs
      layered together.

      NOT YET LIVE-VERIFIED: per dispatch, Su does not touch the live k8s
      cluster. Captain owns the redeploy cycle and will confirm all 4 chat
      targets (letta/langflow/openclaw/direct-model) return real responses.
      This entry should be re-reviewed after that confirmation lands.
  fix_in_version: v4.1.2

- id: YSG-RISK-131
  description: >-
    K8s/Helm chat blocker, live-reproduced by Iris (4.1.2, `fix/v412-e2e-x8x-
    20260725`): both `yashigani-gateway-*` pods, 17h uptime, 0 restarts,
    PERMANENTLY degraded. `gateway/entrypoint.py`'s cold-boot init (was
    lines ~192-234) builds `rbac_store` / `agent_registry` /
    `capability_policy_store` / `permission_store` in a single try/except —
    no retry, no self-heal — sharing the SAME class of bug as the already-
    fixed backoffice YSG-RISK-122. On k8s, `yashigani-redis:6380` Service-DNS
    is not resolvable at that exact instant (`Error -2 ... Name or service
    not known` — the Redis Pod can be scheduled after the gateway Pod, and
    headless-Service DNS only populates once the Pod IP registers with
    kube-dns); the single attempt fails once and `agent_registry` (plus the
    other three) stays `None` for the pod's ENTIRE lifetime. Live gateway
    logs confirmed the failure fires ONCE at boot and never retries:
    "RBAC/Agent Redis unavailable (Error -2 ...) — RBAC and agent routing
    disabled" with no later "Gateway RBAC store ready" / "agent registry
    ready" line ever appearing. Result: `/user/chat/completions` returned
    `agent_registry_unavailable` for every @agent call and degraded routing
    for the direct-model path, even though agents WERE registered in
    Postgres (YSG-RISK-130 had already fixed registration — this is a
    SEPARATE, later-stage blocker in the same chat-verification chain: 125
    DNS -> 126/127 NetworkPolicy -> 128 Ollama mesh -> 129 crash-on-failure
    -> 130 agent registration -> 131 boot-race self-heal). `proxy.py`'s
    lifespan agent-reconcile (ISSUE-AGENT-REG-DURABILITY) cannot recover this
    state either — it only refills an EXISTING registry object, and is a
    no-op when `agent_registry is None`. docker/podman compose ordering
    (`depends_on: condition: service_healthy`) hides this class entirely,
    which is why it shipped unnoticed until a live k8s deployment reproduced
    it. Iris's systemic follow-up review (remediation_map.md) found the SAME
    unretried-one-shot-try/except shape repeated across 13 total gateway
    Redis-dependent subsystems (rate_limiter, endpoint_rate_limiter,
    response_cache, jwt_inspector, identity_registry, budget_enforcer,
    cloud_override_getter, model_allocation_store, model_alias_store,
    workflow_scheduler, ddos_protector, egress_limit_enforcer, plus this
    finding's rbac/agent/cap-policy/permission-store row) and 6 further
    instances on the backoffice admin plane (P2, smaller blast radius,
    tracked as a documented follow-up, not this finding).
  severity: high
  controls_impacted:
  - Availability — the entire chat feature surface (agent calls AND
    direct-model routing degradation) can be silently, permanently disabled
    by a transient boot-order race, on every fresh k8s install, with the pod
    reporting healthy (0 restarts) throughout — a "healthy-looking zombie"
    that evades the existing `/healthz`-only install-time convergence gate.
  - Defense-in-depth silently disabled — 12 further Redis-backed security/
    reliability controls (rate limiting, DDoS throttle, JWT validation,
    per-endpoint rate caps, egress rate cap, budget enforcement) share the
    identical class of permanent silent degradation.
  compensating_controls:
  - No auth/authz boundary is crossed — every degraded path already fails
    CLOSED (503/agent_registry_unavailable, rate limiting simply disabled
    rather than fail-open bypass, etc.); this finding is an AVAILABILITY gap
    (feature silently stops working), not a security-bypass gap.
  - A full pod restart (kubectl rollout restart / pod eviction) always
    recovers the affected pod, since cold boot re-attempts the same
    connection — operators are not permanently stuck, just unaware the
    degradation is silent and requires a manual restart absent this fix.
  status: mitigated
  accepted_by: null
  accepted_at: null
  review_by: null
  last_threat_model_review: '2026-07-28'
  closure_evidence:
