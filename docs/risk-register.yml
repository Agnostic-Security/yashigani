  status: closed
  closure_evidence:
  - rationale: >-
      3.x jwt_inspector retains the gold-plated SSRF-guarded JWKS client (8 guard
      references); the basic 2.25.5 guard was intentionally NOT ported (superseded).
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-085
  description: >-
    YSG-084-2255 (converged). Install convergence race: on a heavy fresh install
    (all agent/SIEM profiles) a slow postgres first-initdb could exceed its
    healthcheck start_period, so compose aborted dependent app-tier containers to
    "Created" and the gateway never started, failing the convergence gate. Fix:
    postgres start_period 180s->300s + install.sh convergence-gate self-heal (one
    idempotent re-converge + re-poll before failing closed).
  severity: low
  controls_impacted:
  - Deterministic clean-install convergence (operability)
  status: closed
  closure_evidence:
  - rationale: >-
      start_period 300s + self-heal block present in install.sh. Live-verified:
      v3.0.0 clean-from-scratch installs came up green unattended (multiple cycles).
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-086
  description: >-
    LAURA-3X-001 (v3.0.0 pre-release pentest, MEDIUM). The login brute-force
    throttle keyed on request.client.host, which behind Caddy (sole ingress) is
    always the Caddy container IP — collapsing every client into one throttle
    bucket. An unauthenticated source could trip the per-IP/global throttle and
    lock out ALL admin logins for the 900s window (DoS; no alternative path for
    admins without WebAuthn). Fix: _real_client_ip() reads X-Real-IP (Caddy
    overwrites it with the real TCP peer {remote_host}, unspoofable; X-Forwarded-For
    is NOT used as Caddy appends to client-supplied XFF). Applied to the login
    throttle, the throttle-status view, and 2 audit-IP sites.
  severity: medium
  controls_impacted:
  - Anti-automation / brute-force throttle correctness (ASVS V2.2.5)
  - Admin availability (lockout DoS)
  status: closed
  closure_evidence:
  - rationale: >-
      LIVE-verified on v3.0.0: after failed logins the throttle key was
      auth:fail:ip:172.24.0.1 (the real client peer set by Caddy via X-Real-IP),
      NOT a Caddy container IP and NOT a client-supplied spoofed X-Real-IP (8.8.8.8
      was overwritten by Caddy). Valid admin login confirmed working (no regression).
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-087
  description: >-
    LAURA-3X-002 (v3.0.0 pre-release pentest, LOW). authenticate() returned
    immediately for a non-existent/disabled username without running argon2, leaking
    a ~130ms vs ~15ms timing delta that enables username enumeration. Fix: run one
    real verify_password against a lazily-computed constant dummy argon2 hash on that
    path (best-effort try/except so timing-equalization can never break auth).
  severity: low
  controls_impacted:
  - Username enumeration resistance (ASVS V2.2.1)
  status: closed
  closure_evidence:
  - rationale: >-
      LIVE-verified on v3.0.0: non-existent-user and real-user-wrong-pw both return
      401 invalid_credentials and both run argon2 (steady-state times converge),
      closing the fast-path leak. NOTE: live-verify first caught a self-inflicted
      regression (dummy password contained 'yashigani' -> PasswordContextError ->
      400), which was fixed (context-valid placeholder) before closure.
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-088
  description: >-
