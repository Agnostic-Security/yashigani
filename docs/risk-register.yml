    per-identity pod spawning via the Kubernetes API (KubernetesBackend in pool/backend.py). This closes the in-cluster
    gap identified in Tom #56 commit 7e653b1 (option b deferred). Trade-off: a compromised gateway pod could create
    arbitrary pods in its namespace. Mitigated by Kyverno admission policies (admission-policies.yaml) which enforce
    non-root, no-new-privileges, and seccomp/AppArmor on ALL pods in the namespace — a compromised gateway cannot
    spawn privileged pods. Per-identity pod isolation now works on K8s (was previously Docker/Podman only). NetworkPolicy
    enforces UA-10: pool-managed pods cannot reach each other (default-deny-egress + no inter-pod ingress rule),
    and can only reach the gateway on port 8080 for LLM dispatch (OPA inspects all traffic).'
