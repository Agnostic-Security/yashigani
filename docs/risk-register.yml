    in any template, no vendor-integrity.lock, no hash check in Dockerfile.backoffice.
    The existing swagger-ui-bundle.js (unversioned, eval present, missing .map) is
    the proof of failure mode. Supply-chain attack: attacker replaces a vendored file
    on disk without updating a lock — ships undetected. (CWE-494, OWASP CI/CD-SEC-3)
  severity: high
  controls_impacted:
  - CWE-494 (Download of Code Without Integrity Check)
  - OWASP CI/CD-SEC-3 (Dependency chain abuse)
  compensating_controls:
  - 4.0 Phase 1 introduces vendor-integrity.lock + Dockerfile.backoffice build-time
    SHA-384 verification + eval-audit script.
  status: closed
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-06-27'
  closed_at: '2026-06-27'
  closure_evidence:
  - rationale: >-
      scripts/vendor-integrity.lock tracks SHA-384 (base64, HTML SRI format) for
      all vendored files. Dockerfile.backoffice RUN layer verifies every entry via
      openssl dgst -sha384 after COPY of static/ — build fails on mismatch.
      scripts/audit-vendor-eval.sh must PASS before any file enters the lock.
      Lit 3.3.3, DOMPurify 3.4.11, marked 18.0.5 all audited PASS and locked.
      swagger-ui remediation (RISK-115) deferred but scoped separately.
  fix_in_version: v4.0
  last_threat_model_review: '2026-06-27'

