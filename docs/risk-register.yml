- id: YSG-RISK-129
  description: >-
    gateway/openai_router.py chat_completions() crashed with
    `UnboundLocalError: cannot access local variable 'assistant_content'`
    (also affects `backend_body`) instead of returning a clean error when a
    backend LLM/agent call failed in a specific way. Found by Captain during
    k8s chat verification alongside the YSG-RISK-113 fix (same request path:
    a dead/slow backend must fail cleanly, never crash the handler).
    Root cause: `assistant_content`/`backend_body` are ONLY assigned inside
    individual success-path branches of the big backend-dispatch try block
    (letta/langflow/openai-compat agent calls, cloud openai/anthropic,
    local ollama) starting at what was line 3194. Every branch that fails
    either raises HTTPException (which propagates straight out of the
    function via the try's own except clauses, never reaching the later
    unconditional reference) or returns a JSONResponse directly — so the
    crash is NOT on those paths. The actual gap: at what was line 2063,
    the entire agent-resolution block (which also owns the
    `if not agent_upstream: return 404` guard) is gated on
    `if is_agent_call and _state.agent_registry:`. When `is_agent_call` is
    True but `_state.agent_registry` itself is falsy (the agent-registry
    dependency, e.g. Redis-backed registry, unavailable/not yet
    initialized), that ENTIRE block — including its own 404 guard — is
    skipped, leaving `agent_upstream = None`. Execution then reaches
    `if is_agent_call and agent_upstream:` (False, agent_upstream is None)
    and `if not is_agent_call:` (False, is_agent_call is True) — NEITHER
    branch runs, no exception is raised, no response is returned, and
    `assistant_content`/`backend_body` are silently unbound. The function
    falls through to the response-inspection section which references
    `assistant_content` unconditionally at what was line 3742
    (`if response_verdict == "clean" and assistant_content:`) →
    UnboundLocalError → unhandled 500 instead of a clean error to the
    caller. This pairs directly with YSG-RISK-113: a backend-availability
    failure (agent registry down) must degrade to a clean 502/503, not
    crash the gateway process path.
  severity: medium
  controls_impacted:
  - Availability / error-handling — CWE-457 (Use of Uninitialized Variable)
    surfacing as an unhandled 500 instead of a well-formed error response on
    a backend-dependency failure; adjacent to CWE-703 (Improper Check or
    Handling of Exceptional Conditions).
  - OWASP API8:2023 (Security Misconfiguration) — a dependency-unavailable
    condition should degrade gracefully, not crash the request handler.
  compensating_controls:
  - The specific trigger (is_agent_call=True with agent_registry falsy) is
    an edge condition during registry-backend outage/startup race, not a
    routinely-hit path — but it IS exactly the class of "backend call
    fails" condition this brief targets, and any future similar branch gap
    in the same dispatch block would hit the identical crash without the
    fail-closed backstop added in the fix.
  status: closed
  accepted_by: null
  accepted_at: null
  review_by: null
  last_threat_model_review: '2026-07-28'
  closure_evidence:
  - rationale: >-
      Two-part fix in gateway/openai_router.py, both defensive (fail-closed,
      no behaviour change on the success path):
      (1) Root-cause guard: added an explicit
      `if is_agent_call and not _state.agent_registry:` branch immediately
      before the existing `if is_agent_call and _state.agent_registry:`
      resolution block, returning a well-formed 503 JSONResponse
      (`agent_registry_unavailable`) instead of silently falling through
      with `agent_upstream` left as None.
      (2) Defense-in-depth backstop: `assistant_content: str | None = None`
      and `backend_body: dict | None = None` are now explicitly initialized
      immediately before the backend-dispatch try block, and a guard
      immediately after the try/except block
      (`if assistant_content is None or backend_body is None: raise
      HTTPException(502, "Backend communication error")`) converts ANY
      future branch-completeness gap in that dispatch block into a clean
      502 instead of an UnboundLocalError, composing with the YSG-RISK-113
      timeout/circuit-breaker fix so a dead/slow backend always fails
      clean — gateway process stays healthy, no crash, no event-loop block.
      Verified locally (no deploy): new regression test
      src/tests/regression/v4.1.2/test_ysg_risk_129_unbound_assistant_content.py
      (a) simulates `is_agent_call=True` with `_state.agent_registry` set
      to None and asserts a clean 503 JSONResponse (no UnboundLocalError,
      no 500), (b) simulates a local-ollama backend call raising
      `httpx.ConnectError`/timeout and asserts a clean 503/502 (not a
      crash), confirming the YSG-RISK-113 failure path composes correctly
      with this fix. ruff clean-diff (118 errors before/after, identical
      rule-code histogram, only line-number shifts from the added code —
      verified via git-stash before/after comparison). mypy clean-diff (3
      pre-existing errors before/after at shifted line numbers only, zero
      new errors — same git-stash method). Full openai_router-adjacent
      pytest subset green.
  fix_in_version: v4.1.2
  last_threat_model_review: '2026-07-28'

- id: YSG-RISK-130
  description: >-
    K8s/Helm: `install.sh`'s `register_agent_bundles()` (Compose/Podman "Step
    11b" — called from the `compose_up` code path only, ~line 19195) is the
    ONLY place any Yashigani deployment ever populates gateway's durable
    agent registry (Postgres `AgentDurableStore` + Redis db/3
    `AgentRegistry`) with the deployed agent bundles (letta/langflow/
    openclaw). It authenticates no admin session — runs a Python script
    directly inside the backoffice container (`compose exec`) that: (1)
    generates a fresh PSK token + bcrypt hash per agent, (2) upserts the
    agent record (name/upstream_url/protocol/groups/allowed_paths/etc.) into
    both the durable Postgres store and the fast Redis path, (3) writes the
    raw token to a host-bind-mounted secrets file for the gateway/agent
    containers to pick up, (4) mints capability envelopes
    (SEC-ENVELOPE-001), (5) restarts the agent containers so they pick up
    their new token.
    `k8s_helm_install()` (line 13888 onward) has NO equivalent call anywhere
    — grepped the entire function body. Agent bundle PODS deploy and run
    healthy on k8s (letta 2/2, langflow/openclaw 1/1 Running, confirmed
    every cycle this session), and each already receives a STABLE,
    Helm-managed token via a K8s Secret (yashigani-{langflow,letta,
    openclaw}-token, key "token", generated once at install time by
    helm/yashigani/templates/secrets.yaml and preserved across upgrades —
    confirmed live, non-empty, stable values) — but gateway's own registry
    is NEVER told these agents exist. Confirmed live via gateway logs:
    "AGENT-RECONCILE: durable store empty and no Redis agents to back-fill"
    / "Gateway agent registry ready: 0 agent(s)" on a freshly, fully green
    k8s deploy (25/25 pods, provenance verified). Every `/user/chat/
    completions` call to @letta/@langflow/@openclaw returns
    `{"error":{"message":"Agent @<name> not found or not active",
    "code":"agent_not_found"}}` — a clean structured error (not a crash,
    unaffected by YSG-RISK-128/129), but the chat/agent path is completely
    unusable on EVERY fresh k8s install regardless of any other fix.
    Found live re-verifying Maxine's chat-target item (c) after YSG-RISK-128
    was fixed and Tom's YSG-RISK-129 crash fix confirmed the underlying
    connectivity/crash issues resolved — this is the fourth, and by
    elimination final, distinct blocker in the chat-target verification
    chain (125 DNS -> 126 bootstrap NetworkPolicy -> 127 chat-proxy
    NetworkPolicy -> 128 Ollama mesh routing -> 129 crash-on-failure ->
    130 agent registration).
  severity: high
  controls_impacted:
  - Availability — the entire @agent chat/agent-dispatch feature surface
    (letta/langflow/openclaw) is non-functional on k8s regardless of pod
    health, image provenance, or any networking fix, on every fresh install.
  compensating_controls:
  - No security boundary crossed — this is a missing-registration
    availability gap, not an authz bypass. Direct-model (non-agent) chat
    calls are unaffected by this specific finding (though currently blocked
    by YSG-RISK-128, tracked separately).
  - A manual workaround exists — an operator can call POST /admin/agents
    (the admin API path) once logged in, to register each bundle by hand.
    Not automated, but not a hard blocker for an operator who knows to do
    this.
  status: mitigated_pending_verify
  accepted_by: null
  accepted_at: null
  review_by: null
  last_threat_model_review: '2026-07-28'
  pending_verification: >-
    Per Lu's findings audit (2026-07-28): closure_evidence below self-describes
    as "code-complete, NOT YET LIVE-VERIFIED — pending Captain's redeploy
    cycle". Downgraded from `mitigated` — closure requires the deferred clean
    k8s redeploy (paused per Tiago for the Docker/Podman legs) confirming all
    4 chat targets (letta/langflow/openclaw/direct-model) return real
    responses.
  closure_evidence:
  - rationale: >-
      NOT YET FIXED. Root-caused and filed by Captain; Maxine's dispatch
      directs implementing a k8s equivalent of register_agent_bundles() —
