    prompt and OPA would allow delivery because response_sensitivity=PUBLIC. (2) Iris SEC-5 — the /agents/* path
    had NO response-leg OPA check at all; agent-to-agent calls were evaluated for the request leg only, leaving
    the response body un-gated. Both gaps share the same root fix: extend ResponseInspectionPipeline to classify
    response-content sensitivity, wire it into both /v1/* and /agents/* OPA response checks.'
