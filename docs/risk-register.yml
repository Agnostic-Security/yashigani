- id: YSG-RISK-075
  description: 'Trust auth without CN binding is insufficient when multiple containers hold valid CA-signed certs.
    `trust clientcert=verify-ca` for pgbouncer_authenticator is a confirmed HIGH security gap. With `trust`, postgres
    validates: (a) cert is CA-signed and (b) client declares role = pgbouncer_authenticator. It does NOT check the
    cert CN against the declared role. Any of the 11 containers on the `data` network holding CA-signed certs (gateway,
    backoffice, open-webui, otel-collector, letta-pgbouncer, etc.) can present their cert and assert role pgbouncer_authenticator.
    postgres trusts them. The attacker then calls ysg_pgbouncer_get_auth(''yashigani_app'') → receives SCRAM verifier
    from pg_shadow → authenticates as yashigani_app → full DB read/write. Blast radius: CRITICAL — all tenant data,
    audit logs, RBAC tables, billing records. Probability: MEDIUM — requires data-network container compromise +
    cert exfil, but 11 cert holders include externally-facing services (gateway, backoffice, open-webui). Identified
    by Laura adversarial probe during release gate v2.24.3 cycle 5. The cycle 5 fix (trust+clientcert) was itself
    the source of this gap — introduced in cycle 5 as a workaround when SCRAM appeared broken (the SCRAM failure
    was a misconfiguration, not a pgbouncer limitation, as confirmed in cycle 6).'
  severity: high
  controls_impacted:
  - Authentication — any CA-cert holder can authenticate as pgbouncer_authenticator
  - Confidentiality — full yashigani DB accessible (all tenant data, audit logs, RBAC)
  - Integrity — attacker with yashigani_app credentials can modify/erase audit log
  compensating_controls:
  - pgbouncer_authenticator role is NOSUPERUSER NOINHERIT with EXECUTE only on ysg_pgbouncer_get_auth and CONNECT
    only to yashigani DB. Blast radius limited to reading pg_shadow entries via the auth function — does not grant
    general superuser or direct table access.
  - SCRAM verifier retrieval requires a further SCRAM replay attack or offline dictionary attack to become usable
    credentials — adds cost but does not block a motivated attacker.
  status: closed
  closure_evidence:
  - commit: 4729d8d
    rationale: 'Cycle 6 (INTERMEDIATE): pg_hba carveout changed to `scram-sha-256 clientcert=verify-ca`. Two-factor
      auth (cert + password) breaks the lateral-pivot for cert-only attackers. However, cycle 6 broke on ARM64/Mac
      Podman due to YSG-RISK-077 SCRAM computation bug — superseded by cycle 7.'
  - commit: 542e800
    rationale: 'Cycle 7/8 (STRONGER CLOSE — BUG-C7-001 fix): cert method + pg_ident CN map. Attack chain analysis:
      cert method implies verify-full — CN must match pg_ident map exactly. pg_ident map restricts to ONLY CN=pgbouncer-auth
      (main pgbouncer) and CN=letta-pgbouncer (letta sidecar). All 11 other data-network cert holders (gateway,
      backoffice, open-webui, otel-collector, etc.) have DIFFERENT CNs — none can impersonate pgbouncer_authenticator.
      The cycle 5 attack chain (any CA-cert holder asserts role pgbouncer_authenticator and postgres trusts it)
      is definitively closed: postgres checks CN via pg_ident before granting access. An attacker needs the PRIVATE
      KEY of pgbouncer-auth_client.crt or letta-pgbouncer_client.crt specifically (not just any CA-signed cert).
      These private keys are mounted EXCLUSIVELY to their respective pgbouncer containers — not shared with any
      other service. Evidence: testing_runs/captain_bug_c7_001_scram_fix_20260525/.'
  fix_in_version: v2.24.3
  last_threat_model_review: '2026-05-25'
- id: YSG-RISK-078
  description: >-
    TOTP algorithm change: SHA-256 → SHA-1 (RFC 6238 default). Yashigani previously
    used HMAC-SHA-256 for TOTP (digest=hashlib.sha256, per maintainer directive
    2026-05-01 / P0-10 "SHA-256 minimum policy"). 19 of 20 testers' authenticator
    apps (Google Authenticator, Microsoft Authenticator, and others) either do not
    support SHA-256 TOTP or silently ignore the algorithm= URI parameter and default
    to SHA-1, producing codes that never match. This was a critical usability blocker
    for fresh installs and operator on-boarding. Decision (Tiago Rosado, 2026-06-14):
    revert to HMAC-SHA1 (RFC 6238 standard default). HMAC-SHA1 is cryptographically
    secure for 6-digit OTP generation: SHA-1 collision attacks (SHAttered, 2017) are
    Merkle-Damgård prefix-collision attacks on digital signatures, not HMAC; RFC 2104
    HMAC-SHA1 has no known exploitable weaknesses in the OTP context; NIST SP 800-63B
    and FIPS 140-2 both permit HMAC-SHA1 for TOTP. Compensating controls: per-account
    secrets (ASVS V2.8), replay prevention (Postgres-backed used_totp_codes, ASVS
    V2.8.3), ±1 window with TOTP backoff, account lockout after 5 failures.
    RE-ENROLLMENT IMPACT: any TOTP secrets enrolled under SHA-256 (deployed stacks
    running v2.23.1–v2.25.5 with P0-10 applied) will cease verifying after upgrade
    because the server now generates SHA-1 codes but the enrolled secret produced
    SHA-256 codes. Fresh installs are unaffected. In-place upgrades require full
    TOTP re-enrollment for all admin accounts (force_totp_provision=true). A
    dual-verify transition path (try SHA-1, fall back to SHA-256 for one window)
    has not been implemented; escalate to Nico if required for a specific deployment.
  severity: low
  controls_impacted:
  - ASVS V2.8 (TOTP algorithm)
  compensating_controls:
  - Per-account TOTP secrets (ASVS V2.8.1)
  - Postgres-backed replay cache (ASVS V2.8.3, AVA-A006 fix)
  - TOTP backoff + account lockout (5 failures)
  - HMAC-SHA1 unaffected by SHA-1 collision attacks (RFC 2104)
  - NIST SP 800-63B and FIPS 140-2 permit HMAC-SHA1 for OTP
  status: accepted
  accepted_by: Tiago Rosado
  accepted_at: '2026-06-14'
  review_by: '2027-06-14'
  closure_evidence: []
  last_threat_model_review: '2026-06-14'
  nico_review_required: true
  notes: >-
    Nico (crypto) should sanity-check this posture at next crypto review.
    If a dual-verify SHA-256→SHA-1 transition window is needed for in-place
    upgrade deployments, raise with Nico before implementing.
