    The tecnativa/docker-socket-proxy replacement for the raw docker.sock mount allowed
    POST /containers/create + POST /containers/{id}/start via CONTAINERS=1 + POST=1 ACL.
    The proxy enforces path/method only — it CANNOT inspect the request body. A compromised
    backoffice could POST /containers/create with HostConfig.Binds=["/:/hostroot:ro"] (passes
    the ACL), start the container, and read /etc/passwd or every mTLS private key under
    /run/secrets from the bind-mounted host root. This gives full host takeover from a single
    compromised network-facing admin container. Original severity mis-registered as LOW (accepted)
    in commit 6fc10fc — Laura proved CRITICAL exploitability live on 2026-06-16.
    Fix (Design A, 2026-06-16): replaced socket-proxy with a pre-spawned hardened extractor
    service (extractor-svc). Backoffice calls it via plain HTTP (extractor_svc internal bridge).
    Backoffice has NO docker socket, NO container API access. A compromised backoffice can only
    POST document bytes to http://extractor-svc:8090/run. The extractor-svc is itself hardened:
    egress=none (internal bridge), read-only rootfs, cap_drop ALL, non-root (UID 65532),
    no-new-privileges, seccomp, AppArmor, mem/pids limits, no host volume mounts, no secrets.
    The host-escape primitive is completely eliminated.
  severity: critical
  controls_impacted:
  - Host isolation — arbitrary host bind-mount from compromised backoffice via socket-proxy body-blind ACL
  - Secret confidentiality — /run/secrets readable by any extractor container the attacker created
  - Container isolation — attacker could spawn privileged containers on the host
  compensating_controls:
  - Prior to fix: backoffice was the only service on extractor_proxy bridge (limiting pivot scope)
  - Prior to fix: Caddy + OPA gated all inbound requests to backoffice (reducing compromise probability)
  - After fix (Design A): NO docker socket in backoffice; HttpExtractorBackend calls extractor-svc over HTTP
  status: closed
  closure_evidence:
  - rationale: >-
      Design A implemented: socket-proxy service removed; extractor-svc service added (yashigani/extractor
      image running server.py as long-running HTTP server). backoffice env updated:
      YASHIGANI_EXTRACTOR_WORKER_URL=http://extractor-svc:8090, YASHIGANI_EXTRACTOR_RUNTIME=http,
      DOCKER_HOST removed. HttpExtractorBackend added to pool/backend.py. extractor_proxy network
      replaced with extractor_svc (internal=true). Laura exploit re-attempted after fix: backoffice
      has no docker socket and no DOCKER_HOST — POST /containers/create is impossible (no path to
      Docker API from within the backoffice container). Doc round-trip verified: REDACT and
      PSEUDONYMIZE both succeeded via the new HTTP extractor backend. All containers healthy.
  fix_in_version: v3.0.1
  last_threat_model_review: '2026-06-16'

- id: YSG-RISK-081
  description: >-
    YSG-080-2255 (converged from the 2.25.5 finalization; renumbered to avoid the
    3.x YSG-RISK-080 docker-socket collision). Duplicate Content-Security-Policy:
    the backoffice app emitted its own CSP and Caddy added one at the edge, so
    responses carried two CSP headers — browsers honour the most restrictive,
    making the policy ambiguous/hard to reason about. Fix: strip the upstream app
    CSP at the Caddy edge (header_down -Content-Security-Policy on every backoffice
    reverse_proxy block across all 3 Caddyfiles); single authoritative CSP at the edge.
  severity: low
  controls_impacted:
  - Defence-in-depth header hygiene (CSP determinism)
  status: closed
  closure_evidence:
  - rationale: >-
      header_down -Content-Security-Policy present in all backoffice blocks of
      Caddyfile.selfsigned/.acme/.ca (27 blocks total); caddy validate passes.
      Live-verified on the v3.0.0 clean install (security headers present, single CSP).
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-082
  description: >-
    YSG-081-2255 (converged). The gateway OPA authorization check was passed the
    raw request path rather than the normalised path, so a non-canonical path
    (e.g. missing leading slash) could reach _opa_check with an unexpected value —
    observed making the JWKS endpoint fail-closed 403. Fix: pass norm_path (the
    already-normalised path used everywhere else in proxy.py) to _opa_check.
  severity: medium
  controls_impacted:
  - Consistent OPA path adjudication at the gateway
  status: closed
  closure_evidence:
  - rationale: >-
      proxy.py _opa_check now receives norm_path. Live-verified: Laura DAST exercised
      authz/OPA paths on v3.0.0 with all controls holding (no fail-closed regression).
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-083
  description: >-
    YSG-082-2255 (converged). Re-provisioning TOTP on an ALREADY-enrolled account
    did not require a fresh step-up, so a hijacked authenticated session could
    silently rotate the victim's TOTP secret and lock them out. Fix: all three TOTP
    provision endpoints (start/confirm/atomic) require assert_fresh_stepup when the
    account already has a TOTP secret and is not in force_totp_provision state
    (first-time enrolment remains exempt by design).
  severity: low
  controls_impacted:
  - Step-up on sensitive account-security mutation (ASVS V6.8.4)
  status: closed
  closure_evidence:
  - rationale: >-
      Step-up guard present on provision_totp_start/confirm/provision. Live-verified:
      Laura DAST confirmed step-up enforced for privileged mutations on v3.0.0.
  fix_in_version: v3.0.0
  last_threat_model_review: '2026-06-25'
- id: YSG-RISK-084
  description: >-
    YSG-083-2255 (converged). SSRF surface on the JWKS fetch in jwt_inspector.
    On the 2.25.5 line a BASIC guard shipped (https-only + reject non-public IPs)
    with gold-plating deferred to 3.1. On the 3.x line the GOLD-PLATED guard
    (commit 307c99d: SSRF-guarded HttpClient, allowlist/DNS-pin posture) is already
    present and was NOT downgraded during convergence.
  severity: low
  controls_impacted:
  - SSRF prevention on outbound JWKS retrieval (CWE-918)
  compensating_controls:
