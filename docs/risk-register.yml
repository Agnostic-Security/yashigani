    /admin/audit/masking/scope/<component>) do not require step-up authentication.
    An attacker with a hijacked admin session (stolen cookie, no TOTP) can alter
    audit masking scope — e.g. set mask_all_by_default=false to expose previously-masked
    display data (IP prefixes, account identifiers) in the audit log UI.
    DAST-proven: PUT /admin/audit/masking/scope succeeds with a fresh session (no step-up).
    (WSTG-ATHZ-02, ASVS V6.8, CWE-306)
