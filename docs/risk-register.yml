  controls_impacted:
  - ASVS V6.8 (step-up for sensitive operations)
  - WSTG-ATHZ-02
  - CWE-306
  compensating_controls:
  - Admin session requires TOTP at login — session hijack requires cookie theft of an active session.
  - Audit data is tamper-evident (SHA-384 hash chain with daily ECDSA-signed Merkle
    checkpoint); masking affects display only, not the underlying record integrity.
  - SIEM config (PUT /admin/audit/siem/config) already requires step-up — higher-value target is protected.
  - Admin sessions allow reading raw audit export without step-up by design.
  status: accepted
  accepted_by: tiago@agnosticsec.com
  accepted_at: '2026-06-26'
  review_by: '2026-07-15'
  closure_evidence:
  - rationale: >-
