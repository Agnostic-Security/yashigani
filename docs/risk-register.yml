      \ Fail-closed on OPA error.\n   Returns HTTP 403 + AGENT_RESPONSE_BLOCKED_BY_OPA audit event on deny.\n5.\
      \ policy/agents.rego gains agent_response_allowed rule with\n   sensitivity_rank helper (duplicated from v1_routing.rego\
