- id: YSG-RISK-061
  description: 'Caddy network egress restricted to allowlist (ACME providers + in-mesh upstreams + DNS) via iptables
    OUTPUT rules in container entrypoint. Reduces post-Caddy-RCE attacker impact by blocking internet exfil, C2,
    and second-stage payload fetch. Probability of Caddy RCE itself unchanged (~10⁻³/yr per Laura cost-benefit LAURA-V241-RESIDUAL-001
    2026-05-25); this is impact reduction. Cross-version effective (KMS-independent). NET_ADMIN capability added
    to Caddy (was: NET_BIND_SERVICE only). NET_ADMIN allows iptables manipulation within the container''s network
    namespace; does not affect host networking. K8s NetworkPolicy (networkpolicy-caddy-egress.yaml) provides equivalent
    kernel-enforced egress restriction as defence-in-depth.'
  severity: informational
  controls_impacted:
  - ASVS V12.6 (network segmentation)
  - NIST SP 800-53 SC-7 (boundary protection)
  - CIS Docker Benchmark §5.10
  compensating_controls:
  - Caddy SHA-pinned to known-clean version (caddy:2.11.2-alpine digest-pinned)
  - cap_drop:[ALL] + cap_add:[NET_BIND_SERVICE, NET_ADMIN]
  - admin API on unix socket (MUST-4 / v2.24.1 hardening)
  - K8s NetworkPolicy networkpolicy-caddy-egress.yaml (infra-layer enforcement)
  - Operator can override ACME allowlist via YASHIGANI_CADDY_EGRESS_ALLOWLIST
  - Graceful fallback in entrypoint — Caddy starts without egress restrictions if NET_ADMIN unavailable (Podman
    rootless), logged as WARN
  status: mitigated
  accepted_by: Tiago
  accepted_at: 2026-05-25
  review_by: 2026-08-25
  closure_evidence:
