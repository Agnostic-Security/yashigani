# Last updated: 2026-07-22T00:00:00+00:00 (feat: 6.0 inference-engine foundation — commodity control plane skeleton)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yashigani-infer"
version = "0.1.0"
description = "Yashigani first-party inference-engine control plane (commodity layer) — thin supervisor + ollama-API shim over llama.cpp/llama-server (GGUF)."
readme = { file = "NOTICE", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Agnostic Security Ltd" }]

# Deliberately minimal runtime surface:
#  - No torch. Conversion (safetensors->GGUF) is an isolated ephemeral v2 job; torch
#    must never be a runtime dependency of this control plane (design doc §3b).
#  - No heavy ML deps. GGUF header parsing is pure-Python (src/yashigani_infer/gguf/).
#  - httpx is used only behind the injectable Downloader interface (adapters/downloader.py);
#    unit tests never hit the network — every test mocks Downloader/ProcessRunner.
dependencies = [
    "fastapi>=0.115",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pydantic>=2.10",
    # ECDSA verify-side only (signed-catalog admission gate, catalog.py) —
    # this package holds a PUBLIC key and verifies; signing/key-mgmt is a
    # separate component (Nico), not built here.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "coverage[toml]>=7",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yashigani_infer" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["yashigani_infer"]
branch = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
strict = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["G"]
