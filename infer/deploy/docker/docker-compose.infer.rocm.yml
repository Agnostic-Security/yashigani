# Backend-selection overlay — ROCm (AMD). See docker-compose.infer.cuda.yml header for the
# Iris F4/F5 image-SWAP rationale (identical logic, different backend).
#
# Captain finding #2 (Red Council 2026-07-29, MEDIUM) — group_add GID stability: `group_add:
# [video, render]` resolves the GROUP NAME against the CONTAINER's own /etc/group (the
# rocm/dev-ubuntu-24.04 base image's baked-in GIDs), not the HOST's. For the grant to
# actually unlock /dev/kfd + /dev/dri on the host, the resolved GID must equal the host
# device node's owning GID -- `video` is commonly stable (Ubuntu fixes 44), but `render` is
# dynamically allocated per-install with no cross-distro guarantee (RHEL/Fedora/SUSE differ
# again). A host/image GID mismatch surfaces as EACCES on /dev/dri/renderD* -- caught by the
# GPU-engaged healthcheck (not silently green) but looks like a driver bug, not a GID
# mismatch, unless someone knows to check.
#
# Fix: numeric-GID-configurable via env vars, defaulting to the pre-fix name-based behaviour
# (safe no-op for hosts where the names already happen to resolve correctly). Before a real
# ROCm deploy, compute the HOST's actual device GIDs and override both vars:
#   stat -c '%g' /dev/kfd            -> YSG_INFER_ROCM_KFD_GID
#   stat -c '%g' /dev/dri/renderD128 -> YSG_INFER_ROCM_RENDER_GID
# (install.sh host-GID-probe wiring to set these automatically is deferred -- Su's lane,
# same pattern as any other host-fact detection, out of scope for this infer/deploy-only
# dispatch). K8s is unaffected -- the AMD device-plugin manages device cgroup rules itself,
# not this compose file.
services:
  infer-classifier:
    image: ${YSG_INFER_IMAGE_ROCM:-yashigani/infer-rocm:local}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${YSG_INFER_ROCM_VIDEO_GID:-video}"
      - "${YSG_INFER_ROCM_RENDER_GID:-render}"
    environment:
      YSG_INFER_BACKEND: rocm
      YSG_INFER_N_GPU_LAYERS: ${YSG_INFER_CLASSIFIER_N_GPU_LAYERS:-999}

  infer-chat:
    image: ${YSG_INFER_IMAGE_ROCM:-yashigani/infer-rocm:local}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${YSG_INFER_ROCM_VIDEO_GID:-video}"
      - "${YSG_INFER_ROCM_RENDER_GID:-render}"
    environment:
      YSG_INFER_BACKEND: rocm
      YSG_INFER_N_GPU_LAYERS: ${YSG_INFER_CHAT_N_GPU_LAYERS:-999}
      YSG_INFER_OVERRIDE_TENSOR: ${YSG_INFER_OVERRIDE_TENSOR:-}
