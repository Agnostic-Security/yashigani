# Podman-runtime overrides for the kuroshio engine.
#
# ROOTLESS-CDI-004 parity (see docker/docker-compose.gpu-podman.yml): podman's nvidia-cdi-hook
# is a crun createContainer hook that writes driver-lib symlinks + ld.so.cache INTO the
# container rootfs at start time — against `read_only: true` it exits 1 and the container
# never starts. Relax read_only ONLY on the CUDA path under Podman; cap_drop:[ALL] +
# no-new-privileges + non-privileged are unaffected (same posture as ollama's podman overlay).
#
# YSG-RISK-074 (Captain finding #8, `podman compose` v2 wrapper forces seccomp:unconfined):
# verification that the custom seccomp profile survives the v2 wrapper is LIVE-ONLY —
# scripts/verify-offline.sh's "podman inspect reports the intended profile, not unconfined"
# release-gate assertion. CORRECTION (found while gate-testing Iris RC-5's devpath-fallback
# overlay, 2026-07-29): this file previously ALSO re-declared `security_opt:
# [no-new-privileges:true, seccomp=...]` here, byte-identical to what docker-compose.kuroshio.yml
# already sets — the original intent ("redundant-but-explicit is deliberate... a harmless
# no-op") does not hold against this toolchain's actual merge behaviour: Compose treats
# exact-duplicate security_opt list entries across merged files as a HARD validation error
# (`docker compose config` fails outright: "services.kuroshio-chat.security_opt items at 0 and 3
# are equal"), not a harmless no-op — and a textual redeclaration of the same value in a
# second YAML file cannot catch a RUNTIME wrapper bug resetting security_opt at the actual
# `podman run` invocation anyway (only the live `podman inspect` check verify-offline.sh
# already documents can do that). Removed the redundant block; the base file's security_opt
# stands unchanged and the live-only verification path remains the real gate.
# Applied ONLY when YSG_GPU_TYPE=nvidia AND runtime=podman (install.sh selects this overlay
# in ADDITION to docker-compose.kuroshio.cuda.yml, mirroring docker-compose.gpu-podman.yml's
# relationship to docker-compose.gpu.yml). The read_only relaxation is scoped to the CUDA
# path only — Vulkan/CPU/ROCm backends under Podman do not need it (no CDI createContainer
# hook writing into rootfs on those paths). NOT applicable to the CDI-failure devpath
# fallback (docker-compose.kuroshio.cuda-podman-devpath.yml) either — direct device-node
# passthrough never invokes the CDI hook, so read_only: true can stand there too; see that
# file's own header for how to combine the two if ever needed.
services:
  kuroshio-classifier:
    read_only: ${YSG_KUROSHIO_PODMAN_CUDA_READ_ONLY:-false}
  kuroshio-chat:
    read_only: ${YSG_KUROSHIO_PODMAN_CUDA_READ_ONLY:-false}
