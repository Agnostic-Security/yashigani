{{- /*
Captain finding #1 hardening requirement: "a dedicated ServiceAccount, RBAC-scoped to
create/delete/get/list on Pods/Jobs INSIDE the kuroshio namespace only, with NO get/list on
Secrets, no bind/escalate verbs, and no cluster-scoped grants."

Namespaced Role + RoleBinding — never a ClusterRole/ClusterRoleBinding for this SA. No
`secrets` resource anywhere in the rule list. No `bind`/`escalate`/`impersonate` verbs.
No `*` resource or `*` verb wildcards.
*/ -}}
{{- if .Values.supervisorRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yashigani-kuroshio.fullname" . }}-supervisor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-kuroshio.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Deliberately ABSENT: secrets, configmaps (write), serviceaccounts, roles/rolebindings
  # (no self-escalation), any cluster-scoped resource, any `bind`/`escalate`/`impersonate`
  # verb, any `*` wildcard.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yashigani-kuroshio.fullname" . }}-supervisor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-kuroshio.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.supervisorRbac.serviceAccountName }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "yashigani-kuroshio.fullname" . }}-supervisor
  apiGroup: rbac.authorization.k8s.io
{{- end }}
