{{- /*
K8s custom `Localhost` seccomp profiles must exist on each node's kubelet seccomp root
(<kubelet-root-dir>/seccomp/profiles/, default /var/lib/kubelet/seccomp/profiles/) — Helm
cannot push files onto node filesystems via a Deployment/Pod spec alone. This DaemonSet
copies the ConfigMap-held profile (single-sourced from
infer/deploy/docker/seccomp/infer-llama-server.json) onto every node once, then the
container sleeps (DaemonSets must have a long-running main container; the actual work
happens in the initContainer). Gated behind seccomp.installViaDaemonSet — when false (or on
a cluster where custom localhost profiles are already provisioned by other means), the
Deployments fall back to seccompProfile.type: RuntimeDefault instead of Localhost (see
deployment-classifier.yaml / deployment-chat.yaml).
*/ -}}
{{- if .Values.seccomp.installViaDaemonSet }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "yashigani-infer.fullname" . }}-seccomp-installer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-infer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "yashigani-infer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: seccomp-installer
  template:
    metadata:
      labels:
        {{- include "yashigani-infer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seccomp-installer
    spec:
      # This DaemonSet's ONLY job is a hostPath file write to the kubelet seccomp root —
      # it intentionally does NOT carry the yashigani.infer.managed label (it is not a
      # supervisor-managed inference pod; the restrict-infer-supervisor-pod-spec Kyverno
      # policy's hostPath-deny rule correctly does not apply to it).
      securityContext:
        runAsNonRoot: false  # root required for the hostPath write target ownership; see below
      initContainers:
        - name: install-profile
          image: busybox:1.36@sha256:PLACEHOLDER-RESOLVE-AT-BUILD-TIME
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /host-seccomp/profiles
              cp /profile-src/infer-llama-server.json /host-seccomp/profiles/infer-llama-server.json
              chmod 0444 /host-seccomp/profiles/infer-llama-server.json
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: profile-source
              mountPath: /profile-src
              readOnly: true
            - name: kubelet-seccomp-root
              mountPath: /host-seccomp
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9@sha256:PLACEHOLDER-RESOLVE-AT-BUILD-TIME
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "8Mi" }
            limits: { cpu: "50m", memory: "16Mi" }
      volumes:
        - name: profile-source
          configMap:
            name: {{ include "yashigani-infer.fullname" . }}-seccomp-llama-server
        - name: kubelet-seccomp-root
          hostPath:
            path: {{ .Values.seccomp.kubeletSeccompRoot | default "/var/lib/kubelet/seccomp/profiles" }}
            type: DirectoryOrCreate
{{- end }}
