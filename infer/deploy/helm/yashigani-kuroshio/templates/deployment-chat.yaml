{{- /*
Captain finding #4: user-facing chat/generate/embeddings models — dedicated Deployment,
physically separate from kuroshio-classifier (never co-scheduled). Blob store read-only.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yashigani-kuroshio.fullname" . }}-chat
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-kuroshio.labels" . | nindent 4 }}
    app.kubernetes.io/component: kuroshio-chat
    yashigani.kuroshio.managed: "true"
spec:
  replicas: {{ .Values.chat.replicas }}
  selector:
    matchLabels:
      {{- include "yashigani-kuroshio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kuroshio-chat
  template:
    metadata:
      labels:
        {{- include "yashigani-kuroshio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kuroshio-chat
        yashigani.kuroshio.managed: "true"
    spec:
      # Explicit anti-affinity to the classifier component — belt-and-suspenders on top of
      # the separate-Deployment/separate-pod boundary already enforced above (finding #4
      # "fail closed rather than silently degrade isolation under a future code change that
      # simplifies scheduling" — this is the scheduling-layer instance of that principle).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: kuroshio-classifier
                topologyKey: kubernetes.io/hostname
      {{- if .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.gpu.nodeSelector | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1002
        fsGroup: 1002
        seccompProfile:
          {{- if .Values.seccomp.installViaDaemonSet }}
          type: Localhost
          localhostProfile: profiles/kuroshio-llama-server.json
          {{- else }}
          type: RuntimeDefault
          {{- end }}
      # Same rationale as deployment-classifier.yaml: pre-create <root>/blobs + <root>/meta
      # on the shared PVC before the main container's read-only BlobStore() construction.
      initContainers:
        - name: init-model-store-dirs
          image: busybox:1.36@sha256:PLACEHOLDER-RESOLVE-AT-BUILD-TIME
          command: ["sh", "-c", "mkdir -p /data/model-store/blobs /data/model-store/meta"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1002
            runAsGroup: 1002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: blobs
              mountPath: /data/model-store
              readOnly: false
      containers:
        - name: kuroshio-chat
          image: {{ include "yashigani-kuroshio.image" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: YSG_KUROSHIO_ROLE
              value: "chat"
            - name: YSG_KUROSHIO_BLOB_STORE_ROOT
              value: "/data/model-store"
            - name: YSG_KUROSHIO_KEEP_ALIVE_PIN
              value: "false"
            - name: YSG_KUROSHIO_MAX_CTX
              value: {{ .Values.chat.maxCtx | quote }}
            - name: YSG_KUROSHIO_MAX_CONCURRENCY
              value: {{ .Values.chat.maxConcurrency | quote }}
            - name: YSG_KUROSHIO_MAX_TOKENS_PER_REQUEST
              value: {{ .Values.chat.maxTokensPerRequest | quote }}
            - name: YSG_KUROSHIO_IDLE_UNLOAD_SECONDS
              value: {{ .Values.chat.idleUnloadSeconds | quote }}
            - name: YSG_KUROSHIO_MAX_RESIDENT_MODELS
              value: {{ .Values.chat.maxResidentModels | quote }}
            - name: YSG_KUROSHIO_EXPECT_GPU
              # Captain finding #7 (Red Council 2026-07-29): backend: cpu MUST cascade
              # expectGpu: false regardless of chat.expectGpu's own default -- mirrors
              # docker-compose.kuroshio.cpu.yml's YSG_KUROSHIO_EXPECT_GPU: "false" override, which
              # already gets this right. Without this cascade, a stock `helm install` (no
              # --set backend=..., no GPU) ships chat.expectGpu's top-level default (true)
              # into the env-var contract Tom's entrypoint/gpu-engaged healthcheck consume,
              # hard-failing /healthz out of the box on the CPU backend.
              value: {{ if eq .Values.backend "cpu" }}"false"{{ else }}{{ .Values.chat.expectGpu | quote }}{{ end }}
            - name: YSG_KUROSHIO_EXPECTED_VRAM_MB
              value: {{ .Values.chat.expectedVramMb | quote }}
            {{- if .Values.chat.overrideTensor }}
            - name: YSG_KUROSHIO_OVERRIDE_TENSOR
              value: {{ .Values.chat.overrideTensor | quote }}
            {{- end }}
            {{- if .Values.gpu.resourceName }}
            - name: YSG_KUROSHIO_N_GPU_LAYERS
              value: "999"
            {{- else }}
            - name: YSG_KUROSHIO_N_GPU_LAYERS
              value: "0"
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
            {{- if .Values.gpu.resourceName }}
            limits:
              {{ .Values.gpu.resourceName }}: {{ .Values.gpu.count }}
            {{- end }}
          volumeMounts:
            - name: blobs
              mountPath: /data/model-store
              readOnly: true
            - name: scratch
              mountPath: /data/scratch
            {{- if and (eq .Values.backend "vulkan") .Values.gpu.vulkanIcdHostPath }}
            # H6 (Captain finding #1, Red Council 2026-07-29): Vulkan ICD host-mount — see
            # values.yaml gpu.vulkanIcdHostPath comment for why this is required alongside
            # gpu.resourceName for the Vulkan/Intel backend to actually engage a GPU.
            - name: vulkan-icd
              mountPath: /usr/share/vulkan/icd.d
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: {{ include "yashigani-kuroshio.fullname" . }}-blobs
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        {{- if and (eq .Values.backend "vulkan") .Values.gpu.vulkanIcdHostPath }}
        - name: vulkan-icd
          hostPath:
            path: {{ .Values.gpu.vulkanIcdHostPath }}
            type: Directory
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yashigani-kuroshio.fullname" . }}-chat
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-kuroshio.labels" . | nindent 4 }}
    app.kubernetes.io/component: kuroshio-chat
spec:
  # C1 (Red Council 2026-07-29, Captain finding #4): sticky routing so one caller lands on
  # the same kuroshio-chat replica across requests -- defense-in-depth at the k8s Service layer
  # pairing with Tom's cache_prompt=off / --parallel llama-server slot-hygiene defaults.
  # This is NOT the load-bearing multi-tenant isolation control: sessionAffinity only scopes
  # k8s load-balancing across chat.replicas, it does nothing for KV-cache/prompt-prefix
  # isolation WITHIN a single shared llama-server process (that's Tom's in-process slot
  # hygiene). True per-tenant isolation is container-per-model (C3 -- supervisorRbac.enabled:
  # false / admissionPolicies.enabled: false by default, gated off until the
  # ContainerOrchestrationHook seam gains a real implementation). Without this, scaling
  # chat.replicas > 1 round-robins requests across N independent slot-hygiene
  # implementations with no routing affinity at all, widening blast radius for zero benefit.
  sessionAffinity: ClientIP
  selector:
    {{- include "yashigani-kuroshio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kuroshio-chat
  ports:
    - port: 8000
      targetPort: 8000
      name: http
