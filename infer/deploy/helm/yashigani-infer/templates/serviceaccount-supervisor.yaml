{{- /*
C3 scoped supervisor privilege (Captain finding #1/#3). Provisioned, not yet consumed by
the v1 subprocess-based supervisor — see values.yaml supervisorRbac.enabled comment.
automountServiceAccountToken: false at the SA level (defense-in-depth default); any future
pod that legitimately needs this SA's token sets it per-pod-spec, not inherited implicitly.
*/ -}}
{{- if .Values.supervisorRbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.supervisorRbac.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-infer.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
