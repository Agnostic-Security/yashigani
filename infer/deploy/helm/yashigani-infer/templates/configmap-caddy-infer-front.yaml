{{- /*
Single-source Caddyfile.infer-front, rendered byte-identically via .Files.Get (Iris F5
correction — NOT the ollama-front hand-sync antipattern; matches the proven
Caddyfile.openclaw-egress .Files.Get pattern in helm/yashigani/templates/configmaps.yaml).
The mirror at files/Caddyfile.infer-front is maintained ONLY by
scripts/sync-infer-deploy-artifacts-to-helm.sh — never hand-edited.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yashigani-infer.fullname" . }}-caddy-front
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-infer.labels" . | nindent 4 }}
data:
  Caddyfile.infer-front: |
{{ .Files.Get "files/Caddyfile.infer-front" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yashigani-infer.fullname" . }}-seccomp-llama-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "yashigani-infer.labels" . | nindent 4 }}
data:
  infer-llama-server.json: |
{{ .Files.Get "files/seccomp/infer-llama-server.json" | indent 4 }}
