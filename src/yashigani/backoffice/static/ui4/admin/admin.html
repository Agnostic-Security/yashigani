<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Yashigani 4.0 ADMIN app (Wave 1) — the 3.0 dashboard.js / dashboard.html
    rebuild on the hardened shared layer (/static/ui4/core/). Served at the
    PARALLEL route /admin4/ so the existing /admin/ keeps working untouched
    during the rebuild; the final /admin/ → ui4 flip happens after all Wave-2
    module groups land.

    The CSP below activates Trusted-Types so the safe-render pipeline runs under
    enforcement even before Su's Caddy headers land (production CSP/TT is Su's
    domain — feat/4.0-csp-vendoring). It MUST stay in lock-step with the canary,
    the user app, and Su's header policy:
      - NO 'unsafe-inline' / 'unsafe-eval' (classes-only CSS, ES-modules only).
      - require-trusted-types-for 'script' (DOM-XSS → CSP violation, fail-closed).
      - trusted-types allowlist names exactly three policies, NO `default`:
          yashigani-render  — our sole sanitisation sink (safe-render.js, §6)
          dompurify         — DOMPurify RETURN_TRUSTED_TYPE policy (§3.1)
          lit-html          — Lit's internal template policy (framework plumbing)
      - connect-src 'self' permits the same-origin /dashboard/* and /admin/*
        admin reads through the audited ApiClient(sessionKind:'admin').

    COORDINATION NOTE (Su, feat/4.0-csp-vendoring): add `/admin4/*` to the Caddy
    strict-TT route set so the production CSP/Trusted-Types header covers this
    app exactly as it covers /chat and /ui4/canary.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; require-trusted-types-for 'script'; trusted-types yashigani-render dompurify lit-html">
  <title>Yashigani — Admin</title>
  <link rel="stylesheet" href="/static/ui4/css/design-system.css">
  <link rel="stylesheet" href="/static/ui4/admin/admin.css">
</head>
<body class="ys-root">
  <ys-admin-app></ys-admin-app>
  <script type="module" src="/static/ui4/admin/admin-app.js"></script>
</body>
</html>
