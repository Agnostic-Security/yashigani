<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yashigani — Chat</title>

  <!--
    Strict CSP meta tag (RISK-102 / shared-layer-spec §1).
    Production enforcement comes from Su's Caddy headers on /chat and /user/*;
    this meta tag exercises the same policy in dev/test so the TT pipeline
    and safe-render are validated end-to-end before Caddy lands.

    Trusted-Types: only the 'yashigani-render' policy (registered by
    core/trusted-types.js at module-eval time) may create TrustedHTML.
    No 'default' policy — fail-closed.

    connect-src covers the SSE chat endpoint (/v1/chat/completions) and all
    /user/* data endpoints.
    report-uri /api/v1/csp-report — Su's user-plane CSP report target.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    object-src 'none';
    base-uri 'none';
    require-trusted-types-for 'script';
    trusted-types yashigani-render;
    connect-src 'self';
    report-uri /api/v1/csp-report;
    report-to default
  ">

  <!-- Design-system CSS (classes-only — no unsafe-inline; RISK-102/115) -->
  <link rel="stylesheet" href="/static/ui4/css/design-system.css">
</head>
<body>
  <!--
    4.0 Phase-2 user SPA — loading point for the Lit-based chat application.

    The entry-point module (chat-app.js) will:
      1. import installTrustedTypes from core/index.js (must be first import)
      2. import ApiClient, streamChat, widgets from core/index.js
      3. Construct ApiClient({ basePath: '', sessionKind: 'user' })
      4. Render the ys-chat-stream + ys-verdict-banner + ys-table widgets
         that compose the user chat surface.

    This stub shell is replaced by the full Phase-2 UI implementation.
    The server-side routes (/user/agents, /user/budget, /user/memory,
    /user/documents, /v1/chat/completions SSE) are already live.
  -->
  <div id="app" class="ys-app-root">
    <noscript>
      <p class="ys-txt-note">JavaScript is required to use Yashigani.</p>
    </noscript>
  </div>

  <!--
    Entry-point ES-module — no inline scripts (strict CSP).
    Phase 2 full implementation replaces this placeholder.
  -->
  <script type="module" src="/static/ui4/chat-app.js"></script>
</body>
</html>
