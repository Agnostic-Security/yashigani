<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Yashigani 4.0 no-code workflow composer (Phase 4, surface 4).
    The user describes a workflow in plain language with @-handles (agents,
    personas, MCPs, APIs), reviews the parsed steps + schedule, and explicitly
    adds it (human-in-the-loop, EU AI Act Art.14). Built on the Phase-1 shared
    layer (/static/ui4/core/) with the same CSP/Trusted-Types posture as the
    other user surfaces — NO unsafe-inline/eval, the safe-render named TT policy
    runs under enforcement, classes-only CSS.

    Trusted-Types: `yashigani-render` (safe-render markdown pipeline, pulled in
    transitively via the shared widgets barrel), `dompurify` (its sanitiser), and
    `lit-html` (Lit's own policy). No `drawflow-label` — this surface renders no
    Drawflow canvas; every parsed field is rendered as text via Lit interpolation.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; require-trusted-types-for 'script'; trusted-types yashigani-render dompurify lit-html">
  <title>Yashigani — Workflows</title>
  <link rel="stylesheet" href="/static/ui4/css/design-system.css">
  <link rel="stylesheet" href="/static/ui4/user/user.css">
</head>
<body class="ys-root">
  <ys-workflow-composer-app></ys-workflow-composer-app>
  <script type="module" src="/static/ui4/user/workflow-composer.js"></script>
</body>
</html>
