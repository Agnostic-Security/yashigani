<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Yashigani 4.0 visual (Drawflow) agent builder (Phase 4, surface 2).
    Same CSP/Trusted-Types posture as chat.html. Drawflow is imported as an
    ES module from the same-origin vendor dir (script-src 'self') and mounted
    ONLY through ui4/core/drawflow-safe.js (RISK-096). The trusted-types
    allowlist adds `drawflow` so the seam may register its own sanitising policy
    if Su's mount needs one; if the seam renders labels purely via textContent
    (no innerHTML sink) the extra name is simply unused. Coordinate with Su
    (feat/4.0-csp-vendoring) on the final header.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; require-trusted-types-for 'script'; trusted-types yashigani-render dompurify lit-html drawflow">
  <title>Yashigani — Builder</title>
  <link rel="stylesheet" href="/static/ui4/css/design-system.css">
  <link rel="stylesheet" href="/static/ui4/user/user.css">
</head>
<body class="ys-root">
  <ys-builder-app></ys-builder-app>
  <script type="module" src="/static/ui4/user/builder-app.js"></script>
</body>
</html>
