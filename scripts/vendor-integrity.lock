# vendor-integrity.lock — SHA-384 integrity hashes for vendored third-party assets
#
# Format: sha384-<base64>  <relative-path-from-repo-root>
#
# These hashes match the integrity= attribute values used in HTML templates.
# The Dockerfile.backoffice build-time gate verifies every entry here against
# the actual file in the image (see Dockerfile.backoffice build-integrity layer).
#
# To update: run the vendor step (see scripts/vendor-audit-log.md), then:
#   openssl dgst -sha384 -binary <file> | openssl base64 -A
# and update the hash here AND in the corresponding HTML template integrity= attribute.
#
# CRITICAL: any change to a file under static/vendor/ MUST produce a lock-file
# update in the same commit. The build-time gate will fail the Docker build
# if hashes do not match.

